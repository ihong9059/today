<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e3a9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0a0a1a"/>
  <g transform="translate(15, 15)">
    <!-- Battery shape -->
    <rect x="15" y="5" width="40" height="60" rx="5" fill="none" stroke="url(#grad)" stroke-width="4"/>
    <rect x="25" y="0" width="20" height="8" rx="3" fill="url(#grad)"/>
    <!-- Energy bars -->
    <rect x="22" y="50" width="26" height="8" rx="2" fill="#00d4ff" opacity="0.5"/>
    <rect x="22" y="38" width="26" height="8" rx="2" fill="#00d4ff" opacity="0.7"/>
    <rect x="22" y="26" width="26" height="8" rx="2" fill="#00d4ff" opacity="0.9"/>
    <rect x="22" y="14" width="26" height="8" rx="2" fill="#00d4ff"/>
  </g>
</svg>
