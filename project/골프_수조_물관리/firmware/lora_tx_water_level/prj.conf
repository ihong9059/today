# UART0 (HW) for LoRa — interrupt driven for RX1 capture
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# SPI for SW-UART TX2 (SPI1) + TX3 (SPI2)
# PAN 58 only affects RX mode; we use SPIM TX-only so override is safe.
CONFIG_SPI=y
CONFIG_SOC_NRF52832_ALLOW_SPIM_DESPITE_PAN_58=y

# GPIO
CONFIG_GPIO=y

# RTT console for build-time debug (printk goes here, not to LoRa UART)
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# Ring buffer for RX byte queuing
CONFIG_RING_BUFFER=y

# Reduce code size
CONFIG_BOOT_BANNER=n
