<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude CLI 챗봇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: #0d1117;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .chat-header {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }

        .status-dot.error {
            background: #ef4444;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #0d1117;
        }

        .message {
            display: flex;
            gap: 15px;
            max-width: 90%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .message-content {
            background: #161b22;
            padding: 15px 18px;
            border-radius: 12px;
            line-height: 1.6;
            color: #c9d1d9;
            border: 1px solid #30363d;
            font-size: 0.95rem;
        }

        .message.user .message-content {
            background: #1f6feb;
            color: white;
            border: none;
        }

        .message-content pre {
            background: #0d1117;
            color: #79c0ff;
            padding: 12px 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            font-family: 'Fira Code', 'Monaco', 'Consolas', monospace;
            font-size: 0.85rem;
            border: 1px solid #30363d;
        }

        .message-content code {
            background: #21262d;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', 'Monaco', 'Consolas', monospace;
            font-size: 0.9em;
            color: #79c0ff;
        }

        .message.user .message-content code {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .chat-input-container {
            padding: 20px 25px;
            background: #161b22;
            border-top: 1px solid #30363d;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #30363d;
            border-radius: 12px;
            font-size: 1rem;
            resize: none;
            outline: none;
            background: #0d1117;
            color: #c9d1d9;
            transition: border-color 0.3s;
            max-height: 150px;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: #d97706;
        }

        .chat-input::placeholder {
            color: #6e7681;
        }

        .send-button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(217, 119, 6, 0.4);
        }

        .send-button:disabled {
            background: #30363d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #d97706;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            padding: 15px 20px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #ef4444;
        }

        .welcome-message {
            text-align: center;
            padding: 60px 40px;
            color: #8b949e;
        }

        .welcome-message h2 {
            color: #d97706;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .welcome-message p {
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .welcome-message .cli-badge {
            display: inline-block;
            background: #21262d;
            padding: 8px 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #79c0ff;
            border: 1px solid #30363d;
        }

        .clear-button {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .clear-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 스크롤바 스타일링 */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        .processing-info {
            font-size: 0.8rem;
            color: #6e7681;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Claude CLI 챗봇</h1>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="status-badge" id="statusBadge">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">확인 중...</span>
                </div>
                <button class="clear-button" onclick="clearChat()">초기화</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h2>Claude CLI 웹 인터페이스</h2>
                <p>Claude CLI를 웹에서 사용할 수 있습니다.<br>
                질문을 입력하고 전송 버튼을 누르세요.</p>
                <div class="cli-badge">claude -p "your message"</div>
            </div>
        </div>

        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <textarea
                    class="chat-input"
                    id="messageInput"
                    placeholder="메시지를 입력하세요... (Shift+Enter로 줄바꿈)"
                    rows="1"
                ></textarea>
                <button class="send-button" id="sendButton" onclick="sendMessage()">
                    <span>전송</span>
                </button>
            </div>
            <div class="processing-info" id="processingInfo"></div>
        </div>
    </div>

    <script>
        let isLoading = false;

        // 상태 확인
        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');

                if (data.status === 'ok') {
                    statusDot.classList.remove('error');
                    statusText.textContent = data.version || 'Ready';
                } else {
                    statusDot.classList.add('error');
                    statusText.textContent = 'CLI 오류';
                }
            } catch (error) {
                document.getElementById('statusDot').classList.add('error');
                document.getElementById('statusText').textContent = '연결 실패';
            }
        }

        // 메시지 전송
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || isLoading) return;

            // 사용자 메시지 표시
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';

            // 로딩 표시
            isLoading = true;
            document.getElementById('sendButton').disabled = true;
            document.getElementById('processingInfo').textContent = 'Claude CLI 호출 중... (최대 2분 소요)';
            const loadingDiv = addTypingIndicator();

            const startTime = Date.now();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                loadingDiv.remove();

                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

                if (data.error) {
                    addErrorMessage(data.error);
                    document.getElementById('processingInfo').textContent = '';
                } else {
                    addMessage('assistant', data.response);
                    document.getElementById('processingInfo').textContent = `응답 시간: ${elapsed}초`;
                }
            } catch (error) {
                loadingDiv.remove();
                addErrorMessage('서버 연결에 실패했습니다.');
                document.getElementById('processingInfo').textContent = '';
            }

            isLoading = false;
            document.getElementById('sendButton').disabled = false;
        }

        // 메시지 추가
        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chatMessages');

            // 환영 메시지 제거
            const welcome = messagesDiv.querySelector('.welcome-message');
            if (welcome) welcome.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = role === 'assistant' ? '🤖' : '👤';
            const formattedContent = formatMessage(content);

            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${formattedContent}</div>
            `;

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 메시지 포맷팅 (마크다운 간단 처리)
        function formatMessage(content) {
            // 코드 블록 처리
            content = content.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            // 인라인 코드 처리
            content = content.replace(/`([^`]+)`/g, '<code>$1</code>');
            // 줄바꿈 처리
            content = content.replace(/\n/g, '<br>');
            // 볼드 처리
            content = content.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            return content;
        }

        // 타이핑 인디케이터 추가
        function addTypingIndicator() {
            const messagesDiv = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return typingDiv;
        }

        // 에러 메시지 추가
        function addErrorMessage(error) {
            const messagesDiv = document.getElementById('chatMessages');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = '⚠️ ' + error;
            messagesDiv.appendChild(errorDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 대화 초기화
        function clearChat() {
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.innerHTML = `
                <div class="welcome-message">
                    <h2>Claude CLI 웹 인터페이스</h2>
                    <p>Claude CLI를 웹에서 사용할 수 있습니다.<br>
                    질문을 입력하고 전송 버튼을 누르세요.</p>
                    <div class="cli-badge">claude -p "your message"</div>
                </div>
            `;
            document.getElementById('processingInfo').textContent = '';
        }

        // 텍스트 영역 자동 크기 조절
        const textarea = document.getElementById('messageInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // Enter 키 처리
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 초기화
        checkStatus();
    </script>
</body>
</html>
