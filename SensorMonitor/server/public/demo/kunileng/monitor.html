<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>건일이엔지 - 실시간 모니터링</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0d47a1;
            --primary-dark: #002171;
            --accent: #1976d2;
            --success: #2e7d32;
            --warning: #f57c00;
            --danger: #c62828;
            --bg-dark: #0a1628;
            --text: #e0e0e0;
            --text-bright: #ffffff;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a237e 50%, #0d47a1 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        nav {
            background: rgba(10, 22, 40, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(25, 118, 210, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--text-bright);
        }

        .logo-sub {
            font-size: 0.7em;
            color: var(--accent);
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            padding: 8px 16px;
            border-radius: 20px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-bright);
            background: rgba(25, 118, 210, 0.3);
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 75px);
        }

        .visualization-panel {
            background: rgba(13, 71, 161, 0.1);
            border: 1px solid rgba(25, 118, 210, 0.3);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .viz-header {
            background: rgba(10, 22, 40, 0.8);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(25, 118, 210, 0.3);
        }

        .viz-title {
            font-size: 1.2em;
            font-weight: 600;
            color: var(--text-bright);
        }

        .equipment-selector {
            display: flex;
            gap: 10px;
        }

        .eq-btn {
            padding: 8px 16px;
            border: 1px solid rgba(25, 118, 210, 0.5);
            background: transparent;
            color: var(--text);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .eq-btn:hover, .eq-btn.active {
            background: var(--accent);
            color: var(--text-bright);
            border-color: var(--accent);
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        .calibrate-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: var(--text-bright);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            z-index: 10;
            box-shadow: 0 5px 20px rgba(25, 118, 210, 0.5);
            transition: all 0.3s;
        }

        .calibrate-btn:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 8px 30px rgba(25, 118, 210, 0.7);
        }

        .orientation-display {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(10, 22, 40, 0.9);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(25, 118, 210, 0.3);
            z-index: 10;
        }

        .orientation-display h4 {
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .orient-value {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.85em;
        }

        .orient-label { color: var(--text); }
        .orient-num { color: var(--text-bright); font-weight: 600; }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-card {
            background: rgba(13, 71, 161, 0.1);
            border: 1px solid rgba(25, 118, 210, 0.3);
            border-radius: 15px;
            padding: 20px;
        }

        .panel-title {
            color: var(--accent);
            font-size: 1em;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sensor-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sensor-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(10, 22, 40, 0.5);
            border-radius: 10px;
            border-left: 3px solid var(--accent);
        }

        .sensor-name {
            font-size: 0.85em;
            color: var(--text);
        }

        .sensor-value {
            font-size: 0.95em;
            font-weight: 600;
            color: var(--text-bright);
        }

        .sensor-item.warning {
            border-left-color: var(--warning);
        }

        .sensor-item.warning .sensor-value {
            color: var(--warning);
        }

        .sensor-item.danger {
            border-left-color: var(--danger);
        }

        .sensor-item.danger .sensor-value {
            color: var(--danger);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .status-item {
            background: rgba(10, 22, 40, 0.5);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .status-value {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--accent);
        }

        .status-label {
            font-size: 0.75em;
            color: var(--text);
            margin-top: 3px;
        }

        .alert-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .alert-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(198, 40, 40, 0.2);
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--danger);
        }

        .alert-item.warning {
            background: rgba(245, 124, 0, 0.2);
            border-left-color: var(--warning);
        }

        .alert-icon {
            font-size: 1.2em;
        }

        .alert-text {
            font-size: 0.85em;
            color: var(--text);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: rgba(10, 22, 40, 0.8);
            border-radius: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--danger);
        }

        .status-dot.connected {
            background: var(--success);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 0.9em;
            color: var(--text);
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: 60vh auto;
            }

            .side-panel {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .panel-card {
                flex: 1;
                min-width: 250px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <div class="logo-icon">&#9889;</div>
            <div>
                <div class="logo-text">건일이엔지</div>
                <div class="logo-sub">스마트 팩토리 솔루션</div>
            </div>
        </div>
        <div class="nav-links">
            <a href="index.html">홈</a>
            <a href="system.html">시스템</a>
            <a href="monitor.html" class="active">모니터링</a>
            <a href="about.html">UTTEC</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="visualization-panel">
            <div class="viz-header">
                <span class="viz-title">3D 설비 자세 모니터링</span>
                <div class="equipment-selector">
                    <button class="eq-btn active" data-type="nct">NCT 펀칭</button>
                    <button class="eq-btn" data-type="laser">레이저 절단</button>
                    <button class="eq-btn" data-type="bending">CNC 절곡</button>
                    <button class="eq-btn" data-type="welding">용접</button>
                </div>
            </div>
            <div id="canvas-container">
                <div class="orientation-display">
                    <h4>설비 자세</h4>
                    <div class="orient-value">
                        <span class="orient-label">Roll (X)</span>
                        <span class="orient-num" id="roll-value">0.0°</span>
                    </div>
                    <div class="orient-value">
                        <span class="orient-label">Pitch (Y)</span>
                        <span class="orient-num" id="pitch-value">0.0°</span>
                    </div>
                    <div class="orient-value">
                        <span class="orient-label">Yaw (Z)</span>
                        <span class="orient-num" id="yaw-value">0.0°</span>
                    </div>
                </div>
                <button class="calibrate-btn" id="calibrate-btn">&#128260; 영점 캘리브레이션</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-card">
                <div class="panel-title">&#128225; 연결 상태</div>
                <div class="connection-status">
                    <div class="status-dot" id="ws-status"></div>
                    <span class="status-text" id="ws-text">연결 대기중...</span>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title">&#128202; 설비 상태</div>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-value" id="oee-value">87.3%</div>
                        <div class="status-label">OEE</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="uptime-value">94.2%</div>
                        <div class="status-label">가동률</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="quality-value">98.5%</div>
                        <div class="status-label">양품률</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="cycle-value">12.4s</div>
                        <div class="status-label">사이클타임</div>
                    </div>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title">&#128200; 실시간 센서</div>
                <div class="sensor-list" id="sensor-list">
                    <div class="sensor-item">
                        <span class="sensor-name">진동 (X축)</span>
                        <span class="sensor-value">2.3 mm/s</span>
                    </div>
                    <div class="sensor-item">
                        <span class="sensor-name">유압압력</span>
                        <span class="sensor-value">185 bar</span>
                    </div>
                    <div class="sensor-item warning">
                        <span class="sensor-name">금형온도</span>
                        <span class="sensor-value">68.5 °C</span>
                    </div>
                    <div class="sensor-item">
                        <span class="sensor-name">스트로크</span>
                        <span class="sensor-value">250.2 mm</span>
                    </div>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title">&#9888; 알림</div>
                <div class="alert-list" id="alert-list">
                    <div class="alert-item warning">
                        <span class="alert-icon">&#9888;</span>
                        <span class="alert-text">NCT #3 금형온도 상승 주의</span>
                    </div>
                    <div class="alert-item">
                        <span class="alert-icon">&#128276;</span>
                        <span class="alert-text">레이저 #2 광학계 점검 필요</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Three.js Setup
        let scene, camera, renderer, equipment;
        let currentType = 'nct';
        const container = document.getElementById('canvas-container');

        // Calibration
        let calibrationOffset = { roll: 0, pitch: 0, yaw: 0 };
        let rawOrientation = { roll: 0, pitch: 0, yaw: 0 };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1628);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(8, 6, 8);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(10, 15, 10);
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0x1976d2, 1, 30);
            pointLight.position.set(-5, 8, 5);
            scene.add(pointLight);

            // Grid
            const gridHelper = new THREE.GridHelper(20, 20, 0x1976d2, 0x0d47a1);
            scene.add(gridHelper);

            createEquipment('nct');
            animate();
        }

        function createEquipment(type) {
            if (equipment) {
                scene.remove(equipment);
            }

            equipment = new THREE.Group();

            const bodyMaterial = new THREE.MeshPhongMaterial({
                color: 0x0d47a1,
                shininess: 100,
                specular: 0x1976d2
            });
            const accentMaterial = new THREE.MeshPhongMaterial({
                color: 0x1976d2,
                shininess: 80
            });
            const metalMaterial = new THREE.MeshPhongMaterial({
                color: 0x607d8b,
                shininess: 120
            });

            if (type === 'nct') {
                // NCT Turret Punch Press
                // Main body
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(4, 2.5, 3),
                    bodyMaterial
                );
                body.position.y = 1.25;
                equipment.add(body);

                // Upper frame (C-frame)
                const upperFrame = new THREE.Mesh(
                    new THREE.BoxGeometry(4, 0.8, 2),
                    bodyMaterial
                );
                upperFrame.position.set(0, 3.5, 0);
                equipment.add(upperFrame);

                // Vertical column
                const column = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 2, 0.6),
                    bodyMaterial
                );
                column.position.set(-1.7, 2.5, 0);
                equipment.add(column);

                // Turret (rotating disc)
                const turret = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.2, 1.2, 0.3, 32),
                    accentMaterial
                );
                turret.position.set(0.5, 2.65, 0);
                equipment.add(turret);

                // Punch tools on turret
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const tool = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.08, 0.08, 0.4, 16),
                        metalMaterial
                    );
                    tool.position.set(
                        0.5 + Math.cos(angle) * 0.8,
                        2.95,
                        Math.sin(angle) * 0.8
                    );
                    equipment.add(tool);
                }

                // Work table
                const table = new THREE.Mesh(
                    new THREE.BoxGeometry(5, 0.2, 4),
                    metalMaterial
                );
                table.position.y = 2.5;
                equipment.add(table);

            } else if (type === 'laser') {
                // Laser Cutting Machine
                // Gantry frame
                const gantryBase = new THREE.Mesh(
                    new THREE.BoxGeometry(6, 0.4, 4),
                    bodyMaterial
                );
                gantryBase.position.y = 0.2;
                equipment.add(gantryBase);

                // Y-axis rails
                const railL = new THREE.Mesh(
                    new THREE.BoxGeometry(0.3, 0.5, 4),
                    metalMaterial
                );
                railL.position.set(-2.5, 0.65, 0);
                equipment.add(railL);

                const railR = railL.clone();
                railR.position.x = 2.5;
                equipment.add(railR);

                // X-axis gantry beam
                const gantry = new THREE.Mesh(
                    new THREE.BoxGeometry(5.5, 0.6, 0.4),
                    accentMaterial
                );
                gantry.position.set(0, 1.5, 0);
                equipment.add(gantry);

                // Laser head carriage
                const carriage = new THREE.Mesh(
                    new THREE.BoxGeometry(0.8, 0.8, 0.5),
                    bodyMaterial
                );
                carriage.position.set(0, 1.5, 0.3);
                equipment.add(carriage);

                // Laser head (nozzle)
                const head = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.15, 0.08, 0.6, 16),
                    metalMaterial
                );
                head.position.set(0, 1.0, 0.3);
                equipment.add(head);

                // Laser beam (visual effect)
                const beamMaterial = new THREE.MeshBasicMaterial({
                    color: 0xff0000,
                    transparent: true,
                    opacity: 0.7
                });
                const beam = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.02, 0.02, 0.5, 8),
                    beamMaterial
                );
                beam.position.set(0, 0.45, 0.3);
                equipment.add(beam);

                // Work table with slats
                const tableFrame = new THREE.Mesh(
                    new THREE.BoxGeometry(5, 0.1, 3.5),
                    metalMaterial
                );
                tableFrame.position.y = 0.5;
                equipment.add(tableFrame);

            } else if (type === 'bending') {
                // CNC Press Brake
                // Main frame
                const frame = new THREE.Mesh(
                    new THREE.BoxGeometry(5, 4, 1.5),
                    bodyMaterial
                );
                frame.position.y = 2;
                equipment.add(frame);

                // Upper beam (ram)
                const ram = new THREE.Mesh(
                    new THREE.BoxGeometry(4.5, 0.6, 1),
                    accentMaterial
                );
                ram.position.set(0, 2.5, 0.8);
                equipment.add(ram);

                // Upper die (punch)
                const upperDie = new THREE.Mesh(
                    new THREE.BoxGeometry(4, 0.3, 0.15),
                    metalMaterial
                );
                upperDie.position.set(0, 2.05, 0.8);
                equipment.add(upperDie);

                // Lower table
                const lowerTable = new THREE.Mesh(
                    new THREE.BoxGeometry(4.5, 0.5, 1),
                    metalMaterial
                );
                lowerTable.position.set(0, 0.75, 0.8);
                equipment.add(lowerTable);

                // V-die
                const vDie = new THREE.Mesh(
                    new THREE.BoxGeometry(4, 0.2, 0.3),
                    new THREE.MeshPhongMaterial({ color: 0x37474f })
                );
                vDie.position.set(0, 1.1, 0.8);
                equipment.add(vDie);

                // Back gauge
                const backGauge = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, 0.3, 0.8),
                    accentMaterial
                );
                backGauge.position.set(0, 1.3, 1.6);
                equipment.add(backGauge);

                // Control panel
                const panel = new THREE.Mesh(
                    new THREE.BoxGeometry(0.8, 1.2, 0.3),
                    new THREE.MeshPhongMaterial({ color: 0x263238 })
                );
                panel.position.set(2.8, 2.5, 0.5);
                equipment.add(panel);

            } else if (type === 'welding') {
                // Spot Welding Machine
                // Main body/transformer
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(1.5, 2, 1),
                    bodyMaterial
                );
                body.position.y = 1;
                equipment.add(body);

                // Upper arm
                const upperArm = new THREE.Mesh(
                    new THREE.BoxGeometry(2.5, 0.3, 0.3),
                    metalMaterial
                );
                upperArm.position.set(0.5, 2.3, 0);
                equipment.add(upperArm);

                // Lower arm
                const lowerArm = new THREE.Mesh(
                    new THREE.BoxGeometry(2.5, 0.3, 0.3),
                    metalMaterial
                );
                lowerArm.position.set(0.5, 0.8, 0);
                equipment.add(lowerArm);

                // Upper electrode holder
                const upperHolder = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.12, 0.12, 0.5, 16),
                    accentMaterial
                );
                upperHolder.position.set(1.7, 2.0, 0);
                equipment.add(upperHolder);

                // Lower electrode holder
                const lowerHolder = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.12, 0.12, 0.5, 16),
                    accentMaterial
                );
                lowerHolder.position.set(1.7, 1.1, 0);
                equipment.add(lowerHolder);

                // Electrodes (copper tips)
                const electrodeMaterial = new THREE.MeshPhongMaterial({
                    color: 0xb87333,
                    shininess: 150
                });
                const upperElectrode = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.05, 0.3, 16),
                    electrodeMaterial
                );
                upperElectrode.position.set(1.7, 1.6, 0);
                equipment.add(upperElectrode);

                const lowerElectrode = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.05, 0.08, 0.3, 16),
                    electrodeMaterial
                );
                lowerElectrode.position.set(1.7, 1.5, 0);
                equipment.add(lowerElectrode);

                // Control box
                const controlBox = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 0.8, 0.4),
                    new THREE.MeshPhongMaterial({ color: 0x263238 })
                );
                controlBox.position.set(-0.3, 2.5, 0.5);
                equipment.add(controlBox);

                // Cables
                const cableMaterial = new THREE.MeshPhongMaterial({ color: 0x212121 });
                const cable1 = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.05, 0.05, 1.5, 8),
                    cableMaterial
                );
                cable1.rotation.z = Math.PI / 4;
                cable1.position.set(-0.3, 2.8, 0);
                equipment.add(cable1);
            }

            scene.add(equipment);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (equipment) {
                const calibratedRoll = rawOrientation.roll - calibrationOffset.roll;
                const calibratedPitch = rawOrientation.pitch - calibrationOffset.pitch;

                equipment.rotation.z = THREE.MathUtils.degToRad(calibratedRoll);
                equipment.rotation.x = THREE.MathUtils.degToRad(calibratedPitch);

                document.getElementById('roll-value').textContent = calibratedRoll.toFixed(1) + '°';
                document.getElementById('pitch-value').textContent = calibratedPitch.toFixed(1) + '°';
                document.getElementById('yaw-value').textContent = rawOrientation.yaw.toFixed(1) + '°';
            }

            renderer.render(scene, camera);
        }

        // Equipment selector buttons
        document.querySelectorAll('.eq-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.eq-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentType = this.dataset.type;
                createEquipment(currentType);
                updateSensorDisplay(currentType);
            });
        });

        function updateSensorDisplay(type) {
            const sensorList = document.getElementById('sensor-list');
            const sensors = {
                nct: [
                    { name: '진동 (X축)', value: '2.3 mm/s', status: '' },
                    { name: '유압압력', value: '185 bar', status: '' },
                    { name: '금형온도', value: '68.5 °C', status: 'warning' },
                    { name: '스트로크', value: '250.2 mm', status: '' }
                ],
                laser: [
                    { name: '광학계 온도', value: '42.3 °C', status: '' },
                    { name: '가스 압력', value: '12.5 bar', status: '' },
                    { name: '노즐 온도', value: '85.2 °C', status: 'warning' },
                    { name: '냉각수 유량', value: '8.5 L/min', status: '' }
                ],
                bending: [
                    { name: '백게이지 위치', value: '125.02 mm', status: '' },
                    { name: '유압 압력', value: '210 bar', status: '' },
                    { name: '램 속도', value: '15 mm/s', status: '' },
                    { name: '절곡 각도', value: '90.1°', status: '' }
                ],
                welding: [
                    { name: '용접 전류', value: '8,500 A', status: '' },
                    { name: '용접 전압', value: '4.2 V', status: '' },
                    { name: '전극 마모', value: '82%', status: 'warning' },
                    { name: '가스 유량', value: '15 L/min', status: '' }
                ]
            };

            sensorList.innerHTML = sensors[type].map(s => `
                <div class="sensor-item ${s.status}">
                    <span class="sensor-name">${s.name}</span>
                    <span class="sensor-value">${s.value}</span>
                </div>
            `).join('');
        }

        // Calibration button
        document.getElementById('calibrate-btn').addEventListener('click', function() {
            calibrationOffset.roll = rawOrientation.roll;
            calibrationOffset.pitch = rawOrientation.pitch;

            // Send calibration reset to server
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'calibrateReset' }));
            }

            this.textContent = '✓ 캘리브레이션 완료';
            setTimeout(() => {
                this.textContent = '🔄 영점 캘리브레이션';
            }, 2000);
        });

        // WebSocket connection
        let ws;
        function connectWebSocket() {
            const wsUrl = 'ws://' + window.location.hostname + ':5000';
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                document.getElementById('ws-status').classList.add('connected');
                document.getElementById('ws-text').textContent = '서버 연결됨';
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.type === 'calibrateReset') {
                    calibrationOffset.roll = rawOrientation.roll;
                    calibrationOffset.pitch = rawOrientation.pitch;
                }

                if (data.type === 'calibratedOrientation') {
                    rawOrientation.roll = data.roll || 0;
                    rawOrientation.pitch = data.pitch || 0;
                }

                if (data.orientation) {
                    rawOrientation.roll = data.orientation.beta || 0;
                    rawOrientation.pitch = data.orientation.gamma || 0;
                    rawOrientation.yaw = data.orientation.alpha || 0;
                }
            };

            ws.onclose = function() {
                document.getElementById('ws-status').classList.remove('connected');
                document.getElementById('ws-text').textContent = '연결 끊김 - 재연결 중...';
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = function() {
                document.getElementById('ws-status').classList.remove('connected');
                document.getElementById('ws-text').textContent = '연결 오류';
            };
        }

        // Simulate sensor data updates
        function simulateSensorData() {
            // Simulate OEE variations
            const oee = (85 + Math.random() * 5).toFixed(1);
            const uptime = (92 + Math.random() * 5).toFixed(1);
            const quality = (97 + Math.random() * 2).toFixed(1);
            const cycle = (11 + Math.random() * 3).toFixed(1);

            document.getElementById('oee-value').textContent = oee + '%';
            document.getElementById('uptime-value').textContent = uptime + '%';
            document.getElementById('quality-value').textContent = quality + '%';
            document.getElementById('cycle-value').textContent = cycle + 's';

            // Small random orientation variations for demo
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                rawOrientation.roll += (Math.random() - 0.5) * 0.5;
                rawOrientation.pitch += (Math.random() - 0.5) * 0.5;
                rawOrientation.yaw += (Math.random() - 0.5) * 0.3;
            }
        }

        // Window resize handler
        window.addEventListener('resize', function() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Initialize
        init();
        connectWebSocket();
        setInterval(simulateSensorData, 2000);
    </script>
</body>
</html>
