<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a9f7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d7a5a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  <!-- Crusher body -->
  <rect x="25" y="30" width="50" height="35" rx="4" fill="#fff" opacity="0.9"/>
  <!-- Feed hopper -->
  <polygon points="35,15 65,15 60,30 40,30" fill="#fff" opacity="0.9"/>
  <!-- Discharge -->
  <polygon points="40,65 60,65 55,80 45,80" fill="#fff" opacity="0.9"/>
  <!-- Rotor (inside crusher) -->
  <circle cx="50" cy="47" r="10" fill="none" stroke="#1a9f7a" stroke-width="3"/>
  <!-- Impact bars -->
  <line x1="42" y1="40" x2="42" y2="54" stroke="#1a9f7a" stroke-width="2"/>
  <line x1="50" y1="37" x2="50" y2="57" stroke="#1a9f7a" stroke-width="2"/>
  <line x1="58" y1="40" x2="58" y2="54" stroke="#1a9f7a" stroke-width="2"/>
  <!-- Rocks/aggregate -->
  <circle cx="50" cy="22" r="3" fill="#1a9f7a"/>
  <circle cx="45" cy="75" r="2" fill="#1a9f7a"/>
  <circle cx="55" cy="76" r="2" fill="#1a9f7a"/>
  <circle cx="50" cy="78" r="1.5" fill="#1a9f7a"/>
</svg>
