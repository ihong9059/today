<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    <linearGradient id="lightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa000"/>
      <stop offset="100%" style="stop-color:#ff6f00"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#blueGrad)"/>

  <!-- Main Gear (Large) -->
  <g fill="url(#lightBlueGrad)">
    <!-- Gear teeth -->
    <rect x="28" y="8" width="8" height="6" rx="1"/>
    <rect x="28" y="50" width="8" height="6" rx="1"/>
    <rect x="8" y="28" width="6" height="8" rx="1"/>
    <rect x="50" y="28" width="6" height="8" rx="1"/>

    <!-- Diagonal teeth -->
    <rect x="14" y="14" width="6" height="6" rx="1" transform="rotate(45 17 17)"/>
    <rect x="44" y="14" width="6" height="6" rx="1" transform="rotate(45 47 17)"/>
    <rect x="14" y="44" width="6" height="6" rx="1" transform="rotate(45 17 47)"/>
    <rect x="44" y="44" width="6" height="6" rx="1" transform="rotate(45 47 47)"/>

    <!-- Gear body -->
    <circle cx="32" cy="32" r="16"/>
  </g>

  <!-- Inner gear ring -->
  <circle cx="32" cy="32" r="12" fill="url(#blueGrad)"/>

  <!-- Small gear (representing worm/helical) -->
  <circle cx="32" cy="32" r="8" fill="url(#accentGrad)"/>

  <!-- Center shaft hole -->
  <circle cx="32" cy="32" r="4" fill="#0d47a1"/>

  <!-- Shaft keyway -->
  <rect x="30" y="28" width="4" height="8" fill="#0d47a1"/>

  <!-- Highlight dots -->
  <circle cx="26" cy="26" r="2" fill="rgba(255,255,255,0.3)"/>

  <!-- Company text -->
  <text x="32" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="white">HSI</text>
</svg>
