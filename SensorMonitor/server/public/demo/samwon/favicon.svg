<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f7a"/>
      <stop offset="100%" style="stop-color:#159895"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#159895"/>
      <stop offset="100%" style="stop-color:#57c5b6"/>
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4a35a"/>
      <stop offset="100%" style="stop-color:#8b7355"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#tealGrad)"/>

  <!-- Taping Machine Frame -->
  <rect x="12" y="20" width="40" height="24" rx="3" fill="#1a5f7a" opacity="0.8"/>

  <!-- Conveyor Belt -->
  <rect x="14" y="36" width="36" height="6" rx="2" fill="#333"/>

  <!-- Conveyor Rollers -->
  <circle cx="18" cy="39" r="2" fill="#555"/>
  <circle cx="26" cy="39" r="2" fill="#555"/>
  <circle cx="34" cy="39" r="2" fill="#555"/>
  <circle cx="42" cy="39" r="2" fill="#555"/>

  <!-- Box on Conveyor -->
  <rect x="26" y="30" width="12" height="8" rx="1" fill="#8b7355"/>

  <!-- Tape Roll (Top) -->
  <circle cx="32" cy="16" r="6" fill="url(#tapeGrad)"/>
  <circle cx="32" cy="16" r="3" fill="#1a1a2e"/>

  <!-- Tape Line -->
  <line x1="32" y1="22" x2="32" y2="30" stroke="#c4a35a" stroke-width="2"/>

  <!-- Tape Head Unit -->
  <rect x="26" y="22" width="12" height="4" rx="1" fill="url(#accentGrad)"/>

  <!-- Side Guides -->
  <rect x="22" y="26" width="2" height="12" rx="1" fill="#888"/>
  <rect x="40" y="26" width="2" height="12" rx="1" fill="#888"/>

  <!-- SW Text -->
  <text x="32" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">SW</text>

  <!-- Status Indicator -->
  <circle cx="52" cy="12" r="6" fill="#1a1a2e"/>
  <circle cx="52" cy="12" r="4" fill="#10b981"/>
</svg>
