<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2cbf"/>
    </linearGradient>
    <linearGradient id="impellerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
  </defs>

  <!-- Shot Blast Chamber -->
  <rect x="8" y="16" width="48" height="40" rx="4" fill="url(#shotGrad)" opacity="0.9"/>

  <!-- Chamber Inner -->
  <rect x="12" y="20" width="40" height="32" rx="2" fill="#1a1a2e"/>

  <!-- Impeller (Rotating Wheel) -->
  <circle cx="32" cy="36" r="12" fill="url(#impellerGrad)" opacity="0.8"/>
  <circle cx="32" cy="36" r="8" fill="#1a1a2e"/>
  <circle cx="32" cy="36" r="4" fill="#00d4ff"/>

  <!-- Impeller Blades -->
  <rect x="30" y="24" width="4" height="8" fill="#4ecdc4" rx="1"/>
  <rect x="30" y="40" width="4" height="8" fill="#4ecdc4" rx="1"/>
  <rect x="20" y="34" width="8" height="4" fill="#4ecdc4" rx="1"/>
  <rect x="36" y="34" width="8" height="4" fill="#4ecdc4" rx="1"/>

  <!-- Shot Particles -->
  <circle cx="18" cy="28" r="2" fill="#ff6b6b"/>
  <circle cx="46" cy="30" r="1.5" fill="#ff6b6b"/>
  <circle cx="22" cy="44" r="1.5" fill="#ff6b6b"/>
  <circle cx="42" cy="46" r="2" fill="#ff6b6b"/>
  <circle cx="26" cy="32" r="1" fill="#ff6b6b"/>
  <circle cx="38" cy="40" r="1" fill="#ff6b6b"/>

  <!-- Top Vent -->
  <rect x="24" y="8" width="16" height="8" rx="2" fill="#7b2cbf"/>
  <rect x="28" y="10" width="8" height="4" rx="1" fill="#1a1a2e"/>

  <!-- Status Indicator -->
  <circle cx="52" cy="12" r="6" fill="#1a1a2e"/>
  <circle cx="52" cy="12" r="4" fill="#4ecdc4"/>
</svg>
