<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>실시간 모니터링 - 한국분체기계 스마트팩토리</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
        }

        nav {
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(92, 107, 192, 0.3);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #5c6bc0, #7986cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            color: #9fa8da;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #5c6bc0;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .live-badge {
            background: #f44336;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .phone-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 0.85rem;
        }
        .phone-control label {
            color: #9fa8da;
            cursor: pointer;
            white-space: nowrap;
        }
        .phone-toggle {
            appearance: none;
            width: 44px;
            height: 24px;
            background: #333;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        .phone-toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        .phone-toggle:checked {
            background: linear-gradient(135deg, #1a237e, #5c6bc0);
        }
        .phone-toggle:checked::after {
            left: 22px;
        }
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #888;
        }
        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
            transition: background 0.3s;
        }
        .connection-dot.connected {
            background: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        .main-content {
            padding-top: 70px;
            display: grid;
            grid-template-columns: 1fr 380px;
            min-height: 100vh;
        }

        .viewer-section {
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .viewer-header h2 {
            font-size: 1.3rem;
        }

        .equipment-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .equipment-btn {
            padding: 8px 16px;
            border: 1px solid rgba(92, 107, 192, 0.3);
            border-radius: 20px;
            background: transparent;
            color: #9fa8da;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .equipment-btn:hover {
            border-color: #5c6bc0;
        }
        .equipment-btn.active {
            background: linear-gradient(135deg, #1a237e, #303f9f);
            border-color: #5c6bc0;
            color: #fff;
        }

        #viewer {
            flex: 1;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(92, 107, 192, 0.2);
            border-radius: 20px;
            overflow: hidden;
            min-height: 500px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.03);
            padding: 10px 15px;
            border-radius: 10px;
        }
        .control-group label {
            color: #9fa8da;
            font-size: 0.9rem;
        }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: 0.3s;
            border-radius: 26px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background: linear-gradient(135deg, #1a237e, #303f9f);
        }
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        .ws-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f44336;
        }
        .ws-status.connected {
            background: #4caf50;
        }

        .orientation-display {
            display: flex;
            gap: 20px;
            background: rgba(255,255,255,0.03);
            padding: 10px 20px;
            border-radius: 10px;
        }
        .orientation-item {
            text-align: center;
        }
        .orientation-label {
            font-size: 0.75rem;
            color: #666;
        }
        .orientation-value {
            font-size: 1.1rem;
            color: #5c6bc0;
            font-weight: 600;
        }

        /* Sidebar */
        .sidebar {
            background: rgba(255,255,255,0.02);
            border-left: 1px solid rgba(92, 107, 192, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 70px);
        }

        .panel {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(92, 107, 192, 0.1);
            border-radius: 15px;
            padding: 20px;
        }
        .panel h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #9fa8da;
        }

        .sensor-item {
            margin-bottom: 15px;
        }
        .sensor-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .sensor-name {
            font-size: 0.85rem;
            color: #888;
        }
        .sensor-value {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .sensor-value.normal { color: #4caf50; }
        .sensor-value.warning { color: #ff9800; }
        .sensor-value.danger { color: #f44336; }

        .sensor-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .sensor-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s, background 0.3s;
        }
        .sensor-bar-fill.normal { background: linear-gradient(90deg, #4caf50, #81c784); }
        .sensor-bar-fill.warning { background: linear-gradient(90deg, #ff9800, #ffb74d); }
        .sensor-bar-fill.danger { background: linear-gradient(90deg, #f44336, #e57373); }

        .chart-container {
            position: relative;
            height: 180px;
        }
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.75rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .alert-list {
            max-height: 150px;
            overflow-y: auto;
        }
        .alert-item {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .alert-item.info {
            background: rgba(92, 107, 192, 0.1);
            border-left: 3px solid #5c6bc0;
        }
        .alert-item.warning {
            background: rgba(255, 152, 0, 0.1);
            border-left: 3px solid #ff9800;
        }
        .alert-item.danger {
            background: rgba(244, 67, 54, 0.1);
            border-left: 3px solid #f44336;
        }
        .alert-time {
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
        }

        .scenario-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .scenario-btn {
            padding: 12px 15px;
            border: 1px solid rgba(92, 107, 192, 0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-size: 0.9rem;
        }
        .scenario-btn:hover {
            border-color: #5c6bc0;
            background: rgba(92, 107, 192, 0.1);
        }
        .scenario-btn.active {
            border-color: #5c6bc0;
            background: rgba(92, 107, 192, 0.2);
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .sidebar {
                max-height: none;
            }
            #viewer {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <div class="logo">KPSM Smart Factory</div>
            <div class="nav-links">
                <a href="index.html">홈</a>
                <a href="system.html">시스템 구성</a>
                <a href="monitor.html" class="active">실시간 모니터링</a>
                <a href="about.html">UTTEC 소개</a>
            </div>
        </div>
        <div class="nav-right">
            <span class="live-badge">LIVE</span>
            <div class="phone-control">
                <label for="phoneToggle">스마트폰 연동</label>
                <input type="checkbox" id="phoneToggle" class="phone-toggle" onchange="togglePhoneConnection()">
            </div>
            <div class="connection-status">
                <div class="connection-dot" id="connectionDot"></div>
                <span id="connectionText">연결 대기</span>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="viewer-section">
            <div class="viewer-header">
                <h2>3D 설비 모니터링</h2>
                <div class="equipment-selector">
                    <button class="equipment-btn active" onclick="selectEquipment('jetmill')">Air Jet Mill</button>
                    <button class="equipment-btn" onclick="selectEquipment('acm')">ACM</button>
                    <button class="equipment-btn" onclick="selectEquipment('turbo')">Turbo Mill</button>
                    <button class="equipment-btn" onclick="selectEquipment('mixer')">혼합기</button>
                </div>
            </div>

            <div id="viewer"></div>

            <div class="controls">
                <div class="control-group">
                    <label>자동 회전</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="autoRotate" onchange="toggleAutoRotate()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="control-group">
                    <label>스마트폰 연동</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="orientationToggle" onchange="toggleOrientationSource()">
                        <span class="toggle-slider"></span>
                    </label>
                    <div class="ws-status" id="wsStatus"></div>
                </div>
                <div class="orientation-display">
                    <div class="orientation-item">
                        <div class="orientation-label">Alpha</div>
                        <div class="orientation-value" id="alphaValue">0°</div>
                    </div>
                    <div class="orientation-item">
                        <div class="orientation-label">Beta</div>
                        <div class="orientation-value" id="betaValue">0°</div>
                    </div>
                    <div class="orientation-item">
                        <div class="orientation-label">Gamma</div>
                        <div class="orientation-value" id="gammaValue">0°</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h3>센서 현황</h3>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">진동</span>
                        <span class="sensor-value normal" id="vibration">2.4 mm/s</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="vibrationBar" style="width: 24%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">베어링 온도</span>
                        <span class="sensor-value normal" id="temperature">45.2 °C</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="temperatureBar" style="width: 45%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">모터 전류</span>
                        <span class="sensor-value normal" id="current">32.5 A</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="currentBar" style="width: 40%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">공압</span>
                        <span class="sensor-value normal" id="pressure">6.2 bar</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="pressureBar" style="width: 62%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">집진기 차압</span>
                        <span class="sensor-value normal" id="diffPressure">120 Pa</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="diffPressureBar" style="width: 24%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">로터 RPM</span>
                        <span class="sensor-value normal" id="rpm">3,200</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="rpmBar" style="width: 64%"></div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>트렌드 (최근 60초)</h3>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
                <div class="chart-legend">
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #4caf50"></span>
                        <span>진동</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #ff9800"></span>
                        <span>온도</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #2196f3"></span>
                        <span>전류</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #9c27b0"></span>
                        <span>공압</span>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>알림</h3>
                <div class="alert-list" id="alertList">
                    <div class="alert-item info">
                        Air Jet Mill 정상 운전 중
                        <div class="alert-time">방금 전</div>
                    </div>
                    <div class="alert-item info">
                        공압 시스템 정상
                        <div class="alert-time">2분 전</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>시나리오</h3>
                <div class="scenario-buttons">
                    <button class="scenario-btn active" onclick="setScenario('normal')">
                        정상 운전
                    </button>
                    <button class="scenario-btn" onclick="setScenario('rotor')">
                        로터 불균형
                    </button>
                    <button class="scenario-btn" onclick="setScenario('bearing')">
                        베어링 이상
                    </button>
                    <button class="scenario-btn" onclick="setScenario('pressure')">
                        공압 저하
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Three.js Setup
        let scene, camera, renderer, equipment;
        let autoRotate = false;
        let targetRotation = { x: 0, y: 0, z: 0 };
        let currentRotation = { x: 0, y: 0, z: 0 };
        let useRealOrientation = false;
        let remoteOrientation = { alpha: 0, beta: 0, gamma: 0 };
        let calibratedOrientation = { roll: 0, pitch: 0 };
        let ws = null;

        function init() {
            const container = document.getElementById('viewer');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(6, 5, 8);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0x5c6bc0, 0.5);
            pointLight.position.set(-5, 5, -5);
            scene.add(pointLight);

            // Grid
            const gridHelper = new THREE.GridHelper(10, 20, 0x333333, 0x222222);
            scene.add(gridHelper);

            // Create Jet Mill
            createJetMill();

            window.addEventListener('resize', onWindowResize);
            animate();

            // Initialize WebSocket
            initWebSocket();
        }

        function createJetMill() {
            if (equipment) scene.remove(equipment);
            equipment = new THREE.Group();

            // Base
            const baseGeometry = new THREE.CylinderGeometry(2.5, 2.8, 0.4, 32);
            const baseMaterial = new THREE.MeshPhongMaterial({ color: 0x444444 });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = 0.2;
            equipment.add(base);

            // Main Chamber (Grinding Chamber)
            const chamberGeometry = new THREE.CylinderGeometry(1.5, 1.5, 1.2, 32);
            const chamberMaterial = new THREE.MeshPhongMaterial({ color: 0x1a237e });
            const chamber = new THREE.Mesh(chamberGeometry, chamberMaterial);
            chamber.position.y = 1;
            equipment.add(chamber);

            // Classifier top
            const topGeometry = new THREE.CylinderGeometry(0.8, 1.5, 0.8, 32);
            const topMaterial = new THREE.MeshPhongMaterial({ color: 0x303f9f });
            const top = new THREE.Mesh(topGeometry, topMaterial);
            top.position.y = 2;
            equipment.add(top);

            // Air Nozzles (4 around the chamber)
            for (let i = 0; i < 4; i++) {
                const angle = (i / 4) * Math.PI * 2;
                const nozzleGeometry = new THREE.CylinderGeometry(0.1, 0.15, 0.8, 16);
                const nozzleMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
                const nozzle = new THREE.Mesh(nozzleGeometry, nozzleMaterial);
                nozzle.position.set(Math.cos(angle) * 1.8, 1, Math.sin(angle) * 1.8);
                nozzle.rotation.z = Math.PI / 2;
                nozzle.rotation.y = angle;
                equipment.add(nozzle);
            }

            // Output pipe
            const outputGeometry = new THREE.CylinderGeometry(0.3, 0.3, 1.2, 16);
            const outputMaterial = new THREE.MeshPhongMaterial({ color: 0x555555 });
            const output = new THREE.Mesh(outputGeometry, outputMaterial);
            output.position.y = 3;
            equipment.add(output);

            // Sensor indicators
            const sensorGeometry = new THREE.SphereGeometry(0.08, 16, 16);
            const sensorMaterial = new THREE.MeshPhongMaterial({
                color: 0x4caf50,
                emissive: 0x4caf50,
                emissiveIntensity: 0.5
            });

            const sensorPositions = [
                { x: 1.6, y: 1, z: 0 },
                { x: 0, y: 1, z: 1.6 },
                { x: -1.6, y: 1, z: 0 },
                { x: 0, y: 2.5, z: 0.4 }
            ];
            sensorPositions.forEach(pos => {
                const sensor = new THREE.Mesh(sensorGeometry, sensorMaterial);
                sensor.position.set(pos.x, pos.y, pos.z);
                equipment.add(sensor);
            });

            scene.add(equipment);
        }

        function createACM() {
            if (equipment) scene.remove(equipment);
            equipment = new THREE.Group();

            // Base
            const baseGeometry = new THREE.BoxGeometry(3, 0.3, 2);
            const baseMaterial = new THREE.MeshPhongMaterial({ color: 0x444444 });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = 0.15;
            equipment.add(base);

            // Main body
            const bodyGeometry = new THREE.CylinderGeometry(1, 1, 1.8, 32);
            const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x1a237e });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.set(0, 1.2, 0);
            equipment.add(body);

            // Motor
            const motorGeometry = new THREE.BoxGeometry(0.8, 0.6, 0.6);
            const motorMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
            const motor = new THREE.Mesh(motorGeometry, motorMaterial);
            motor.position.set(-1.5, 0.8, 0);
            equipment.add(motor);

            // Hopper
            const hopperGeometry = new THREE.ConeGeometry(0.6, 0.8, 4);
            const hopperMaterial = new THREE.MeshPhongMaterial({ color: 0x888888 });
            const hopper = new THREE.Mesh(hopperGeometry, hopperMaterial);
            hopper.position.set(0, 2.5, 0);
            hopper.rotation.x = Math.PI;
            equipment.add(hopper);

            // Output
            const outputGeometry = new THREE.CylinderGeometry(0.25, 0.35, 0.6, 16);
            const outputMaterial = new THREE.MeshPhongMaterial({ color: 0x888888 });
            const output = new THREE.Mesh(outputGeometry, outputMaterial);
            output.position.set(1, 0.8, 0);
            output.rotation.z = Math.PI / 2;
            equipment.add(output);

            // Sensors
            const sensorGeometry = new THREE.SphereGeometry(0.08, 16, 16);
            const sensorMaterial = new THREE.MeshPhongMaterial({
                color: 0x4caf50,
                emissive: 0x4caf50,
                emissiveIntensity: 0.5
            });
            [[1.1, 1.2, 0], [0, 1.2, 1.1], [-1.1, 0.8, 0]].forEach(pos => {
                const sensor = new THREE.Mesh(sensorGeometry, sensorMaterial);
                sensor.position.set(...pos);
                equipment.add(sensor);
            });

            scene.add(equipment);
        }

        function createTurboMill() {
            if (equipment) scene.remove(equipment);
            equipment = new THREE.Group();

            // Base frame
            const frameGeometry = new THREE.BoxGeometry(3.5, 0.2, 2);
            const frameMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
            const frame = new THREE.Mesh(frameGeometry, frameMaterial);
            frame.position.y = 0.1;
            equipment.add(frame);

            // Mill housing
            const housingGeometry = new THREE.CylinderGeometry(0.9, 0.9, 1.5, 32);
            const housingMaterial = new THREE.MeshPhongMaterial({ color: 0x303f9f });
            const housing = new THREE.Mesh(housingGeometry, housingMaterial);
            housing.position.set(0, 1, 0);
            housing.rotation.z = Math.PI / 2;
            equipment.add(housing);

            // Motor
            const motorGeometry = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 32);
            const motorMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
            const motor = new THREE.Mesh(motorGeometry, motorMaterial);
            motor.position.set(-1.5, 1, 0);
            motor.rotation.z = Math.PI / 2;
            equipment.add(motor);

            // Input hopper
            const hopperGeometry = new THREE.ConeGeometry(0.4, 0.6, 4);
            const hopperMaterial = new THREE.MeshPhongMaterial({ color: 0x888888 });
            const hopper = new THREE.Mesh(hopperGeometry, hopperMaterial);
            hopper.position.set(0, 2, 0);
            hopper.rotation.x = Math.PI;
            equipment.add(hopper);

            // Output
            const outputGeometry = new THREE.CylinderGeometry(0.25, 0.25, 0.8, 16);
            const outputMaterial = new THREE.MeshPhongMaterial({ color: 0x888888 });
            const output = new THREE.Mesh(outputGeometry, outputMaterial);
            output.position.set(0, 0, 0);
            equipment.add(output);

            // Sensors
            const sensorGeometry = new THREE.SphereGeometry(0.08, 16, 16);
            const sensorMaterial = new THREE.MeshPhongMaterial({
                color: 0x4caf50,
                emissive: 0x4caf50,
                emissiveIntensity: 0.5
            });
            [[0.5, 1.5, 0.5], [-0.5, 1, 0.9], [-1.2, 1, 0]].forEach(pos => {
                const sensor = new THREE.Mesh(sensorGeometry, sensorMaterial);
                sensor.position.set(...pos);
                equipment.add(sensor);
            });

            scene.add(equipment);
        }

        function createMixer() {
            if (equipment) scene.remove(equipment);
            equipment = new THREE.Group();

            // Base
            const baseGeometry = new THREE.BoxGeometry(3, 0.3, 1.5);
            const baseMaterial = new THREE.MeshPhongMaterial({ color: 0x444444 });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = 0.15;
            equipment.add(base);

            // Horizontal drum
            const drumGeometry = new THREE.CylinderGeometry(0.7, 0.7, 2.5, 32);
            const drumMaterial = new THREE.MeshPhongMaterial({ color: 0x1a237e });
            const drum = new THREE.Mesh(drumGeometry, drumMaterial);
            drum.position.set(0, 1.2, 0);
            drum.rotation.z = Math.PI / 2;
            equipment.add(drum);

            // End caps
            const capGeometry = new THREE.CylinderGeometry(0.72, 0.72, 0.1, 32);
            const capMaterial = new THREE.MeshPhongMaterial({ color: 0x303f9f });
            [-1.3, 1.3].forEach(x => {
                const cap = new THREE.Mesh(capGeometry, capMaterial);
                cap.position.set(x, 1.2, 0);
                cap.rotation.z = Math.PI / 2;
                equipment.add(cap);
            });

            // Motor
            const motorGeometry = new THREE.BoxGeometry(0.6, 0.5, 0.5);
            const motorMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
            const motor = new THREE.Mesh(motorGeometry, motorMaterial);
            motor.position.set(1.8, 1.2, 0);
            equipment.add(motor);

            // Input
            const inputGeometry = new THREE.ConeGeometry(0.3, 0.5, 4);
            const inputMaterial = new THREE.MeshPhongMaterial({ color: 0x888888 });
            const input = new THREE.Mesh(inputGeometry, inputMaterial);
            input.position.set(-0.5, 2.2, 0);
            input.rotation.x = Math.PI;
            equipment.add(input);

            // Sensors
            const sensorGeometry = new THREE.SphereGeometry(0.08, 16, 16);
            const sensorMaterial = new THREE.MeshPhongMaterial({
                color: 0x4caf50,
                emissive: 0x4caf50,
                emissiveIntensity: 0.5
            });
            [[0, 1.2, 0.75], [1, 1.2, 0.75], [1.5, 1.2, 0]].forEach(pos => {
                const sensor = new THREE.Mesh(sensorGeometry, sensorMaterial);
                sensor.position.set(...pos);
                equipment.add(sensor);
            });

            scene.add(equipment);
        }

        function selectEquipment(type) {
            document.querySelectorAll('.equipment-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            switch(type) {
                case 'jetmill': createJetMill(); break;
                case 'acm': createACM(); break;
                case 'turbo': createTurboMill(); break;
                case 'mixer': createMixer(); break;
            }
        }

        function toggleAutoRotate() {
            autoRotate = document.getElementById('autoRotate').checked;
        }

        function onWindowResize() {
            const container = document.getElementById('viewer');
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // WebSocket
        function initWebSocket() {
            const wsUrl = `ws://${window.location.host}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                updateConnectionStatus(true);
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'calibrateReset') {
                        targetRotation = { x: 0, y: 0, z: 0 };
                        currentRotation = { x: 0, y: 0, z: 0 };
                        calibratedOrientation = { roll: 0, pitch: 0 };
                        if (equipment) {
                            equipment.rotation.x = 0;
                            equipment.rotation.y = 0;
                            equipment.rotation.z = 0;
                        }
                        updateOrientationDisplay(0, 0, 0);
                        return;
                    }
                    if (data.type === 'calibratedOrientation') {
                        calibratedOrientation = { roll: data.roll || 0, pitch: data.pitch || 0 };
                        if (useRealOrientation) {
                            updateOrientationDisplay(0, calibratedOrientation.pitch, calibratedOrientation.roll);
                        }
                        return;
                    }
                    if (data.orientation && data.orientation.timestamp) {
                        remoteOrientation = {
                            alpha: data.orientation.alpha || 0,
                            beta: data.orientation.beta || 0,
                            gamma: data.orientation.gamma || 0
                        };
                        if (useRealOrientation) {
                            updateOrientationDisplay(remoteOrientation.alpha, remoteOrientation.beta, remoteOrientation.gamma);
                        }
                    }
                } catch (e) {}
            };

            ws.onclose = function() {
                updateConnectionStatus(false);
                setTimeout(initWebSocket, 3000);
            };
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('connectionDot');
            const text = document.getElementById('connectionText');
            if (connected) {
                dot.classList.add('connected');
                text.textContent = '연결됨';
            } else {
                dot.classList.remove('connected');
                text.textContent = '연결 대기';
            }
        }

        function togglePhoneConnection() {
            useRealOrientation = document.getElementById('phoneToggle').checked;
            if (!useRealOrientation) {
                targetRotation = { x: 0, y: 0, z: 0 };
                currentRotation = { x: 0, y: 0, z: 0 };
                calibratedOrientation = { roll: 0, pitch: 0 };
                if (equipment) {
                    equipment.rotation.x = 0;
                    equipment.rotation.y = 0;
                    equipment.rotation.z = 0;
                }
                updateOrientationDisplay(0, 0, 0);
            }
        }

        function toggleOrientationSource() {
            useRealOrientation = document.getElementById('orientationToggle')?.checked || document.getElementById('phoneToggle')?.checked || false;
            if (!useRealOrientation) {
                targetRotation = { x: 0, y: 0, z: 0 };
                currentRotation = { x: 0, y: 0, z: 0 };
            }
        }

        function updateOrientationDisplay(alpha, beta, gamma) {
            const alphaEl = document.getElementById('alphaValue');
            const betaEl = document.getElementById('betaValue');
            const gammaEl = document.getElementById('gammaValue');
            if (alphaEl) alphaEl.textContent = Math.round(alpha) + '°';
            if (betaEl) betaEl.textContent = Math.round(beta) + '°';
            if (gammaEl) gammaEl.textContent = Math.round(gamma) + '°';
        }

        function animate() {
            requestAnimationFrame(animate);

            if (equipment) {
                if (useRealOrientation) {
                    const toRad = Math.PI / 180;
                    targetRotation.z = calibratedOrientation.roll * toRad;
                    targetRotation.x = calibratedOrientation.pitch * toRad;

                    currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
                    currentRotation.z += (targetRotation.z - currentRotation.z) * 0.1;
                    equipment.rotation.x = currentRotation.x;
                    equipment.rotation.z = currentRotation.z;
                    equipment.rotation.y = Math.sin(Date.now() * 0.0005) * 0.05;
                } else if (autoRotate) {
                    equipment.rotation.y += 0.005;
                }
            }

            renderer.render(scene, camera);
        }

        // Sensor simulation
        let currentScenario = 'normal';
        let degradeCounter = 0;

        let sensorValues = {
            vibration: { current: 2.4, target: 2.4, unit: 'mm/s' },
            temperature: { current: 45, target: 45, unit: '°C' },
            current: { current: 32.5, target: 32.5, unit: 'A' },
            pressure: { current: 6.2, target: 6.2, unit: 'bar' },
            diffPressure: { current: 120, target: 120, unit: 'Pa' },
            rpm: { current: 3200, target: 3200, unit: '' }
        };

        const thresholds = {
            vibration: { warning: 4.5, danger: 7.0, max: 10 },
            temperature: { warning: 65, danger: 80, max: 100 },
            current: { warning: 50, danger: 65, max: 80 },
            pressure: { warning: 5, danger: 4, max: 10 },
            diffPressure: { warning: 300, danger: 400, max: 500 },
            rpm: { warning: 3800, danger: 4200, max: 5000 }
        };

        // Trend chart
        let trendChart = null;
        let trendData = { labels: [], vibration: [], temperature: [], current: [], pressure: [] };
        const maxDataPoints = 60;

        function initTrendChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: trendData.labels,
                    datasets: [
                        {
                            label: '진동',
                            data: trendData.vibration,
                            borderColor: '#4caf50',
                            backgroundColor: 'rgba(76, 175, 80, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            fill: true
                        },
                        {
                            label: '온도',
                            data: trendData.temperature,
                            borderColor: '#ff9800',
                            backgroundColor: 'rgba(255, 152, 0, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            fill: true,
                            yAxisID: 'y1'
                        },
                        {
                            label: '전류',
                            data: trendData.current,
                            borderColor: '#2196f3',
                            backgroundColor: 'rgba(33, 150, 243, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            fill: true,
                            yAxisID: 'y1'
                        },
                        {
                            label: '공압',
                            data: trendData.pressure,
                            borderColor: '#9c27b0',
                            backgroundColor: 'rgba(156, 39, 176, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            fill: true,
                            yAxisID: 'y2'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(10, 10, 26, 0.9)',
                            titleColor: '#fff',
                            bodyColor: '#aaa'
                        }
                    },
                    scales: {
                        x: { display: false },
                        y: {
                            position: 'left',
                            min: 0,
                            max: 10,
                            ticks: { color: '#666', font: { size: 10 } },
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            title: { display: true, text: 'mm/s', color: '#4caf50', font: { size: 9 } }
                        },
                        y1: {
                            position: 'right',
                            min: 0,
                            max: 100,
                            ticks: { color: '#666', font: { size: 10 } },
                            grid: { display: false },
                            title: { display: true, text: '°C / A', color: '#ff9800', font: { size: 9 } }
                        },
                        y2: {
                            display: false,
                            min: 0,
                            max: 10
                        }
                    },
                    animation: { duration: 300 }
                }
            });
        }

        function updateTrendChart() {
            const now = new Date();
            const timeLabel = now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

            trendData.labels.push(timeLabel);
            trendData.vibration.push(sensorValues.vibration.current);
            trendData.temperature.push(sensorValues.temperature.current);
            trendData.current.push(sensorValues.current.current);
            trendData.pressure.push(sensorValues.pressure.current);

            if (trendData.labels.length > maxDataPoints) {
                trendData.labels.shift();
                trendData.vibration.shift();
                trendData.temperature.shift();
                trendData.current.shift();
                trendData.pressure.shift();
            }

            if (trendChart) trendChart.update('none');
        }

        function setScenario(scenario) {
            currentScenario = scenario;
            degradeCounter = 0;
            document.querySelectorAll('.scenario-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            switch(scenario) {
                case 'rotor':
                    addAlert('warning', '로터 불균형 진동 증가 감지');
                    break;
                case 'bearing':
                    addAlert('danger', '베어링 이상 징후 (온도 상승)');
                    break;
                case 'pressure':
                    addAlert('warning', '공압 시스템 압력 저하');
                    break;
                case 'normal':
                    addAlert('info', '정상 운전 모드');
                    break;
            }
        }

        function addAlert(type, message) {
            const alertList = document.getElementById('alertList');
            const alert = document.createElement('div');
            alert.className = `alert-item ${type}`;
            alert.innerHTML = `${message}<div class="alert-time">방금 전</div>`;
            alertList.insertBefore(alert, alertList.firstChild);
            if (alertList.children.length > 5) {
                alertList.removeChild(alertList.lastChild);
            }
        }

        function generateTargetValues() {
            const scenarios = {
                normal: {
                    vibration: 2 + Math.random() * 1.5,
                    temperature: 42 + Math.random() * 8,
                    current: 30 + Math.random() * 8,
                    pressure: 6 + Math.random() * 0.5,
                    diffPressure: 100 + Math.random() * 50,
                    rpm: 3100 + Math.random() * 200
                },
                rotor: {
                    vibration: 5 + Math.random() * 2.5 + degradeCounter * 0.15,
                    temperature: 50 + Math.random() * 10,
                    current: 35 + Math.random() * 8,
                    pressure: 5.8 + Math.random() * 0.5,
                    diffPressure: 120 + Math.random() * 50,
                    rpm: 3050 + Math.random() * 150
                },
                bearing: {
                    vibration: 4 + Math.random() * 2,
                    temperature: 65 + Math.random() * 15 + degradeCounter * 0.8,
                    current: 38 + Math.random() * 10,
                    pressure: 5.5 + Math.random() * 0.5,
                    diffPressure: 150 + Math.random() * 60,
                    rpm: 3000 + Math.random() * 100
                },
                pressure: {
                    vibration: 2.5 + Math.random() * 1.2,
                    temperature: 48 + Math.random() * 8,
                    current: 42 + Math.random() * 10,
                    pressure: 4 - degradeCounter * 0.1 + Math.random() * 0.3,
                    diffPressure: 180 + Math.random() * 80,
                    rpm: 2900 + Math.random() * 150
                }
            };

            const targets = scenarios[currentScenario];
            Object.keys(targets).forEach(key => {
                sensorValues[key].target = targets[key];
            });

            if (currentScenario !== 'normal') {
                degradeCounter += 0.5;
            }
        }

        function updateSensorDisplay() {
            Object.keys(sensorValues).forEach(key => {
                const sensor = sensorValues[key];
                const threshold = thresholds[key];

                sensor.current += (sensor.target - sensor.current) * 0.15;

                const valueEl = document.getElementById(key);
                const barEl = document.getElementById(key + 'Bar');

                if (!valueEl || !barEl) return;

                let percent = (sensor.current / threshold.max) * 100;
                percent = Math.min(100, Math.max(0, percent));

                let status = 'normal';
                if (key === 'pressure') {
                    if (sensor.current <= threshold.danger) status = 'danger';
                    else if (sensor.current <= threshold.warning) status = 'warning';
                } else {
                    if (sensor.current >= threshold.danger) status = 'danger';
                    else if (sensor.current >= threshold.warning) status = 'warning';
                }

                if (key === 'rpm') {
                    valueEl.textContent = Math.round(sensor.current).toLocaleString();
                } else {
                    valueEl.textContent = sensor.current.toFixed(1) + ' ' + sensor.unit;
                }

                valueEl.className = 'sensor-value ' + status;
                barEl.className = 'sensor-bar-fill ' + status;
                barEl.style.width = percent + '%';
            });
        }

        // Initialize
        init();
        initTrendChart();

        setInterval(generateTargetValues, 2000);
        setInterval(updateTrendChart, 1000);
        setInterval(() => {
            updateSensorDisplay();
        }, 100);

        generateTargetValues();
        updateSensorDisplay();
        updateTrendChart();
    </script>
</body>
</html>
