<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95a5a6"/>
      <stop offset="100%" style="stop-color:#7f8c8d"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#blueGrad)"/>

  <!-- CNC Machine Base -->
  <rect x="10" y="38" width="44" height="8" rx="2" fill="#1a5276" opacity="0.8"/>

  <!-- Machine Body (L-shaped) -->
  <rect x="12" y="18" width="10" height="22" rx="2" fill="#2980b9"/>

  <!-- Spindle Head -->
  <rect x="20" y="20" width="12" height="8" rx="1" fill="#2980b9"/>

  <!-- Spindle -->
  <rect x="30" y="22" width="14" height="4" rx="2" fill="url(#metalGrad)"/>

  <!-- Chuck -->
  <circle cx="46" cy="24" r="5" fill="#7f8c8d"/>
  <circle cx="46" cy="24" r="3" fill="#555"/>

  <!-- Cam Workpiece (heart of the product) -->
  <ellipse cx="46" cy="24" rx="2" ry="1.5" fill="#27ae60"/>

  <!-- Tool Post -->
  <rect x="30" y="30" width="8" height="6" rx="1" fill="url(#metalGrad)"/>

  <!-- Cutting Tool -->
  <rect x="40" y="28" width="2" height="6" fill="#f39c12"/>

  <!-- Way Covers -->
  <rect x="22" y="36" width="20" height="3" rx="1" fill="#34495e"/>

  <!-- Control Panel -->
  <rect x="12" y="20" width="6" height="10" rx="1" fill="#2c3e50"/>
  <rect x="13" y="21" width="4" height="6" rx="0.5" fill="#3498db"/>

  <!-- KM Text -->
  <text x="32" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="white">KM</text>

  <!-- Status Indicator -->
  <circle cx="52" cy="12" r="5" fill="#1a1a2e"/>
  <circle cx="52" cy="12" r="3" fill="#27ae60"/>
</svg>
