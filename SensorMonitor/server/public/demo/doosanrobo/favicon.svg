<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f4a5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5f7a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#57c5b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#159895;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jointGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b2dfdb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#57c5b6" stroke-width="2"/>

  <!-- Robot arm representation -->
  <!-- Base -->
  <ellipse cx="30" cy="78" rx="12" ry="4" fill="#0d3d56"/>
  <rect x="24" y="68" width="12" height="10" fill="url(#robotGrad)" rx="2"/>

  <!-- J1 Joint -->
  <circle cx="30" cy="68" r="5" fill="url(#jointGrad)"/>

  <!-- Link 1 -->
  <rect x="27" y="52" width="6" height="16" fill="url(#robotGrad)" rx="1"/>

  <!-- J2 Joint -->
  <circle cx="30" cy="52" r="4.5" fill="url(#jointGrad)"/>

  <!-- Link 2 -->
  <rect x="27.5" y="38" width="5" height="14" fill="url(#robotGrad)" rx="1"/>

  <!-- J3 Joint -->
  <circle cx="30" cy="38" r="4" fill="url(#jointGrad)"/>

  <!-- Upper arm (angled) -->
  <line x1="30" y1="38" x2="52" y2="28" stroke="url(#robotGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- J4 Joint -->
  <circle cx="52" cy="28" r="3.5" fill="url(#jointGrad)"/>

  <!-- Forearm -->
  <line x1="52" y1="28" x2="68" y2="28" stroke="url(#robotGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- J5 Joint -->
  <circle cx="68" cy="28" r="3" fill="url(#jointGrad)"/>

  <!-- Wrist -->
  <line x1="68" y1="28" x2="78" y2="28" stroke="url(#robotGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- J6 Joint / Tool -->
  <circle cx="78" cy="28" r="2.5" fill="url(#jointGrad)"/>

  <!-- Tool/Gripper -->
  <rect x="79" y="23" width="8" height="10" fill="#ff6b35" rx="2"/>

  <!-- Sensor indicator (AI/IoT symbol) -->
  <circle cx="75" cy="72" r="12" fill="rgba(87, 197, 182, 0.3)"/>
  <circle cx="75" cy="72" r="8" fill="rgba(87, 197, 182, 0.5)"/>
  <circle cx="75" cy="72" r="4" fill="#57c5b6"/>

  <!-- Signal waves -->
  <path d="M 75 60 Q 85 55 90 60" fill="none" stroke="#57c5b6" stroke-width="1.5" opacity="0.7"/>
  <path d="M 75 56 Q 88 50 95 56" fill="none" stroke="#57c5b6" stroke-width="1.5" opacity="0.5"/>

  <!-- "6" indicator for 6-axis -->
  <text x="16" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#57c5b6">6</text>
</svg>
