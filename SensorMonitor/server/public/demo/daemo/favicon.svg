<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d32f2f"/>
      <stop offset="100%" style="stop-color:#f44336"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b71c1c"/>
      <stop offset="100%" style="stop-color:#c62828"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#757575"/>
      <stop offset="100%" style="stop-color:#424242"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#redGrad)"/>

  <!-- Hydraulic Breaker Body -->
  <rect x="22" y="10" width="20" height="28" rx="3" fill="url(#darkGrad)"/>

  <!-- Housing Details -->
  <rect x="24" y="14" width="16" height="6" rx="1" fill="#1a1a2e" opacity="0.3"/>
  <rect x="24" y="24" width="16" height="4" rx="1" fill="#1a1a2e" opacity="0.3"/>

  <!-- Hydraulic Cylinder -->
  <rect x="28" y="8" width="8" height="6" rx="2" fill="#ff5722"/>

  <!-- Chisel (Breaking Tool) -->
  <path d="M29 38 L32 54 L35 38 Z" fill="url(#steelGrad)"/>

  <!-- Chisel Base -->
  <rect x="26" y="36" width="12" height="4" rx="1" fill="#616161"/>

  <!-- Impact Lines -->
  <line x1="20" y1="50" x2="16" y2="54" stroke="#ff5722" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="44" y1="50" x2="48" y2="54" stroke="#ff5722" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="32" y1="54" x2="32" y2="58" stroke="#ff5722" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- DM Text -->
  <text x="32" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">DM</text>

  <!-- Status Indicator -->
  <circle cx="52" cy="12" r="6" fill="#1a1a2e"/>
  <circle cx="52" cy="12" r="4" fill="#4caf50"/>
</svg>
