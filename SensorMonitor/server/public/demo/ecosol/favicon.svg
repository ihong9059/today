<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32"/>
      <stop offset="100%" style="stop-color:#8bc34a"/>
    </linearGradient>
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8bc34a"/>
      <stop offset="100%" style="stop-color:#43a047"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#ecoGrad)"/>

  <!-- Leaf Shape (Eco Symbol) -->
  <path d="M32 12 Q50 20 48 38 Q42 52 32 52 Q22 52 16 38 Q14 20 32 12" fill="url(#bioGrad)" opacity="0.9"/>

  <!-- Leaf Vein -->
  <path d="M32 18 L32 46" stroke="white" stroke-width="2" opacity="0.6"/>
  <path d="M32 28 Q26 32 22 30" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M32 28 Q38 32 42 30" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M32 36 Q28 38 24 36" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M32 36 Q36 38 40 36" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Biodiesel Drop -->
  <path d="M32 24 Q40 35 32 44 Q24 35 32 24" fill="url(#dropGrad)" opacity="0.9"/>

  <!-- Recycling Arrows (Small) -->
  <g transform="translate(32,35) scale(0.4)">
    <path d="M0 -12 L6 -6 L0 0 L-6 -6 Z" fill="white" opacity="0.7"/>
  </g>

  <!-- Status Indicator -->
  <circle cx="52" cy="12" r="6" fill="#1a1a2e"/>
  <circle cx="52" cy="12" r="4" fill="#43a047"/>
</svg>
