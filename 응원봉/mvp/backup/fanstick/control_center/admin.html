<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FanStick Control Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 2em;
            color: #ffd700;
            margin-bottom: 5px;
        }
        .header .subtitle {
            color: #888;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card h2 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 상태 표시 */
        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
            flex: 1;
            min-width: 80px;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #4caf50;
        }
        .stat-label {
            color: #888;
            font-size: 0.9em;
        }

        /* 버튼 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn-primary { background: #9c27b0; color: white; }
        .btn-primary:hover { background: #7b1fa2; }
        .btn-gold { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; }
        .btn-gold:hover { transform: scale(1.02); }
        .btn-danger { background: #f44336; color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        /* 색상 버튼 */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .color-btn {
            width: 100%;
            aspect-ratio: 1;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .color-btn:hover { transform: scale(1.1); border-color: white; }

        /* 디바이스 리스트 */
        .device-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .device-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .device-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
        }
        .device-dot.offline { background: #f44336; }
        .device-info { flex: 1; }
        .device-id { font-family: monospace; color: #bb86fc; }
        .device-name { color: #888; font-size: 0.85em; }

        /* 이벤트 로그 */
        .event-log {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85em;
        }
        .log-line { margin: 4px 0; }
        .log-line.winner { color: #ffd700; }
        .log-line.reaction { color: #4caf50; }
        .log-line.join { color: #2196f3; }
        .log-line.leave { color: #f44336; }

        /* 추첨 섹션 */
        .lottery-section {
            text-align: center;
        }
        .lottery-count {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .lottery-count input {
            width: 80px;
            padding: 10px;
            font-size: 1.5em;
            text-align: center;
            border: 2px solid #ffd700;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: white;
        }
        .lottery-btn {
            font-size: 1.3em;
            padding: 15px 40px;
        }

        /* 당첨자 표시 */
        .winners-display {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            border-radius: 12px;
            display: none;
        }
        .winners-display.show { display: block; }
        .winners-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        .winner-badge {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            animation: winnerPulse 1s infinite;
        }
        @keyframes winnerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 입력 필드 */
        input[type="text"], input[type="number"] {
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
            color: white;
            width: 100%;
            margin-bottom: 10px;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI FanStick Control Center</h1>
        <p class="subtitle">콘서트 응원봉 본부 관제 시스템</p>
    </div>

    <div class="dashboard">
        <!-- 연결 상태 -->
        <div class="card">
            <h2>📡 연결 상태</h2>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="connectedCount">0</div>
                    <div class="stat-label">연결됨</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="bleCount" style="color:#ffd700;">0</div>
                    <div class="stat-label">🔗 응원봉</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="winnerCount">0</div>
                    <div class="stat-label">당첨자</div>
                </div>
            </div>
        </div>

        <!-- 추첨 -->
        <div class="card">
            <h2>🎰 추첨</h2>
            <div class="lottery-section">
                <p>연결된 응원봉 중에서 무작위로 당첨자를 선정합니다.</p>
                <div class="lottery-count">
                    <span>추첨 인원:</span>
                    <input type="number" id="lotteryCount" value="1" min="1" max="100">
                    <span>명</span>
                </div>
                <button class="btn btn-gold lottery-btn" onclick="runLottery()">
                    🎉 추첨 시작!
                </button>
                <div class="winners-display" id="winnersDisplay">
                    <h3>🏆 당첨자 발표!</h3>
                    <div class="winners-list" id="winnersList"></div>
                </div>
            </div>
        </div>

        <!-- LED 제어 -->
        <div class="card">
            <h2>💡 전체 LED 제어</h2>
            <p style="color:#888; margin-bottom:10px;">모든 연결된 응원봉의 LED를 제어합니다.</p>
            <div class="color-grid">
                <button class="color-btn" style="background:#ff0000" onclick="broadcastLED(255,0,0)"></button>
                <button class="color-btn" style="background:#ff8c00" onclick="broadcastLED(255,140,0)"></button>
                <button class="color-btn" style="background:#ffd700" onclick="broadcastLED(255,215,0)"></button>
                <button class="color-btn" style="background:#00ff00" onclick="broadcastLED(0,255,0)"></button>
                <button class="color-btn" style="background:#00ffff" onclick="broadcastLED(0,255,255)"></button>
                <button class="color-btn" style="background:#0000ff" onclick="broadcastLED(0,0,255)"></button>
                <button class="color-btn" style="background:#800080" onclick="broadcastLED(128,0,128)"></button>
                <button class="color-btn" style="background:#ff69b4" onclick="broadcastLED(255,105,180)"></button>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="broadcastLED(255,255,255,'rainbow')">🌈 Rainbow</button>
                <button class="btn btn-secondary" onclick="broadcastLED(255,255,255,'pulse')">💫 Pulse</button>
                <button class="btn btn-secondary" onclick="broadcastLED(255,255,255,'blink')">✨ Blink</button>
                <button class="btn btn-danger" onclick="broadcastLED(0,0,0)">끄기</button>
            </div>
        </div>

        <!-- 멜로디 제어 -->
        <div class="card">
            <h2>🎵 전체 멜로디</h2>
            <p style="color:#888; margin-bottom:10px;">모든 응원봉에서 멜로디를 재생합니다.</p>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="broadcastMelody('ack')">🔔 알림</button>
                <button class="btn btn-secondary" onclick="broadcastMelody('winner')">🏆 당첨</button>
                <button class="btn btn-secondary" onclick="broadcastMelody('dynamite')">🎤 Dynamite</button>
                <button class="btn btn-secondary" onclick="broadcastMelody('army')">💜 ARMY</button>
            </div>
        </div>

        <!-- 메시지 전송 -->
        <div class="card">
            <h2>📢 메시지 전송</h2>
            <input type="text" id="broadcastMessage" placeholder="전체 응원봉에 표시할 메시지...">
            <button class="btn btn-primary" onclick="broadcastMessage()">메시지 전송</button>
        </div>

        <!-- 디바이스 목록 -->
        <div class="card">
            <h2>📱 연결된 디바이스</h2>
            <div class="device-list" id="deviceList">
                <p style="color:#888;">연결된 디바이스가 없습니다.</p>
            </div>
            <div class="btn-group" style="margin-top:10px;">
                <button class="btn btn-secondary" onclick="refreshDevices()">새로고침</button>
                <button class="btn btn-danger" onclick="clearOfflineDevices()">오프라인 제거</button>
                <button class="btn btn-danger" onclick="clearAllDevices()">전체 초기화</button>
            </div>
        </div>

        <!-- 이벤트 로그 -->
        <div class="card">
            <h2>📋 이벤트 로그</h2>
            <div class="event-log" id="eventLog">
                <div class="log-line">시스템 시작...</div>
            </div>
            <button class="btn btn-secondary" onclick="clearLog()" style="margin-top:10px;">로그 지우기</button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let ws = null;

        // WebSocket 연결 (관리자용)
        function connectWebSocket() {
            const adminId = 'admin-' + Math.random().toString(36).substr(2, 9);
            ws = new WebSocket(`ws://${window.location.host}/ws/${adminId}`);

            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: 'admin',
                    name: 'Control Center Admin'
                }));
                log('본부 관제 시스템 연결됨', 'join');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };

            ws.onclose = () => {
                log('연결 끊김. 재연결 중...', 'leave');
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (error) => {
                log('WebSocket 오류', 'leave');
            };
        }

        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'connected':
                    updateStats();
                    break;
                case 'device_joined':
                    log(`새 디바이스 연결: ${data.device_id}`, 'join');
                    updateStats();
                    refreshDevices();
                    break;
                case 'device_left':
                    log(`디바이스 연결 해제: ${data.device_id}`, 'leave');
                    updateStats();
                    refreshDevices();
                    break;
                case 'device_reaction':
                    log(`반응: ${data.device_id} - ${data.reaction}`, 'reaction');
                    break;
                case 'lottery_result':
                    log(`🎉 추첨 완료! ${data.count}명 당첨`, 'winner');
                    break;
            }
        }

        // API 호출
        async function api(endpoint, method = 'GET', body = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' }
            };
            if (body) options.body = JSON.stringify(body);

            const res = await fetch(API_BASE + endpoint, options);
            return res.json();
        }

        // 추첨 실행
        async function runLottery() {
            const count = parseInt(document.getElementById('lotteryCount').value);
            if (count < 1) {
                alert('추첨 인원을 1명 이상 입력하세요.');
                return;
            }

            try {
                const result = await api('/api/lottery', 'POST', { count });

                if (result.success) {
                    const winnersDisplay = document.getElementById('winnersDisplay');
                    const winnersList = document.getElementById('winnersList');

                    // 응원봉 이름으로 표시
                    const names = result.winner_names || result.winners;
                    winnersList.innerHTML = names.map(w =>
                        `<span class="winner-badge">🏆 ${w}</span>`
                    ).join('');

                    winnersDisplay.classList.add('show');
                    document.getElementById('winnerCount').textContent = names.length;

                    log(`🎉 추첨 완료! 당첨자: ${names.join(', ')}`, 'winner');
                }
            } catch (e) {
                alert('추첨 실패: ' + e.message);
            }
        }

        // LED 브로드캐스트
        async function broadcastLED(r, g, b, pattern = 'solid') {
            await api(`/api/broadcast/led?r=${r}&g=${g}&b=${b}&pattern=${pattern}`, 'POST');
            log(`LED 명령: RGB(${r},${g},${b}) ${pattern}`, 'reaction');
        }

        // 멜로디 브로드캐스트
        async function broadcastMelody(melody) {
            await api(`/api/broadcast/melody?melody=${melody}`, 'POST');
            log(`멜로디 명령: ${melody}`, 'reaction');
        }

        // 메시지 브로드캐스트
        async function broadcastMessage() {
            const message = document.getElementById('broadcastMessage').value;
            if (!message) {
                alert('메시지를 입력하세요.');
                return;
            }
            await api(`/api/broadcast/message?message=${encodeURIComponent(message)}`, 'POST');
            log(`메시지 전송: ${message}`, 'reaction');
            document.getElementById('broadcastMessage').value = '';
        }

        // 통계 업데이트
        async function updateStats() {
            try {
                const data = await api('/api/devices');
                document.getElementById('connectedCount').textContent = data.connected;
                document.getElementById('bleCount').textContent = data.ble_connected || 0;
            } catch (e) {
                console.error('Stats update failed:', e);
            }
        }

        // 디바이스 목록 새로고침
        async function refreshDevices() {
            try {
                const data = await api('/api/devices');
                const listDiv = document.getElementById('deviceList');

                if (data.devices.length === 0) {
                    listDiv.innerHTML = '<p style="color:#888;">연결된 디바이스가 없습니다.</p>';
                    return;
                }

                listDiv.innerHTML = data.devices.map(d => `
                    <div class="device-item">
                        <div class="device-dot ${d.online ? '' : 'offline'}"></div>
                        <div class="device-info">
                            <div class="device-id">${d.name || d.id}</div>
                            <div class="device-name">${d.ble_connected ? '🔗 ' + (d.ble_name || 'BLE 연결됨') : '📱 앱만 연결'}</div>
                        </div>
                        <button class="btn btn-secondary" onclick="sendWinnerEffect('${d.id}')" style="padding:5px 10px; font-size:0.8em;">
                            🎁
                        </button>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Device list refresh failed:', e);
            }
        }

        // 특정 디바이스에 당첨 효과 전송
        async function sendWinnerEffect(deviceId) {
            await api(`/api/device/${deviceId}/command`, 'POST', {
                command: 'winner',
                params: {
                    type: 'winner',
                    message: '축하합니다! 당첨되셨습니다!',
                    led: { r: 255, g: 215, b: 0, pattern: 'rainbow' },
                    melody: 'winner'
                }
            });
            log(`당첨 효과 전송: ${deviceId}`, 'winner');
        }

        // 로그
        function log(message, type = '') {
            const logDiv = document.getElementById('eventLog');
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = 'log-line ' + type;
            line.textContent = `[${time}] ${message}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // 오프라인 디바이스 제거
        async function clearOfflineDevices() {
            try {
                const result = await api('/api/devices', 'DELETE');
                log(`오프라인 디바이스 ${result.removed}개 제거됨`, 'success');
                refreshDevices();
                updateStats();
            } catch (e) {
                log('오프라인 디바이스 제거 실패: ' + e.message, 'error');
            }
        }

        // 전체 디바이스 초기화
        async function clearAllDevices() {
            if (!confirm('모든 디바이스를 초기화하시겠습니까?')) return;
            try {
                const result = await api('/api/devices/all', 'DELETE');
                log(`모든 디바이스 ${result.removed}개 초기화됨`, 'success');
                refreshDevices();
                updateStats();
            } catch (e) {
                log('디바이스 초기화 실패: ' + e.message, 'error');
            }
        }

        function clearLog() {
            document.getElementById('eventLog').innerHTML = '';
            log('로그 초기화됨');
        }

        // 초기화
        window.onload = () => {
            connectWebSocket();
            updateStats();
            refreshDevices();
            setInterval(updateStats, 5000);
        };
    </script>
</body>
</html>
