<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 420px;
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 20px;
        }
        h1 {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .threshold-info {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .threshold-info strong {
            color: #e74c3c;
        }
        .status {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 13px;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        .auto-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .auto-toggle-label {
            font-size: 14px;
            font-weight: bold;
        }
        .auto-toggle-info {
            font-size: 11px;
            color: #666;
        }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 26px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        .toggle-switch input:checked + .toggle-slider {
            background-color: #27ae60;
        }
        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
        .last-analysis {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-bottom: 15px;
            padding: 8px;
            background: #e8f4fd;
            border-radius: 8px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-analyze {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            font-size: 16px;
            padding: 16px;
        }
        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4);
        }
        .btn-analyze:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
            font-size: 13px;
            padding: 10px;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .btn-row {
            display: flex;
            gap: 10px;
        }
        .btn-row .btn {
            flex: 1;
        }
        .results {
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .result-header {
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .result-header.found {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }
        .result-header.safe {
            background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%);
            color: white;
        }
        .product {
            background: #fff5f5;
            border-left: 4px solid #e74c3c;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 12px;
        }
        .product-name {
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
            line-height: 1.4;
        }
        .product-info {
            color: #666;
            margin-bottom: 4px;
        }
        .product-price {
            color: #e74c3c;
            font-weight: bold;
            font-size: 14px;
        }
        .product-link {
            display: inline-block;
            margin-top: 6px;
            color: #667eea;
            text-decoration: none;
            font-size: 11px;
        }
        .product-link:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #667eea;
        }
        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            text-align: center;
            padding: 20px;
            color: #e74c3c;
            background: #fff5f5;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥛 서울우유 저가 모니터링</h1>

        <div class="threshold-info">
            기준: 100ml당 <strong>300원</strong> 이하 제품 검색
        </div>

        <div class="status" id="status">
            서버 연결 확인 중...
        </div>

        <div class="auto-toggle">
            <div>
                <div class="auto-toggle-label">⏰ 10분 자동 분석</div>
                <div class="auto-toggle-info">쿠팡 자동 검색 후 결과 저장</div>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" id="autoToggle">
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div class="last-analysis" id="lastAnalysis">
            마지막 분석: 없음
        </div>

        <button class="btn btn-analyze" id="analyzeBtn">
            🔍 현재 페이지 분석
        </button>

        <div class="btn-row">
            <button class="btn btn-secondary" id="searchBtn">
                쿠팡에서 검색
            </button>
            <button class="btn btn-secondary" id="dashboardBtn">
                대시보드 열기
            </button>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
