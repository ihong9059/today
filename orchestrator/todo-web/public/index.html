<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTTEC Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>📝 UTTEC Todo</h1>
      <p class="subtitle">4개 서브에이전트가 협업하여 만든 데모</p>
    </header>

    <section class="input-row" role="form" aria-label="새 할일 입력">
      <input
        type="text"
        id="todo-input"
        placeholder="할일을 입력하세요..."
        aria-label="할일 입력"
        maxlength="200"
      />
      <button id="add-btn" aria-label="추가">추가</button>
    </section>

    <section class="counter" aria-live="polite">
      <span id="counter">전체 0개 / 완료 0개</span>
    </section>

    <ul id="todo-list" role="list" aria-label="할일 목록"></ul>

    <footer>
      <small>Made by <code>frontend-builder</code> · <code>backend-builder</code> · <code>test-writer</code> · <code>doc-writer</code></small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
