<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#E53935">
    <title>{% block title %}홍가네{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 상단 헤더 -->
    <header class="header">
        <a href="/" class="header-logo">홍가네</a>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- 하단 네비게이션 (모바일 최적화) -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">홈</span>
        </a>
        <a href="/feed" class="nav-item {% if request.endpoint == 'feed' %}active{% endif %}">
            <span class="nav-icon">📝</span>
            <span class="nav-label">피드</span>
        </a>
        <a href="/album" class="nav-item {% if request.endpoint == 'album' %}active{% endif %}">
            <span class="nav-icon">📷</span>
            <span class="nav-label">앨범</span>
        </a>
        <a href="/calendar" class="nav-item {% if request.endpoint == 'calendar' %}active{% endif %}">
            <span class="nav-icon">📅</span>
            <span class="nav-label">일정</span>
        </a>
        <a href="/chat" class="nav-item {% if request.endpoint == 'chat' %}active{% endif %}">
            <span class="nav-icon">💬</span>
            <span class="nav-label">대화</span>
        </a>
    </nav>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
