{% extends 'base.html' %}

{% block title %}추억 앨범 - 홍가네{% endblock %}

{% block content %}
<div class="container">
    <h1 class="page-title">추억 앨범</h1>

    <div class="coming-soon-card">
        <div class="coming-soon-icon">📷</div>
        <h2>앨범 기능 준비중</h2>
        <p>소중한 사진과 추억을 저장할 수 있는 공간입니다.</p>
        <p class="coming-soon-features">
            예정 기능:<br>
            • 사진/동영상 업로드<br>
            • 연도/월별 자동 분류<br>
            • 이벤트 태그 (여행, 생일, 명절)<br>
            • 슬라이드쇼
        </p>
    </div>

    <!-- 샘플 앨범 UI -->
    <div class="album-preview">
        <h3>앨범 미리보기</h3>
        <div class="album-grid">
            <div class="album-item placeholder">
                <span>2026</span>
                <span class="album-label">올해 추억</span>
            </div>
            <div class="album-item placeholder">
                <span>🎂</span>
                <span class="album-label">생일</span>
            </div>
            <div class="album-item placeholder">
                <span>✈️</span>
                <span class="album-label">여행</span>
            </div>
            <div class="album-item placeholder">
                <span>🎄</span>
                <span class="album-label">명절</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
