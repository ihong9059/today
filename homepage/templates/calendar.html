{% extends 'base.html' %}

{% block title %}가족 캘린더 - 홍가네{% endblock %}

{% block content %}
<div class="container">
    <h1 class="page-title">가족 캘린더</h1>

    <div class="coming-soon-card">
        <div class="coming-soon-icon">📅</div>
        <h2>캘린더 기능 준비중</h2>
        <p>가족 일정을 함께 관리할 수 있는 공간입니다.</p>
        <p class="coming-soon-features">
            예정 기능:<br>
            • 생일, 기념일 자동 알림<br>
            • 가족 행사 일정 공유<br>
            • D-day 카운트다운<br>
            • 월간/주간 보기
        </p>
    </div>

    <!-- 샘플 캘린더 -->
    <div class="calendar-preview">
        <h3>이번 달 주요 일정</h3>
        <div class="event-list">
            <div class="event-item">
                <span class="event-date">01.25</span>
                <span class="event-title">Family Connect 시작!</span>
                <span class="event-emoji">🎉</span>
            </div>
            <div class="event-item upcoming">
                <span class="event-date">02.10</span>
                <span class="event-title">설날</span>
                <span class="event-emoji">🧧</span>
            </div>
            <div class="event-item upcoming">
                <span class="event-date">03.01</span>
                <span class="event-title">삼일절</span>
                <span class="event-emoji">🇰🇷</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
