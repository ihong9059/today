<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Gemini 챗봇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: #1e1e2e;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #313244;
        }

        .chat-header {
            background: linear-gradient(135deg, #4285f4 0%, #1a73e8 50%, #ea4335 100%);
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-selector select {
            padding: 8px 15px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }

        .model-selector select option {
            background: #333;
            color: white;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #1e1e2e;
        }

        .message {
            display: flex;
            gap: 15px;
            max-width: 90%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #4285f4 0%, #34a853 50%, #ea4335 100%);
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
        }

        .message-content {
            background: #313244;
            padding: 15px 18px;
            border-radius: 12px;
            line-height: 1.6;
            color: #cdd6f4;
            font-size: 0.95rem;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
            color: white;
        }

        .message-content pre {
            background: #11111b;
            color: #cdd6f4;
            padding: 12px 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            font-family: 'Fira Code', 'Monaco', 'Consolas', monospace;
            font-size: 0.85rem;
        }

        .message-content code {
            background: #45475a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', 'Monaco', 'Consolas', monospace;
            font-size: 0.9em;
            color: #f38ba8;
        }

        .message.user .message-content code {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .chat-input-container {
            padding: 20px 25px;
            background: #181825;
            border-top: 1px solid #313244;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #313244;
            border-radius: 12px;
            font-size: 1rem;
            resize: none;
            outline: none;
            background: #1e1e2e;
            color: #cdd6f4;
            transition: border-color 0.3s;
            max-height: 150px;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: #4285f4;
        }

        .chat-input::placeholder {
            color: #6c7086;
        }

        .send-button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #4285f4 0%, #1a73e8 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(66, 133, 244, 0.4);
        }

        .send-button:disabled {
            background: #45475a;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #4285f4;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            padding: 15px 20px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #ef4444;
        }

        .welcome-message {
            text-align: center;
            padding: 60px 40px;
            color: #6c7086;
        }

        .welcome-message h2 {
            background: linear-gradient(135deg, #4285f4, #34a853, #fbbc04, #ea4335);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .welcome-message p {
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .clear-button {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .clear-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 스크롤바 스타일링 */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #45475a;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #585b70;
        }

        .info-text {
            font-size: 0.8rem;
            color: #6c7086;
            margin-top: 8px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>✨ Google Gemini</h1>
            <div class="model-selector">
                <select id="modelSelect">
                    <option value="">모델 로딩 중...</option>
                </select>
                <button class="clear-button" onclick="clearChat()">초기화</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h2>Google Gemini에 오신 것을 환영합니다!</h2>
                <p>Google의 최신 AI 모델을 사용하는 챗봇입니다.<br>
                무엇이든 물어보세요!</p>
            </div>
        </div>

        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <textarea
                    class="chat-input"
                    id="messageInput"
                    placeholder="메시지를 입력하세요... (Shift+Enter로 줄바꿈)"
                    rows="1"
                ></textarea>
                <button class="send-button" id="sendButton" onclick="sendMessage()">
                    <span>전송</span>
                </button>
            </div>
            <div class="info-text" id="infoText"></div>
        </div>
    </div>

    <script>
        let conversationHistory = [];
        let isLoading = false;

        // 모델 목록 로드
        async function loadModels() {
            try {
                const response = await fetch('/api/models');
                const models = await response.json();
                const select = document.getElementById('modelSelect');
                select.innerHTML = '';

                models.forEach((model, index) => {
                    const option = document.createElement('option');
                    option.value = model.id;
                    option.textContent = model.name;
                    if (!model.available) {
                        option.disabled = true;
                        option.textContent += ' (API 키 필요)';
                    }
                    if (index === 0) option.selected = true;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('모델 로드 실패:', error);
            }
        }

        // 메시지 전송
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || isLoading) return;

            const modelId = document.getElementById('modelSelect').value;

            // 사용자 메시지 표시
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';

            // 로딩 표시
            isLoading = true;
            document.getElementById('sendButton').disabled = true;
            const loadingDiv = addTypingIndicator();

            const startTime = Date.now();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        model: modelId,
                        history: conversationHistory
                    })
                });

                const data = await response.json();
                loadingDiv.remove();

                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

                if (data.error) {
                    addErrorMessage(data.error);
                    document.getElementById('infoText').textContent = '';
                } else {
                    // 대화 기록 업데이트
                    conversationHistory.push({ role: 'user', content: message });
                    conversationHistory.push({ role: 'assistant', content: data.response });

                    addMessage('assistant', data.response);
                    document.getElementById('infoText').textContent = `응답 시간: ${elapsed}초 | 모델: ${data.model}`;
                }
            } catch (error) {
                loadingDiv.remove();
                addErrorMessage('서버 연결에 실패했습니다.');
                document.getElementById('infoText').textContent = '';
            }

            isLoading = false;
            document.getElementById('sendButton').disabled = false;
        }

        // 메시지 추가
        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chatMessages');

            // 환영 메시지 제거
            const welcome = messagesDiv.querySelector('.welcome-message');
            if (welcome) welcome.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = role === 'assistant' ? '✨' : '👤';
            const formattedContent = formatMessage(content);

            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${formattedContent}</div>
            `;

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 메시지 포맷팅
        function formatMessage(content) {
            content = content.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            content = content.replace(/`([^`]+)`/g, '<code>$1</code>');
            content = content.replace(/\n/g, '<br>');
            content = content.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            return content;
        }

        // 타이핑 인디케이터 추가
        function addTypingIndicator() {
            const messagesDiv = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.innerHTML = `
                <div class="message-avatar">✨</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return typingDiv;
        }

        // 에러 메시지 추가
        function addErrorMessage(error) {
            const messagesDiv = document.getElementById('chatMessages');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = '⚠️ ' + error;
            messagesDiv.appendChild(errorDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 대화 초기화
        function clearChat() {
            conversationHistory = [];
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.innerHTML = `
                <div class="welcome-message">
                    <h2>Google Gemini에 오신 것을 환영합니다!</h2>
                    <p>Google의 최신 AI 모델을 사용하는 챗봇입니다.<br>
                    무엇이든 물어보세요!</p>
                </div>
            `;
            document.getElementById('infoText').textContent = '';
        }

        // 텍스트 영역 자동 크기 조절
        const textarea = document.getElementById('messageInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // Enter 키 처리
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 초기화
        loadModels();
    </script>
</body>
</html>
