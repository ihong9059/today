<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데모 사이트 관리 - UTTEC Smart Factory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0f2460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #00ff88, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(0, 212, 255, 0.1);
            padding: 15px 30px;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            text-align: center;
        }

        .stat-item span {
            font-size: 2rem;
            font-weight: bold;
            color: #00d4ff;
            display: block;
        }

        .stat-item label {
            font-size: 0.9rem;
            color: #888;
        }

        .search-box {
            margin: 30px 0;
            text-align: center;
        }

        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 15px 25px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .search-box input::placeholder {
            color: #666;
        }

        .companies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .company-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .company-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-color: var(--company-color, #00d4ff);
        }

        .company-header {
            padding: 20px;
            background: linear-gradient(135deg, var(--company-color, #00d4ff)20, transparent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .company-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--company-color, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .company-info h3 {
            font-size: 1.1rem;
            margin-bottom: 3px;
        }

        .company-info .industry {
            font-size: 0.85rem;
            color: #888;
        }

        .company-body {
            padding: 20px;
        }

        .company-body .description {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .company-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .company-id {
            font-family: monospace;
            font-size: 0.8rem;
            color: #666;
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .arrow {
            color: var(--company-color, #00d4ff);
            font-size: 1.2rem;
            transition: transform 0.3s;
        }

        .company-card:hover .arrow {
            transform: translateX(5px);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #555;
            font-size: 0.9rem;
        }

        footer a {
            color: #00d4ff;
            text-decoration: none;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .no-results svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .companies-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                gap: 15px;
            }

            .stat-item {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>UTTEC 데모 사이트 관리</h1>
            <p>스마트팩토리 예지정비 솔루션 데모 사이트 모음</p>
            <div class="stats">
                <div class="stat-item">
                    <span id="total-companies">25</span>
                    <label>전체 업체</label>
                </div>
                <div class="stat-item">
                    <span id="filtered-count">25</span>
                    <label>검색 결과</label>
                </div>
            </div>
        </header>

        <div class="search-box">
            <input type="text" id="search" placeholder="업체명 또는 업종으로 검색..." oninput="filterCompanies()">
        </div>

        <div class="companies-grid" id="companies-grid">
            <!-- Company cards will be inserted here -->
        </div>

        <div class="no-results" id="no-results" style="display: none;">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <h3>검색 결과가 없습니다</h3>
            <p>다른 키워드로 검색해 보세요</p>
        </div>

        <footer>
            <p>UTTEC Smart Factory Solutions | <a href="/">메인 대시보드로 이동</a></p>
        </footer>
    </div>

    <script>
        // 25개 데모 회사 정보
        const companies = [
            { id: 'hankookmech', name: '한국기계엔지니어링', industry: '파쇄기/분체', color: '#2563eb', desc: '스마트 파쇄기 모니터링 시스템' },
            { id: 'hankook', name: '한국분체시스템', industry: '분체/파쇄', color: '#3b82f6', desc: '스마트팩토리 모니터링 시스템' },
            { id: 'kpsm', name: '한국분체기계', industry: '분체기계', color: '#6366f1', desc: '스마트팩토리 예지정비 솔루션' },
            { id: 'hankookelec', name: '한국전기산업', industry: '전기/배전', color: '#8b5cf6', desc: '스마트팩토리 전력 모니터링' },
            { id: 'kunileng', name: '건일이엔지', industry: '배전반', color: '#a855f7', desc: '스마트 배전반 모니터링 시스템' },
            { id: 'dongkwang', name: '동광계전', industry: '전기/유통', color: '#d946ef', desc: '스마트 유통 & 예지정비 솔루션' },
            { id: 'dongwon', name: '동원분체산업', industry: '분체/산업', color: '#ec4899', desc: 'AI 스마트팩토리 솔루션' },
            { id: 'dhcrusher', name: '대흥크러셔', industry: '플라스틱 재생', color: '#f43f5e', desc: 'AI 기반 스마트 플라스틱 재생' },
            { id: 'daemo', name: '대모엔지니어링', industry: '엔지니어링', color: '#ef4444', desc: '스마트 팩토리 솔루션' },
            { id: 'daemyung', name: '대명기업', industry: '제조', color: '#f97316', desc: '스마트 팩토리 예지정비' },
            { id: 'doosanrobo', name: '두산로보틱스', industry: '협동로봇', color: '#fb923c', desc: '협동로봇 예지정비 시스템' },
            { id: 'gwangmyung', name: '광명산업', industry: '산업기계', color: '#fbbf24', desc: '스마트 팩토리 예지정비 시스템' },
            { id: 'ecosol', name: '에코솔루션', industry: '환경/솔루션', color: '#a3e635', desc: '스마트 팩토리 솔루션' },
            { id: 'hwaseong', name: '화성기계(HSMC)', industry: '기계', color: '#4ade80', desc: '스마트 솔루션' },
            { id: 'hwasungind', name: '화성산업', industry: '산업', color: '#34d399', desc: '스마트 예지보전 시스템' },
            { id: 'latplasma', name: '(주)엘에이티', industry: '플라즈마 장비', color: '#2dd4bf', desc: '플라즈마 장비 스마트 솔루션' },
            { id: 'polarissewon', name: '(주)폴라리스세원', industry: '제조', color: '#22d3d3', desc: '스마트 솔루션' },
            { id: 'mmco', name: '광산기공', industry: '플랜트', color: '#38bdf8', desc: 'AI 기반 스마트 플랜트 솔루션' },
            { id: 'robosys', name: '(주)로봇시스템', industry: '로봇', color: '#60a5fa', desc: '스마트팩토리 예지정비' },
            { id: 'samwon', name: '삼원기계', industry: '기계', color: '#818cf8', desc: '스마트 팩토리 예지정비' },
            { id: 'seowontech', name: '(주)서원텍', industry: '밸브 MRO', color: '#a78bfa', desc: '밸브 MRO 예지정비 시스템' },
            { id: 'vessel', name: '(주)베셀', industry: 'FPD 장비', color: '#c084fc', desc: '스마트 FPD 장비 예지정비' },
            { id: 'sinho', name: '신호산기(주)', industry: '산업기계', color: '#e879f9', desc: 'SINHO-PdM 예지정비' },
            { id: 'sunjin', name: '(주)선진파워텍', industry: '파워텍', color: '#f472b6', desc: 'SP-PdM 스마트 예지정비' },
            { id: 'sookwang', name: '수광산업(주)', industry: '산업', color: '#fb7185', desc: '스마트 솔루션' }
        ];

        // 회사 카드 생성
        function createCompanyCard(company) {
            const initials = company.name.substring(0, 2);
            return `
                <a href="/demo/${company.id}/" class="company-card" style="--company-color: ${company.color}">
                    <div class="company-header">
                        <div class="company-icon" style="background: ${company.color}">
                            ${initials}
                        </div>
                        <div class="company-info">
                            <h3>${company.name}</h3>
                            <span class="industry">${company.industry}</span>
                        </div>
                    </div>
                    <div class="company-body">
                        <p class="description">${company.desc}</p>
                        <div class="company-footer">
                            <span class="company-id">/demo/${company.id}/</span>
                            <span class="arrow">→</span>
                        </div>
                    </div>
                </a>
            `;
        }

        // 회사 목록 렌더링
        function renderCompanies(filteredCompanies) {
            const grid = document.getElementById('companies-grid');
            const noResults = document.getElementById('no-results');

            if (filteredCompanies.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
            } else {
                grid.style.display = 'grid';
                noResults.style.display = 'none';
                grid.innerHTML = filteredCompanies.map(company => createCompanyCard(company)).join('');
            }

            document.getElementById('filtered-count').textContent = filteredCompanies.length;
        }

        // 검색 필터
        function filterCompanies() {
            const searchTerm = document.getElementById('search').value.toLowerCase().trim();

            if (!searchTerm) {
                renderCompanies(companies);
                return;
            }

            const filtered = companies.filter(company =>
                company.name.toLowerCase().includes(searchTerm) ||
                company.industry.toLowerCase().includes(searchTerm) ||
                company.id.toLowerCase().includes(searchTerm) ||
                company.desc.toLowerCase().includes(searchTerm)
            );

            renderCompanies(filtered);
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('total-companies').textContent = companies.length;
            renderCompanies(companies);
        });
    </script>
</body>
</html>
