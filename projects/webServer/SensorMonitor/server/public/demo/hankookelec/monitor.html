<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>실시간 모니터링 - 한국전기산업 스마트팩토리</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #1a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        nav {
            background: rgba(26, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(211, 47, 47, 0.3);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #d32f2f, #ff5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            color: #ffcdd2;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #d32f2f;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .live-badge {
            background: #d32f2f;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .phone-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 0.85rem;
        }
        .phone-control label {
            color: #ffcdd2;
            cursor: pointer;
            white-space: nowrap;
        }
        .phone-toggle {
            appearance: none;
            width: 44px;
            height: 24px;
            background: #333;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        .phone-toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        .phone-toggle:checked {
            background: linear-gradient(135deg, #b71c1c, #d32f2f);
        }
        .phone-toggle:checked::after {
            left: 22px;
        }
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #888;
        }
        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
            transition: background 0.3s;
        }
        .connection-dot.connected {
            background: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        .main-content {
            padding-top: 70px;
            display: grid;
            grid-template-columns: 1fr 380px;
            min-height: 100vh;
        }

        .viewer-section {
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .viewer-header h2 {
            font-size: 1.3rem;
        }

        .equipment-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .equipment-btn {
            padding: 8px 16px;
            border: 1px solid rgba(211, 47, 47, 0.3);
            border-radius: 20px;
            background: transparent;
            color: #ffcdd2;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .equipment-btn:hover {
            border-color: #d32f2f;
        }
        .equipment-btn.active {
            background: linear-gradient(135deg, #b71c1c, #d32f2f);
            border-color: #d32f2f;
            color: #fff;
        }

        #viewer {
            flex: 1;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(211, 47, 47, 0.2);
            border-radius: 20px;
            overflow: hidden;
            min-height: 500px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.03);
            padding: 10px 15px;
            border-radius: 10px;
        }
        .control-group label {
            color: #ffcdd2;
            font-size: 0.9rem;
        }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: 0.3s;
            border-radius: 26px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background: linear-gradient(135deg, #b71c1c, #d32f2f);
        }
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        .ws-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f44336;
        }
        .ws-status.connected {
            background: #4caf50;
        }

        .orientation-display {
            display: flex;
            gap: 20px;
            background: rgba(255,255,255,0.03);
            padding: 10px 20px;
            border-radius: 10px;
        }
        .orientation-item {
            text-align: center;
        }
        .orientation-label {
            font-size: 0.75rem;
            color: #666;
        }
        .orientation-value {
            font-size: 1.1rem;
            color: #d32f2f;
            font-weight: 600;
        }

        /* Sidebar */
        .sidebar {
            background: rgba(255,255,255,0.02);
            border-left: 1px solid rgba(211, 47, 47, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 70px);
        }

        .panel {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(211, 47, 47, 0.1);
            border-radius: 15px;
            padding: 20px;
        }
        .panel h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #ffcdd2;
        }

        .sensor-item {
            margin-bottom: 15px;
        }
        .sensor-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .sensor-name {
            font-size: 0.85rem;
            color: #888;
        }
        .sensor-value {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .sensor-value.normal { color: #4caf50; }
        .sensor-value.warning { color: #ff9800; }
        .sensor-value.danger { color: #f44336; }

        .sensor-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .sensor-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s, background 0.3s;
        }
        .sensor-bar-fill.normal { background: linear-gradient(90deg, #4caf50, #81c784); }
        .sensor-bar-fill.warning { background: linear-gradient(90deg, #ff9800, #ffb74d); }
        .sensor-bar-fill.danger { background: linear-gradient(90deg, #f44336, #e57373); }

        .chart-container {
            position: relative;
            height: 180px;
        }
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.75rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .alert-list {
            max-height: 150px;
            overflow-y: auto;
        }
        .alert-item {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .alert-item.info {
            background: rgba(211, 47, 47, 0.1);
            border-left: 3px solid #d32f2f;
        }
        .alert-item.warning {
            background: rgba(255, 152, 0, 0.1);
            border-left: 3px solid #ff9800;
        }
        .alert-item.danger {
            background: rgba(244, 67, 54, 0.1);
            border-left: 3px solid #f44336;
        }
        .alert-time {
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
        }

        .scenario-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .scenario-btn {
            padding: 12px 15px;
            border: 1px solid rgba(211, 47, 47, 0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-size: 0.9rem;
        }
        .scenario-btn:hover {
            border-color: #d32f2f;
            background: rgba(211, 47, 47, 0.1);
        }
        .scenario-btn.active {
            border-color: #d32f2f;
            background: rgba(211, 47, 47, 0.2);
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .sidebar {
                max-height: none;
            }
            #viewer {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <div class="logo">한국전기산업 Smart Factory</div>
            <div class="nav-links">
                <a href="index.html">홈</a>
                <a href="system.html">시스템 구성</a>
                <a href="monitor.html" class="active">실시간 모니터링</a>
                <a href="about.html">UTTEC 소개</a>
            </div>
        </div>
        <div class="nav-right">
            <span class="live-badge">LIVE</span>
            <div class="phone-control">
                <label for="phoneToggle">스마트폰 연동</label>
                <input type="checkbox" id="phoneToggle" class="phone-toggle" onchange="togglePhoneConnection()">
            </div>
            <div class="connection-status">
                <div class="connection-dot" id="connectionDot"></div>
                <span id="connectionText">연결 대기</span>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="viewer-section">
            <div class="viewer-header">
                <h2>3D 설비 모니터링</h2>
                <div class="equipment-selector">
                    <button class="equipment-btn active" onclick="selectEquipment('cnc')">CNC 가공기</button>
                    <button class="equipment-btn" onclick="selectEquipment('press')">프레스</button>
                    <button class="equipment-btn" onclick="selectEquipment('welding')">용접설비</button>
                    <button class="equipment-btn" onclick="selectEquipment('coating')">도장라인</button>
                </div>
            </div>

            <div id="viewer"></div>

            <div class="controls">
                <div class="control-group">
                    <label>자동 회전</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="autoRotate" onchange="toggleAutoRotate()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="control-group">
                    <label>스마트폰 연동</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="orientationToggle" onchange="toggleOrientationSource()">
                        <span class="toggle-slider"></span>
                    </label>
                    <div class="ws-status" id="wsStatus"></div>
                </div>
                <div class="orientation-display">
                    <div class="orientation-item">
                        <div class="orientation-label">Alpha</div>
                        <div class="orientation-value" id="alphaValue">0°</div>
                    </div>
                    <div class="orientation-item">
                        <div class="orientation-label">Beta</div>
                        <div class="orientation-value" id="betaValue">0°</div>
                    </div>
                    <div class="orientation-item">
                        <div class="orientation-label">Gamma</div>
                        <div class="orientation-value" id="gammaValue">0°</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h3>센서 현황</h3>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">스핀들 진동</span>
                        <span class="sensor-value normal" id="vibration">2.4 mm/s</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="vibrationBar" style="width: 24%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">베어링 온도</span>
                        <span class="sensor-value normal" id="temperature">45.2 °C</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="temperatureBar" style="width: 45%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">모터 전류</span>
                        <span class="sensor-value normal" id="current">32.5 A</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="currentBar" style="width: 40%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">유압 압력</span>
                        <span class="sensor-value normal" id="pressure">85.0 bar</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="pressureBar" style="width: 85%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">용접 전류</span>
                        <span class="sensor-value normal" id="weldCurrent">180 A</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="weldCurrentBar" style="width: 60%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">도장 두께</span>
                        <span class="sensor-value normal" id="thickness">85 μm</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="thicknessBar" style="width: 42%"></div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>트렌드 (최근 60초)</h3>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
                <div class="chart-legend">
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #4caf50"></span>
                        <span>진동</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #ff9800"></span>
                        <span>온도</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #2196f3"></span>
                        <span>전류</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #9c27b0"></span>
                        <span>압력</span>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>알림</h3>
                <div class="alert-list" id="alertList">
                    <div class="alert-item info">
                        CNC 가공기 정상 운전 중
                        <div class="alert-time">방금 전</div>
                    </div>
                    <div class="alert-item info">
                        용접 품질 검사 완료
                        <div class="alert-time">2분 전</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>시나리오</h3>
                <div class="scenario-buttons">
                    <button class="scenario-btn active" onclick="setScenario('normal')">
                        정상 운전
                    </button>
                    <button class="scenario-btn" onclick="setScenario('spindle')">
                        스핀들 이상
                    </button>
                    <button class="scenario-btn" onclick="setScenario('bearing')">
                        베어링 과열
                    </button>
                    <button class="scenario-btn" onclick="setScenario('welding')">
                        용접 품질 이상
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Three.js Setup
        let scene, camera, renderer, equipment;
        let autoRotate = false;
        let targetRotation = { x: 0, y: 0, z: 0 };
        let currentRotation = { x: 0, y: 0, z: 0 };
        let useRealOrientation = false;
        let remoteOrientation = { alpha: 0, beta: 0, gamma: 0 };
        let calibratedOrientation = { roll: 0, pitch: 0 };
        let ws = null;

        function init() {
            const container = document.getElementById('viewer');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0a0a);

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(6, 5, 8);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0xd32f2f, 0.5);
            pointLight.position.set(-5, 5, -5);
            scene.add(pointLight);

            // Grid
            const gridHelper = new THREE.GridHelper(10, 20, 0x333333, 0x222222);
            scene.add(gridHelper);

            // Create CNC Machine
            createCNC();

            window.addEventListener('resize', onWindowResize);
            animate();

            // Initialize WebSocket
            initWebSocket();
        }

        function createCNC() {
            if (equipment) scene.remove(equipment);
            equipment = new THREE.Group();

            // Base
            const baseGeometry = new THREE.BoxGeometry(3.5, 0.4, 2.5);
            const baseMaterial = new THREE.MeshPhongMaterial({ color: 0x444444 });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = 0.2;
            equipment.add(base);

            // Column
            const columnGeometry = new THREE.BoxGeometry(0.6, 2.5, 0.6);
            const columnMaterial = new THREE.MeshPhongMaterial({ color: 0xb71c1c });
            const column = new THREE.Mesh(columnGeometry, columnMaterial);
            column.position.set(-1.2, 1.45, 0);
            equipment.add(column);

            // Spindle Head
            const headGeometry = new THREE.BoxGeometry(1.2, 0.8, 0.8);
            const headMaterial = new THREE.MeshPhongMaterial({ color: 0xd32f2f });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.set(0, 2.2, 0);
            equipment.add(head);

            // Spindle
            const spindleGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 32);
            const spindleMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
            const spindle = new THREE.Mesh(spindleGeometry, spindleMaterial);
            spindle.position.set(0, 1.6, 0);
            equipment.add(spindle);

            // Work Table
            const tableGeometry = new THREE.BoxGeometry(2, 0.2, 1.5);
            const tableMaterial = new THREE.MeshPhongMaterial({ color: 0x555555 });
            const table = new THREE.Mesh(tableGeometry, tableMaterial);
            table.position.set(0.5, 0.5, 0);
            equipment.add(table);

            // Control Panel
            const panelGeometry = new THREE.BoxGeometry(0.4, 1, 0.3);
            const panelMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
            const panel = new THREE.Mesh(panelGeometry, panelMaterial);
            panel.position.set(1.8, 1, 0.8);
            equipment.add(panel);

            // Sensor indicators
            const sensorGeometry = new THREE.SphereGeometry(0.08, 16, 16);
            const sensorMaterial = new THREE.MeshPhongMaterial({
                color: 0x4caf50,
                emissive: 0x4caf50,
                emissiveIntensity: 0.5
            });

            const sensorPositions = [
                { x: 0, y: 2.2, z: 0.5 },
                { x: 0, y: 1.2, z: 0.5 },
                { x: -1.2, y: 2.5, z: 0.4 },
                { x: 1.5, y: 0.5, z: 0.8 }
            ];
            sensorPositions.forEach(pos => {
                const sensor = new THREE.Mesh(sensorGeometry, sensorMaterial);
                sensor.position.set(pos.x, pos.y, pos.z);
                equipment.add(sensor);
            });

            scene.add(equipment);
        }

        function createPress() {
            if (equipment) scene.remove(equipment);
            equipment = new THREE.Group();

            // Base frame
            const baseGeometry = new THREE.BoxGeometry(2.5, 0.3, 2);
            const baseMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = 0.15;
            equipment.add(base);

            // Vertical columns
            const columnMaterial = new THREE.MeshPhongMaterial({ color: 0xb71c1c });
            [[-0.8, 0], [0.8, 0]].forEach(([x, z]) => {
                const column = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3, 0.3), columnMaterial);
                column.position.set(x, 1.65, z);
                equipment.add(column);
            });

            // Top beam
            const topGeometry = new THREE.BoxGeometry(2.2, 0.4, 0.8);
            const topMaterial = new THREE.MeshPhongMaterial({ color: 0xd32f2f });
            const top = new THREE.Mesh(topGeometry, topMaterial);
            top.position.set(0, 3, 0);
            equipment.add(top);

            // Ram/Slide
            const ramGeometry = new THREE.BoxGeometry(1.2, 0.6, 0.6);
            const ramMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
            const ram = new THREE.Mesh(ramGeometry, ramMaterial);
            ram.position.set(0, 2, 0);
            equipment.add(ram);

            // Die
            const dieGeometry = new THREE.BoxGeometry(1, 0.4, 0.5);
            const dieMaterial = new THREE.MeshPhongMaterial({ color: 0x555555 });
            const die = new THREE.Mesh(dieGeometry, dieMaterial);
            die.position.set(0, 0.5, 0);
            equipment.add(die);

            // Sensors
            const sensorGeometry = new THREE.SphereGeometry(0.08, 16, 16);
            const sensorMaterial = new THREE.MeshPhongMaterial({
                color: 0x4caf50,
                emissive: 0x4caf50,
                emissiveIntensity: 0.5
            });
            [[0, 2.3, 0.4], [-0.8, 1.5, 0.2], [0.8, 1.5, 0.2]].forEach(pos => {
                const sensor = new THREE.Mesh(sensorGeometry, sensorMaterial);
                sensor.position.set(...pos);
                equipment.add(sensor);
            });

            scene.add(equipment);
        }

        function createWelding() {
            if (equipment) scene.remove(equipment);
            equipment = new THREE.Group();

            // Base table
            const baseGeometry = new THREE.BoxGeometry(3, 0.2, 2);
            const baseMaterial = new THREE.MeshPhongMaterial({ color: 0x444444 });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = 0.8;
            equipment.add(base);

            // Table legs
            const legMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
            [[-1.2, -0.8], [-1.2, 0.8], [1.2, -0.8], [1.2, 0.8]].forEach(([x, z]) => {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.8, 0.15), legMaterial);
                leg.position.set(x, 0.4, z);
                equipment.add(leg);
            });

            // Welding arm support
            const supportGeometry = new THREE.CylinderGeometry(0.15, 0.15, 1.5, 16);
            const supportMaterial = new THREE.MeshPhongMaterial({ color: 0xb71c1c });
            const support = new THREE.Mesh(supportGeometry, supportMaterial);
            support.position.set(-1, 1.65, 0);
            equipment.add(support);

            // Welding arm
            const armGeometry = new THREE.BoxGeometry(1.5, 0.15, 0.15);
            const armMaterial = new THREE.MeshPhongMaterial({ color: 0xd32f2f });
            const arm = new THREE.Mesh(armGeometry, armMaterial);
            arm.position.set(-0.2, 2.3, 0);
            equipment.add(arm);

            // Welding torch
            const torchGeometry = new THREE.ConeGeometry(0.1, 0.4, 16);
            const torchMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
            const torch = new THREE.Mesh(torchGeometry, torchMaterial);
            torch.position.set(0.5, 2.1, 0);
            torch.rotation.x = Math.PI;
            equipment.add(torch);

            // Wire feeder
            const feederGeometry = new THREE.BoxGeometry(0.4, 0.6, 0.3);
            const feederMaterial = new THREE.MeshPhongMaterial({ color: 0xff5722 });
            const feeder = new THREE.Mesh(feederGeometry, feederMaterial);
            feeder.position.set(-1.5, 1.5, 0);
            equipment.add(feeder);

            // Workpiece
            const workGeometry = new THREE.BoxGeometry(0.8, 0.15, 0.5);
            const workMaterial = new THREE.MeshPhongMaterial({ color: 0x888888 });
            const work = new THREE.Mesh(workGeometry, workMaterial);
            work.position.set(0.3, 1, 0);
            equipment.add(work);

            // Sensors
            const sensorGeometry = new THREE.SphereGeometry(0.08, 16, 16);
            const sensorMaterial = new THREE.MeshPhongMaterial({
                color: 0x4caf50,
                emissive: 0x4caf50,
                emissiveIntensity: 0.5
            });
            [[0.5, 2.3, 0.15], [-1.5, 1.8, 0.2], [0.3, 1.2, 0.3]].forEach(pos => {
                const sensor = new THREE.Mesh(sensorGeometry, sensorMaterial);
                sensor.position.set(...pos);
                equipment.add(sensor);
            });

            scene.add(equipment);
        }

        function createCoating() {
            if (equipment) scene.remove(equipment);
            equipment = new THREE.Group();

            // Conveyor
            const conveyorGeometry = new THREE.BoxGeometry(5, 0.15, 0.8);
            const conveyorMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
            const conveyor = new THREE.Mesh(conveyorGeometry, conveyorMaterial);
            conveyor.position.set(0, 0.5, 0);
            equipment.add(conveyor);

            // Conveyor supports
            const supportMaterial = new THREE.MeshPhongMaterial({ color: 0x444444 });
            [-2, 0, 2].forEach(x => {
                const support = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.9), supportMaterial);
                support.position.set(x, 0.25, 0);
                equipment.add(support);
            });

            // Spray booth
            const boothGeometry = new THREE.BoxGeometry(1.5, 2, 1.2);
            const boothMaterial = new THREE.MeshPhongMaterial({ color: 0xb71c1c, transparent: true, opacity: 0.7 });
            const booth = new THREE.Mesh(boothGeometry, boothMaterial);
            booth.position.set(-0.5, 1.5, 0);
            equipment.add(booth);

            // Spray guns
            const gunMaterial = new THREE.MeshPhongMaterial({ color: 0xd32f2f });
            [-0.8, -0.2].forEach(x => {
                const gun = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.4, 16), gunMaterial);
                gun.position.set(x, 1.5, 0.7);
                gun.rotation.x = Math.PI / 2;
                equipment.add(gun);
            });

            // Drying oven
            const ovenGeometry = new THREE.BoxGeometry(1.8, 1.8, 1.2);
            const ovenMaterial = new THREE.MeshPhongMaterial({ color: 0xff5722, transparent: true, opacity: 0.6 });
            const oven = new THREE.Mesh(ovenGeometry, ovenMaterial);
            oven.position.set(1.8, 1.4, 0);
            equipment.add(oven);

            // Workpieces on conveyor
            const workMaterial = new THREE.MeshPhongMaterial({ color: 0x888888 });
            [-1.5, 0, 1.8].forEach(x => {
                const work = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 0.2), workMaterial);
                work.position.set(x, 0.8, 0);
                equipment.add(work);
            });

            // Sensors
            const sensorGeometry = new THREE.SphereGeometry(0.08, 16, 16);
            const sensorMaterial = new THREE.MeshPhongMaterial({
                color: 0x4caf50,
                emissive: 0x4caf50,
                emissiveIntensity: 0.5
            });
            [[-0.5, 2.3, 0.7], [1.8, 2.1, 0.7], [0.5, 0.8, 0.5]].forEach(pos => {
                const sensor = new THREE.Mesh(sensorGeometry, sensorMaterial);
                sensor.position.set(...pos);
                equipment.add(sensor);
            });

            scene.add(equipment);
        }

        function selectEquipment(type) {
            document.querySelectorAll('.equipment-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            switch(type) {
                case 'cnc': createCNC(); break;
                case 'press': createPress(); break;
                case 'welding': createWelding(); break;
                case 'coating': createCoating(); break;
            }
        }

        function toggleAutoRotate() {
            autoRotate = document.getElementById('autoRotate').checked;
        }

        function onWindowResize() {
            const container = document.getElementById('viewer');
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // WebSocket
        function initWebSocket() {
            const wsUrl = `ws://${window.location.host}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                updateConnectionStatus(true);
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'calibrateReset') {
                        targetRotation = { x: 0, y: 0, z: 0 };
                        currentRotation = { x: 0, y: 0, z: 0 };
                        calibratedOrientation = { roll: 0, pitch: 0 };
                        if (equipment) {
                            equipment.rotation.x = 0;
                            equipment.rotation.y = 0;
                            equipment.rotation.z = 0;
                        }
                        updateOrientationDisplay(0, 0, 0);
                        return;
                    }
                    if (data.type === 'calibratedOrientation') {
                        calibratedOrientation = { roll: data.roll || 0, pitch: data.pitch || 0 };
                        if (useRealOrientation) {
                            updateOrientationDisplay(0, calibratedOrientation.pitch, calibratedOrientation.roll);
                        }
                        return;
                    }
                    if (data.orientation && data.orientation.timestamp) {
                        remoteOrientation = {
                            alpha: data.orientation.alpha || 0,
                            beta: data.orientation.beta || 0,
                            gamma: data.orientation.gamma || 0
                        };
                        if (useRealOrientation) {
                            updateOrientationDisplay(remoteOrientation.alpha, remoteOrientation.beta, remoteOrientation.gamma);
                        }
                    }
                } catch (e) {}
            };

            ws.onclose = function() {
                updateConnectionStatus(false);
                setTimeout(initWebSocket, 3000);
            };
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('connectionDot');
            const text = document.getElementById('connectionText');
            if (connected) {
                dot.classList.add('connected');
                text.textContent = '연결됨';
            } else {
                dot.classList.remove('connected');
                text.textContent = '연결 대기';
            }
        }

        function togglePhoneConnection() {
            useRealOrientation = document.getElementById('phoneToggle').checked;
            if (!useRealOrientation) {
                targetRotation = { x: 0, y: 0, z: 0 };
                currentRotation = { x: 0, y: 0, z: 0 };
                calibratedOrientation = { roll: 0, pitch: 0 };
                if (equipment) {
                    equipment.rotation.x = 0;
                    equipment.rotation.y = 0;
                    equipment.rotation.z = 0;
                }
                updateOrientationDisplay(0, 0, 0);
            }
        }

        function toggleOrientationSource() {
            useRealOrientation = document.getElementById('orientationToggle')?.checked || document.getElementById('phoneToggle')?.checked || false;
            if (!useRealOrientation) {
                targetRotation = { x: 0, y: 0, z: 0 };
                currentRotation = { x: 0, y: 0, z: 0 };
            }
        }

        function updateOrientationDisplay(alpha, beta, gamma) {
            const alphaEl = document.getElementById('alphaValue');
            const betaEl = document.getElementById('betaValue');
            const gammaEl = document.getElementById('gammaValue');
            if (alphaEl) alphaEl.textContent = Math.round(alpha) + '°';
            if (betaEl) betaEl.textContent = Math.round(beta) + '°';
            if (gammaEl) gammaEl.textContent = Math.round(gamma) + '°';
        }

        function animate() {
            requestAnimationFrame(animate);

            if (equipment) {
                if (useRealOrientation) {
                    const toRad = Math.PI / 180;
                    targetRotation.z = calibratedOrientation.roll * toRad;
                    targetRotation.x = calibratedOrientation.pitch * toRad;

                    currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
                    currentRotation.z += (targetRotation.z - currentRotation.z) * 0.1;
                    equipment.rotation.x = currentRotation.x;
                    equipment.rotation.z = currentRotation.z;
                    equipment.rotation.y = Math.sin(Date.now() * 0.0005) * 0.05;
                } else if (autoRotate) {
                    equipment.rotation.y += 0.005;
                }
            }

            renderer.render(scene, camera);
        }

        // Sensor simulation
        let currentScenario = 'normal';
        let degradeCounter = 0;

        let sensorValues = {
            vibration: { current: 2.4, target: 2.4, unit: 'mm/s' },
            temperature: { current: 45, target: 45, unit: '°C' },
            current: { current: 32.5, target: 32.5, unit: 'A' },
            pressure: { current: 85, target: 85, unit: 'bar' },
            weldCurrent: { current: 180, target: 180, unit: 'A' },
            thickness: { current: 85, target: 85, unit: 'μm' }
        };

        const thresholds = {
            vibration: { warning: 4.5, danger: 7.0, max: 10 },
            temperature: { warning: 65, danger: 80, max: 100 },
            current: { warning: 50, danger: 65, max: 80 },
            pressure: { warning: 70, danger: 60, max: 100 },
            weldCurrent: { warning: 220, danger: 250, max: 300 },
            thickness: { warning: 60, danger: 50, max: 200 }
        };

        // Trend chart
        let trendChart = null;
        let trendData = { labels: [], vibration: [], temperature: [], current: [], pressure: [] };
        const maxDataPoints = 60;

        function initTrendChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: trendData.labels,
                    datasets: [
                        {
                            label: '진동',
                            data: trendData.vibration,
                            borderColor: '#4caf50',
                            backgroundColor: 'rgba(76, 175, 80, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            fill: true
                        },
                        {
                            label: '온도',
                            data: trendData.temperature,
                            borderColor: '#ff9800',
                            backgroundColor: 'rgba(255, 152, 0, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            fill: true,
                            yAxisID: 'y1'
                        },
                        {
                            label: '전류',
                            data: trendData.current,
                            borderColor: '#2196f3',
                            backgroundColor: 'rgba(33, 150, 243, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            fill: true,
                            yAxisID: 'y1'
                        },
                        {
                            label: '압력',
                            data: trendData.pressure,
                            borderColor: '#9c27b0',
                            backgroundColor: 'rgba(156, 39, 176, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            fill: true,
                            yAxisID: 'y2'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(26, 10, 10, 0.9)',
                            titleColor: '#fff',
                            bodyColor: '#aaa'
                        }
                    },
                    scales: {
                        x: { display: false },
                        y: {
                            position: 'left',
                            min: 0,
                            max: 10,
                            ticks: { color: '#666', font: { size: 10 } },
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            title: { display: true, text: 'mm/s', color: '#4caf50', font: { size: 9 } }
                        },
                        y1: {
                            position: 'right',
                            min: 0,
                            max: 100,
                            ticks: { color: '#666', font: { size: 10 } },
                            grid: { display: false },
                            title: { display: true, text: '°C / A', color: '#ff9800', font: { size: 9 } }
                        },
                        y2: {
                            display: false,
                            min: 0,
                            max: 100
                        }
                    },
                    animation: { duration: 300 }
                }
            });
        }

        function updateTrendChart() {
            const now = new Date();
            const timeLabel = now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

            trendData.labels.push(timeLabel);
            trendData.vibration.push(sensorValues.vibration.current);
            trendData.temperature.push(sensorValues.temperature.current);
            trendData.current.push(sensorValues.current.current);
            trendData.pressure.push(sensorValues.pressure.current);

            if (trendData.labels.length > maxDataPoints) {
                trendData.labels.shift();
                trendData.vibration.shift();
                trendData.temperature.shift();
                trendData.current.shift();
                trendData.pressure.shift();
            }

            if (trendChart) trendChart.update('none');
        }

        function setScenario(scenario) {
            currentScenario = scenario;
            degradeCounter = 0;
            document.querySelectorAll('.scenario-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            switch(scenario) {
                case 'spindle':
                    addAlert('warning', '스핀들 진동 증가 감지');
                    break;
                case 'bearing':
                    addAlert('danger', '베어링 과열 징후 (온도 상승)');
                    break;
                case 'welding':
                    addAlert('warning', '용접 전류 불안정');
                    break;
                case 'normal':
                    addAlert('info', '정상 운전 모드');
                    break;
            }
        }

        function addAlert(type, message) {
            const alertList = document.getElementById('alertList');
            const alert = document.createElement('div');
            alert.className = `alert-item ${type}`;
            alert.innerHTML = `${message}<div class="alert-time">방금 전</div>`;
            alertList.insertBefore(alert, alertList.firstChild);
            if (alertList.children.length > 5) {
                alertList.removeChild(alertList.lastChild);
            }
        }

        function generateTargetValues() {
            const scenarios = {
                normal: {
                    vibration: 2 + Math.random() * 1.5,
                    temperature: 42 + Math.random() * 8,
                    current: 30 + Math.random() * 8,
                    pressure: 82 + Math.random() * 6,
                    weldCurrent: 175 + Math.random() * 15,
                    thickness: 80 + Math.random() * 15
                },
                spindle: {
                    vibration: 5 + Math.random() * 2.5 + degradeCounter * 0.15,
                    temperature: 50 + Math.random() * 10,
                    current: 35 + Math.random() * 8,
                    pressure: 80 + Math.random() * 5,
                    weldCurrent: 180 + Math.random() * 10,
                    thickness: 82 + Math.random() * 12
                },
                bearing: {
                    vibration: 4 + Math.random() * 2,
                    temperature: 65 + Math.random() * 15 + degradeCounter * 0.8,
                    current: 38 + Math.random() * 10,
                    pressure: 78 + Math.random() * 5,
                    weldCurrent: 178 + Math.random() * 12,
                    thickness: 78 + Math.random() * 15
                },
                welding: {
                    vibration: 2.5 + Math.random() * 1.2,
                    temperature: 48 + Math.random() * 8,
                    current: 35 + Math.random() * 10,
                    pressure: 83 + Math.random() * 5,
                    weldCurrent: 200 + Math.random() * 30 + degradeCounter * 2,
                    thickness: 70 + Math.random() * 20
                }
            };

            const targets = scenarios[currentScenario];
            Object.keys(targets).forEach(key => {
                sensorValues[key].target = targets[key];
            });

            if (currentScenario !== 'normal') {
                degradeCounter += 0.5;
            }
        }

        function updateSensorDisplay() {
            Object.keys(sensorValues).forEach(key => {
                const sensor = sensorValues[key];
                const threshold = thresholds[key];

                sensor.current += (sensor.target - sensor.current) * 0.15;

                const valueEl = document.getElementById(key);
                const barEl = document.getElementById(key + 'Bar');

                if (!valueEl || !barEl) return;

                let percent = (sensor.current / threshold.max) * 100;
                percent = Math.min(100, Math.max(0, percent));

                let status = 'normal';
                if (key === 'pressure' || key === 'thickness') {
                    if (sensor.current <= threshold.danger) status = 'danger';
                    else if (sensor.current <= threshold.warning) status = 'warning';
                } else {
                    if (sensor.current >= threshold.danger) status = 'danger';
                    else if (sensor.current >= threshold.warning) status = 'warning';
                }

                if (key === 'thickness') {
                    valueEl.textContent = Math.round(sensor.current) + ' ' + sensor.unit;
                } else {
                    valueEl.textContent = sensor.current.toFixed(1) + ' ' + sensor.unit;
                }

                valueEl.className = 'sensor-value ' + status;
                barEl.className = 'sensor-bar-fill ' + status;
                barEl.style.width = percent + '%';
            });
        }

        // Initialize
        init();
        initTrendChart();

        setInterval(generateTargetValues, 2000);
        setInterval(updateTrendChart, 1000);
        setInterval(() => {
            updateSensorDisplay();
        }, 100);

        generateTargetValues();
        updateSensorDisplay();
        updateTrendChart();
    </script>
</body>
</html>
