<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b71c1c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d32f2f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="equipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#d32f2f" stroke-width="2"/>

  <!-- Explosion-proof symbol (Ex) representation -->
  <!-- Hexagonal shape representing explosion-proof enclosure -->
  <polygon points="50,20 75,32 75,58 50,70 25,58 25,32" fill="none" stroke="url(#equipGrad)" stroke-width="3"/>

  <!-- Inner E shape for "Explosion-proof" -->
  <path d="M 38 35 L 50 35 L 50 40 L 43 40 L 43 48 L 48 48 L 48 53 L 43 53 L 43 60 L 50 60 L 50 65 L 38 65 Z"
        fill="url(#equipGrad)" stroke="none"/>

  <!-- Inner x shape -->
  <path d="M 52 38 L 56 35 L 62 43 L 56 50 L 62 57 L 56 65 L 52 62 L 56 55 L 52 50 L 56 45 Z"
        fill="url(#equipGrad)" stroke="none"/>

  <!-- Fire/spark symbol -->
  <path d="M 50 12 Q 55 18 52 22 Q 58 18 55 25 Q 60 20 57 28 Q 52 24 50 28 Q 48 24 43 28 Q 40 20 45 25 Q 42 18 48 22 Q 45 18 50 12 Z"
        fill="#ff5722" stroke="none"/>

  <!-- Sensor indicator -->
  <circle cx="78" cy="25" r="8" fill="#4caf50" opacity="0.9"/>
  <circle cx="78" cy="25" r="4" fill="#ffffff"/>
  <circle cx="78" cy="25" r="12" fill="none" stroke="#4caf50" stroke-width="1.5" opacity="0.6"/>
  <circle cx="78" cy="25" r="16" fill="none" stroke="#4caf50" stroke-width="1" opacity="0.3"/>
</svg>
