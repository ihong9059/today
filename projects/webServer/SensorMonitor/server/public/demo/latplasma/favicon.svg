<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b21a8"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="plasmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#e879f9"/>
    </linearGradient>
    <linearGradient id="chamberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#455a64"/>
      <stop offset="100%" style="stop-color:#607d8b"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#purpleGrad)"/>

  <!-- Chamber body -->
  <rect x="16" y="18" width="32" height="28" rx="4" fill="url(#chamberGrad)" stroke="#37474f" stroke-width="1"/>

  <!-- Top electrode (RF) -->
  <rect x="20" y="20" width="24" height="4" rx="1" fill="#ff5722"/>

  <!-- Bottom electrode (Chuck) -->
  <rect x="22" y="40" width="20" height="4" rx="1" fill="#e91e63"/>

  <!-- Plasma glow -->
  <ellipse cx="32" cy="32" rx="10" ry="6" fill="url(#plasmaGrad)" opacity="0.8"/>

  <!-- Plasma core -->
  <ellipse cx="32" cy="32" rx="5" ry="3" fill="#ffffff" opacity="0.6"/>

  <!-- RF cable indicator -->
  <line x1="44" y1="22" x2="50" y2="16" stroke="#f57c00" stroke-width="2" stroke-linecap="round"/>
  <circle cx="51" cy="15" r="3" fill="#f57c00"/>

  <!-- Vacuum port -->
  <rect x="28" y="46" width="8" height="6" rx="1" fill="#455a64"/>
  <rect x="30" y="50" width="4" height="4" fill="#37474f"/>

  <!-- LAT label -->
  <text x="32" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white" opacity="0.9">LAT</text>
</svg>
