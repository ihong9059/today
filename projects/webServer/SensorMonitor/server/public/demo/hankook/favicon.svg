<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc6a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0a1a" stroke="url(#grad1)" stroke-width="2"/>

  <!-- Main crusher/mill body -->
  <ellipse cx="32" cy="28" rx="14" ry="10" fill="url(#grad1)"/>

  <!-- Top classifier -->
  <ellipse cx="32" cy="20" rx="8" ry="5" fill="#3b82f6"/>

  <!-- Bottom hopper -->
  <polygon points="22,35 42,35 36,50 28,50" fill="url(#grad1)"/>

  <!-- Discharge port -->
  <rect x="29" y="50" width="6" height="4" rx="1" fill="#64748b"/>

  <!-- Particles/powder effect -->
  <circle cx="20" cy="32" r="2" fill="url(#grad2)" opacity="0.9"/>
  <circle cx="44" cy="30" r="1.5" fill="url(#grad2)" opacity="0.8"/>
  <circle cx="18" cy="38" r="1.5" fill="url(#grad3)" opacity="0.7"/>
  <circle cx="46" cy="36" r="2" fill="url(#grad3)" opacity="0.8"/>
  <circle cx="24" cy="44" r="1" fill="url(#grad2)" opacity="0.6"/>
  <circle cx="40" cy="42" r="1.2" fill="url(#grad2)" opacity="0.7"/>

  <!-- Energy/signal waves -->
  <path d="M14 24 Q10 28 14 32" stroke="url(#grad2)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M10 22 Q4 28 10 34" stroke="url(#grad2)" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M50 24 Q54 28 50 32" stroke="url(#grad2)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M54 22 Q60 28 54 34" stroke="url(#grad2)" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- K letter stylized -->
  <text x="32" y="33" font-family="Arial Black, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">K</text>
</svg>
