<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00695c"/>
      <stop offset="100%" style="stop-color:#26a69a"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0"/>
      <stop offset="50%" style="stop-color:#bdbdbd"/>
      <stop offset="100%" style="stop-color:#9e9e9e"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#tealGrad)"/>

  <!-- Pump representation -->
  <g transform="translate(32, 32)">
    <!-- Pump body -->
    <ellipse cx="0" cy="0" rx="12" ry="10" fill="url(#metalGrad)" stroke="#546e7a" stroke-width="1"/>

    <!-- Impeller blades -->
    <g fill="#37474f" stroke="#263238" stroke-width="0.5">
      <path d="M0,-6 L3,0 L0,6 L-3,0 Z"/>
      <path d="M-6,0 L0,3 L6,0 L0,-3 Z"/>
    </g>

    <!-- Center hub -->
    <circle cx="0" cy="0" r="3" fill="#455a64"/>
    <circle cx="0" cy="0" r="1.5" fill="#00695c"/>

    <!-- Inlet pipe -->
    <rect x="-18" y="-3" width="8" height="6" rx="1" fill="#607d8b"/>

    <!-- Outlet pipe -->
    <rect x="10" y="-3" width="8" height="6" rx="1" fill="#607d8b"/>
  </g>

  <!-- Flow arrows -->
  <g fill="rgba(255,255,255,0.7)">
    <polygon points="10,32 16,29 16,35"/>
    <polygon points="54,32 48,29 48,35"/>
  </g>

  <!-- SK label -->
  <text x="32" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="white" opacity="0.9">SK</text>
</svg>
