<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#3949ab"/>
    </linearGradient>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c6bc0"/>
      <stop offset="100%" style="stop-color:#7986cb"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#indigoGrad)"/>

  <!-- Radiator Cap Base -->
  <ellipse cx="32" cy="36" rx="16" ry="8" fill="#283593"/>

  <!-- Cap Body -->
  <ellipse cx="32" cy="32" rx="14" ry="10" fill="url(#lightGrad)"/>

  <!-- Cap Top -->
  <ellipse cx="32" cy="28" rx="10" ry="6" fill="#9fa8da"/>

  <!-- Pressure Release Valve -->
  <rect x="28" y="22" width="8" height="6" rx="2" fill="#1a237e"/>
  <circle cx="32" cy="20" r="4" fill="#283593"/>

  <!-- Handle/Grip Lines -->
  <ellipse cx="32" cy="32" rx="12" ry="8" fill="none" stroke="#1a237e" stroke-width="1"/>
  <ellipse cx="32" cy="34" rx="14" ry="9" fill="none" stroke="#1a237e" stroke-width="0.5"/>

  <!-- Grip Pattern -->
  <line x1="22" y1="32" x2="22" y2="36" stroke="#1a237e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="30" x2="26" y2="38" stroke="#1a237e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="30" x2="38" y2="38" stroke="#1a237e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="32" x2="42" y2="36" stroke="#1a237e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Highlight -->
  <ellipse cx="28" cy="26" rx="4" ry="2" fill="rgba(255,255,255,0.3)"/>

  <!-- PS Text -->
  <text x="32" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="white">PS</text>

  <!-- Status Indicator -->
  <circle cx="52" cy="12" r="5" fill="#1a1a2e"/>
  <circle cx="52" cy="12" r="3" fill="#4caf50"/>
</svg>
