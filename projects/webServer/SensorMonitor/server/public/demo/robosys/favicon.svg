<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f7a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6f42c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#159895;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#57c5b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b7bff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jointGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4c4f9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#57c5b6" stroke-width="2"/>

  <!-- EFEM-style base platform -->
  <rect x="15" y="70" width="70" height="8" rx="3" fill="#0d3d56"/>
  <rect x="20" y="62" width="60" height="10" rx="2" fill="url(#robotGrad)" opacity="0.7"/>

  <!-- Wafer cassette (left) -->
  <rect x="22" y="52" width="14" height="12" rx="2" fill="#2a2a4a" stroke="#9b7bff" stroke-width="1"/>
  <line x1="24" y1="55" x2="34" y2="55" stroke="#57c5b6" stroke-width="1" opacity="0.7"/>
  <line x1="24" y1="58" x2="34" y2="58" stroke="#57c5b6" stroke-width="1" opacity="0.7"/>
  <line x1="24" y1="61" x2="34" y2="61" stroke="#57c5b6" stroke-width="1" opacity="0.7"/>

  <!-- Wafer cassette (right) -->
  <rect x="64" y="52" width="14" height="12" rx="2" fill="#2a2a4a" stroke="#9b7bff" stroke-width="1"/>
  <line x1="66" y1="55" x2="76" y2="55" stroke="#57c5b6" stroke-width="1" opacity="0.7"/>
  <line x1="66" y1="58" x2="76" y2="58" stroke="#57c5b6" stroke-width="1" opacity="0.7"/>
  <line x1="66" y1="61" x2="76" y2="61" stroke="#57c5b6" stroke-width="1" opacity="0.7"/>

  <!-- WTR Robot arm base -->
  <circle cx="50" cy="58" r="8" fill="url(#robotGrad)"/>
  <circle cx="50" cy="58" r="5" fill="url(#jointGrad)"/>

  <!-- Robot arm link 1 -->
  <line x1="50" y1="58" x2="50" y2="38" stroke="url(#robotGrad)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="50" cy="38" r="4" fill="url(#jointGrad)"/>

  <!-- Robot arm link 2 (angled) -->
  <line x1="50" y1="38" x2="70" y2="28" stroke="url(#robotGrad)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="70" cy="28" r="3.5" fill="url(#jointGrad)"/>

  <!-- End effector (wafer blade) -->
  <ellipse cx="78" cy="28" rx="8" ry="3" fill="#57c5b6" opacity="0.8"/>
  <ellipse cx="78" cy="28" rx="6" ry="2" fill="#9b7bff" opacity="0.6"/>

  <!-- Wafer on blade -->
  <circle cx="78" cy="28" r="5" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.8"/>

  <!-- AI/Sensor indicator -->
  <circle cx="25" cy="25" r="10" fill="rgba(111, 66, 193, 0.3)"/>
  <circle cx="25" cy="25" r="6" fill="rgba(87, 197, 182, 0.5)"/>
  <circle cx="25" cy="25" r="3" fill="#57c5b6"/>

  <!-- Signal waves -->
  <path d="M 25 15 Q 35 12 40 15" fill="none" stroke="#9b7bff" stroke-width="1.5" opacity="0.7"/>
  <path d="M 25 11 Q 38 7 45 11" fill="none" stroke="#9b7bff" stroke-width="1.5" opacity="0.5"/>

  <!-- RS text for Robot System -->
  <text x="72" y="78" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#57c5b6">RS</text>
</svg>
