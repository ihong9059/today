<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0392b"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b2316"/>
      <stop offset="100%" style="stop-color:#a93226"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#e67e22"/>
    </linearGradient>
    <linearGradient id="heatGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="50%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#f1c40f"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#redGrad)"/>

  <!-- Furnace Body -->
  <rect x="14" y="18" width="36" height="28" rx="3" fill="url(#darkGrad)"/>

  <!-- Furnace Opening (Door) -->
  <rect x="16" y="20" width="14" height="18" rx="2" fill="#1a1a2e"/>

  <!-- Heat Glow inside -->
  <rect x="18" y="22" width="10" height="14" rx="1" fill="url(#heatGrad)" opacity="0.8"/>

  <!-- Heating Elements (SiC) -->
  <g fill="url(#orangeGrad)">
    <rect x="34" y="22" width="12" height="3" rx="1"/>
    <rect x="34" y="28" width="12" height="3" rx="1"/>
    <rect x="34" y="34" width="12" height="3" rx="1"/>
  </g>

  <!-- Heat Waves -->
  <g stroke="#f39c12" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M20 48 Q23 52 20 56"/>
    <path d="M26 48 Q29 52 26 56"/>
    <path d="M32 48 Q35 52 32 56"/>
  </g>

  <!-- Control Panel -->
  <rect x="40" y="40" width="8" height="4" rx="1" fill="#333"/>
  <circle cx="42" cy="42" r="1" fill="#27ae60"/>
  <circle cx="46" cy="42" r="1" fill="#f39c12"/>

  <!-- DM Text -->
  <text x="32" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">DM</text>

  <!-- Status Indicator -->
  <circle cx="52" cy="12" r="6" fill="#1a1a2e"/>
  <circle cx="52" cy="12" r="4" fill="#27ae60"/>
</svg>
