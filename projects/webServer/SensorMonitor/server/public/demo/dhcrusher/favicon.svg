<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bf360c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d84315;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  <!-- Crusher body -->
  <rect x="25" y="30" width="50" height="30" rx="3" fill="#fff" opacity="0.9"/>
  <!-- Feed hopper -->
  <polygon points="35,15 65,15 60,30 40,30" fill="#fff" opacity="0.9"/>
  <!-- Discharge -->
  <polygon points="38,60 62,60 58,75 42,75" fill="#fff" opacity="0.9"/>
  <!-- Rotating blades inside -->
  <circle cx="50" cy="45" r="8" fill="none" stroke="#bf360c" stroke-width="2.5"/>
  <line x1="42" y1="45" x2="58" y2="45" stroke="#bf360c" stroke-width="2.5"/>
  <line x1="50" y1="37" x2="50" y2="53" stroke="#bf360c" stroke-width="2.5"/>
  <!-- Motor -->
  <rect x="75" y="38" width="12" height="14" rx="2" fill="#fff" opacity="0.85"/>
  <!-- Particles -->
  <circle cx="45" cy="68" r="2" fill="#bf360c"/>
  <circle cx="55" cy="70" r="2" fill="#bf360c"/>
  <circle cx="50" cy="72" r="1.5" fill="#bf360c"/>
</svg>
