<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c"/>
      <stop offset="100%" style="stop-color:#16a085"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#navyGrad)"/>

  <!-- Valve Body (Wafer style) -->
  <ellipse cx="32" cy="32" rx="18" ry="10" fill="#2980b9"/>

  <!-- Inner Bore -->
  <ellipse cx="32" cy="32" rx="12" ry="6" fill="#1a1a2e"/>

  <!-- Butterfly Disc -->
  <ellipse cx="32" cy="32" rx="11" ry="5" fill="url(#tealGrad)" transform="rotate(30, 32, 32)"/>

  <!-- Disc Edge (광택) -->
  <ellipse cx="32" cy="32" rx="11" ry="5" fill="none" stroke="#e0e0e0" stroke-width="1.5" transform="rotate(30, 32, 32)"/>

  <!-- Shaft -->
  <line x1="32" y1="18" x2="32" y2="46" stroke="#95a5a6" stroke-width="3" stroke-linecap="round"/>

  <!-- Actuator -->
  <rect x="26" y="12" width="12" height="8" rx="2" fill="#34495e"/>
  <circle cx="32" cy="10" r="4" fill="#34495e"/>

  <!-- Indicator -->
  <rect x="29" y="7" width="6" height="2" rx="1" fill="#27ae60" transform="rotate(30, 32, 8)"/>

  <!-- Flanges -->
  <ellipse cx="32" cy="32" rx="20" ry="11" fill="none" stroke="#2980b9" stroke-width="2"/>

  <!-- Bolt Holes -->
  <circle cx="14" cy="32" r="2" fill="#1a1a2e"/>
  <circle cx="50" cy="32" r="2" fill="#1a1a2e"/>
  <circle cx="22" cy="24" r="2" fill="#1a1a2e"/>
  <circle cx="42" cy="24" r="2" fill="#1a1a2e"/>
  <circle cx="22" cy="40" r="2" fill="#1a1a2e"/>
  <circle cx="42" cy="40" r="2" fill="#1a1a2e"/>

  <!-- SW Text -->
  <text x="32" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="white">SW</text>

  <!-- Status Indicator -->
  <circle cx="52" cy="12" r="5" fill="#1a1a2e"/>
  <circle cx="52" cy="12" r="3" fill="#27ae60"/>
</svg>
