<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffc107"/>
      <stop offset="100%" style="stop-color:#ff9800"/>
    </linearGradient>
  </defs>

  <!-- 배경 원 -->
  <circle cx="32" cy="32" r="30" fill="#0a1628" stroke="#1976d2" stroke-width="2"/>

  <!-- 배전반 본체 -->
  <rect x="14" y="12" width="36" height="44" rx="3" fill="url(#grad1)"/>

  <!-- 배전반 문 -->
  <rect x="16" y="14" width="32" height="40" rx="2" fill="#1565c0" stroke="#0d47a1" stroke-width="1"/>

  <!-- 상단 계기판 영역 -->
  <rect x="18" y="16" width="28" height="12" rx="1" fill="#0a1628"/>

  <!-- 디지털 디스플레이 -->
  <rect x="20" y="18" width="10" height="8" rx="1" fill="#00ff88" opacity="0.8"/>
  <rect x="32" y="18" width="12" height="8" rx="1" fill="#00ff88" opacity="0.8"/>

  <!-- 전류계/전압계 표시 -->
  <text x="25" y="25" fill="#003311" font-size="5" font-weight="bold" text-anchor="middle">A</text>
  <text x="38" y="25" fill="#003311" font-size="5" font-weight="bold" text-anchor="middle">V</text>

  <!-- 차단기 영역 -->
  <rect x="18" y="30" width="28" height="20" rx="1" fill="#263238"/>

  <!-- 차단기 3개 -->
  <rect x="20" y="32" width="7" height="16" rx="1" fill="#37474f"/>
  <rect x="28.5" y="32" width="7" height="16" rx="1" fill="#37474f"/>
  <rect x="37" y="32" width="7" height="16" rx="1" fill="#37474f"/>

  <!-- 차단기 손잡이 (레버) -->
  <rect x="22" y="34" width="3" height="6" rx="0.5" fill="url(#grad2)"/>
  <rect x="30.5" y="34" width="3" height="6" rx="0.5" fill="url(#grad2)"/>
  <rect x="39" y="34" width="3" height="6" rx="0.5" fill="url(#grad2)"/>

  <!-- LED 표시등 -->
  <circle cx="23.5" cy="44" r="2" fill="#00ff00"/>
  <circle cx="32" cy="44" r="2" fill="#00ff00"/>
  <circle cx="40.5" cy="44" r="2" fill="#ff0000"/>

  <!-- 하단 번개 심볼 -->
  <polygon points="32,50 28,54 31,54 29,58 35,52 32,52 34,50" fill="#ffc107"/>

  <!-- 상태 표시 점 -->
  <circle cx="50" cy="16" r="4" fill="#00ff88">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
