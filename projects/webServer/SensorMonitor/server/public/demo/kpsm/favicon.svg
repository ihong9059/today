<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#303f9f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="millGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#303f9f" stroke-width="2"/>

  <!-- Air Jet Mill representation -->
  <!-- Main grinding chamber -->
  <ellipse cx="50" cy="50" rx="25" ry="25" fill="url(#millGrad)" stroke="#5c6bc0" stroke-width="1.5"/>

  <!-- Inner chamber -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="#1a237e" stroke-width="2"/>

  <!-- Air nozzles (4 directions) -->
  <line x1="20" y1="50" x2="35" y2="50" stroke="#7986cb" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="65" y2="50" stroke="#7986cb" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="20" x2="50" y2="35" stroke="#7986cb" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="50" y2="65" stroke="#7986cb" stroke-width="3" stroke-linecap="round"/>

  <!-- Swirl pattern (air flow) -->
  <path d="M 50 42 Q 58 42 58 50 Q 58 58 50 58 Q 42 58 42 50 Q 42 42 50 42"
        fill="none" stroke="#9fa8da" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Center point -->
  <circle cx="50" cy="50" r="4" fill="#1a237e"/>

  <!-- Sensor indicator -->
  <circle cx="78" cy="25" r="8" fill="#4caf50" opacity="0.9"/>
  <circle cx="78" cy="25" r="4" fill="#ffffff"/>
  <circle cx="78" cy="25" r="12" fill="none" stroke="#4caf50" stroke-width="1.5" opacity="0.6"/>
  <circle cx="78" cy="25" r="16" fill="none" stroke="#4caf50" stroke-width="1" opacity="0.3"/>
</svg>
