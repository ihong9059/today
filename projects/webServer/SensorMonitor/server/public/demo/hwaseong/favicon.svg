<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#tealGrad)"/>

  <!-- Machine Base -->
  <rect x="12" y="42" width="40" height="6" rx="2" fill="#134e4a"/>

  <!-- Column -->
  <rect x="14" y="18" width="8" height="24" rx="1" fill="#0891b2"/>

  <!-- Spindle Head -->
  <rect x="20" y="20" width="16" height="10" rx="2" fill="url(#cyanGrad)"/>

  <!-- Spindle -->
  <rect x="26" y="30" width="4" height="8" fill="#10b981"/>

  <!-- Tool -->
  <polygon points="28,38 30,38 29,44" fill="#f59e0b"/>

  <!-- Table -->
  <rect x="22" y="46" width="24" height="3" rx="1" fill="#14b8a6"/>

  <!-- Workpiece -->
  <rect x="30" y="42" width="10" height="4" rx="1" fill="#99f6e4"/>

  <!-- Control Panel -->
  <rect x="44" y="22" width="8" height="14" rx="2" fill="#134e4a"/>
  <rect x="46" y="24" width="4" height="6" rx="1" fill="#06b6d4"/>

  <!-- Buttons -->
  <circle cx="48" cy="33" r="1.5" fill="#10b981"/>
  <circle cx="48" cy="33" r="0.8" fill="#34d399"/>

  <!-- Sensor Indicator -->
  <circle cx="28" y="24" r="2" fill="#10b981"/>
  <circle cx="28" y="24" r="1" fill="#34d399"/>

  <!-- HSMC Text -->
  <text x="32" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">HSMC</text>

  <!-- Status Indicator -->
  <circle cx="52" cy="12" r="5" fill="#134e4a"/>
  <circle cx="52" cy="12" r="3" fill="#10b981"/>
</svg>
