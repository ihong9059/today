<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 모니터링 - (주)선진파워텍 SP-PdM</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b3a5a 50%, #0d1b2a 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* Navigation */
        .nav {
            background: rgba(21, 101, 192, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(33, 150, 243, 0.3);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo img {
            height: 36px;
        }

        .nav-logo span {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #90caf9, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #bbdefb;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
            background: rgba(144, 202, 249, 0.2);
        }

        /* Main Content */
        .main-content {
            padding-top: 80px;
        }

        /* Header */
        .page-header {
            background: linear-gradient(135deg, rgba(21, 101, 192, 0.4), rgba(33, 150, 243, 0.2));
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(144, 202, 249, 0.2);
        }

        .page-header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #90caf9, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: #90caf9;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 3rem;
            padding: 1rem;
            background: rgba(13, 27, 42, 0.8);
            border-bottom: 1px solid rgba(144, 202, 249, 0.1);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.green { background: #4caf50; box-shadow: 0 0 10px #4caf50; }
        .status-dot.yellow { background: #ff9800; box-shadow: 0 0 10px #ff9800; }
        .status-dot.red { background: #f44336; box-shadow: 0 0 10px #f44336; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Factory Tabs */
        .factory-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(27, 58, 90, 0.4);
        }

        .factory-tab {
            padding: 0.75rem 2rem;
            background: rgba(13, 27, 42, 0.6);
            border: 1px solid rgba(144, 202, 249, 0.2);
            border-radius: 25px;
            color: #90caf9;
            cursor: pointer;
            transition: all 0.3s;
        }

        .factory-tab.active {
            background: linear-gradient(135deg, #1565c0, #2196f3);
            color: #fff;
            border-color: transparent;
        }

        .factory-tab:hover:not(.active) {
            border-color: rgba(144, 202, 249, 0.4);
        }

        /* Monitor Grid */
        .monitor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* 3D Viewer */
        .viewer-panel {
            background: rgba(27, 58, 90, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(144, 202, 249, 0.2);
            overflow: hidden;
        }

        .panel-header {
            background: linear-gradient(135deg, rgba(21, 101, 192, 0.6), rgba(33, 150, 243, 0.4));
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(144, 202, 249, 0.2);
        }

        .panel-header h3 {
            color: #90caf9;
            font-size: 1.1rem;
        }

        .equipment-select {
            background: rgba(13, 27, 42, 0.8);
            border: 1px solid rgba(144, 202, 249, 0.3);
            color: #e0e0e0;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .viewer-container {
            height: 400px;
            position: relative;
        }

        #equipment-3d {
            width: 100%;
            height: 100%;
        }

        .viewer-controls {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .viewer-btn {
            background: rgba(21, 101, 192, 0.8);
            border: 1px solid rgba(144, 202, 249, 0.3);
            color: #e0e0e0;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .viewer-btn:hover {
            background: rgba(33, 150, 243, 0.8);
        }

        /* Sensor Panel */
        .sensor-panel {
            background: rgba(27, 58, 90, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(144, 202, 249, 0.2);
            overflow: hidden;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            padding: 1rem;
        }

        .sensor-card {
            background: rgba(13, 27, 42, 0.6);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid rgba(144, 202, 249, 0.15);
            transition: all 0.3s;
        }

        .sensor-card:hover {
            border-color: rgba(144, 202, 249, 0.4);
            transform: translateY(-2px);
        }

        .sensor-card.warning {
            border-color: rgba(255, 152, 0, 0.5);
            background: rgba(255, 152, 0, 0.1);
        }

        .sensor-card.danger {
            border-color: rgba(244, 67, 54, 0.5);
            background: rgba(244, 67, 54, 0.1);
            animation: alertPulse 1s infinite;
        }

        @keyframes alertPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(244, 67, 54, 0.3); }
            50% { box-shadow: 0 0 20px rgba(244, 67, 54, 0.6); }
        }

        .sensor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .sensor-name {
            font-size: 0.85rem;
            color: #90caf9;
        }

        .sensor-icon {
            font-size: 1.2rem;
        }

        .sensor-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.3rem;
        }

        .sensor-unit {
            font-size: 0.9rem;
            color: #64b5f6;
        }

        .sensor-range {
            font-size: 0.75rem;
            color: #78909c;
            margin-top: 0.5rem;
        }

        .sensor-bar {
            height: 4px;
            background: rgba(144, 202, 249, 0.2);
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .sensor-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #1565c0, #2196f3);
            border-radius: 2px;
            transition: width 0.5s;
        }

        .sensor-card.warning .sensor-bar-fill {
            background: linear-gradient(90deg, #ff9800, #ffb74d);
        }

        .sensor-card.danger .sensor-bar-fill {
            background: linear-gradient(90deg, #f44336, #ef5350);
        }

        /* Chart Panel */
        .chart-panel {
            background: rgba(27, 58, 90, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(144, 202, 249, 0.2);
            overflow: hidden;
        }

        .chart-container {
            padding: 1rem;
            height: 300px;
        }

        /* Equipment Status */
        .equipment-status {
            background: rgba(27, 58, 90, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(144, 202, 249, 0.2);
            overflow: hidden;
        }

        .equipment-list {
            padding: 1rem;
            max-height: 350px;
            overflow-y: auto;
        }

        .equipment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(13, 27, 42, 0.5);
            border-radius: 10px;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(144, 202, 249, 0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .equipment-item:hover {
            border-color: rgba(144, 202, 249, 0.3);
        }

        .equipment-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .equipment-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #1565c0, #2196f3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .equipment-name {
            font-weight: 600;
            color: #e0e0e0;
        }

        .equipment-location {
            font-size: 0.8rem;
            color: #78909c;
        }

        .equipment-metrics {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .metric {
            text-align: center;
        }

        .metric-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #90caf9;
        }

        .metric-label {
            font-size: 0.7rem;
            color: #78909c;
        }

        .health-badge {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .health-badge.good {
            background: rgba(76, 175, 80, 0.2);
            color: #81c784;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .health-badge.warning {
            background: rgba(255, 152, 0, 0.2);
            color: #ffb74d;
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        .health-badge.critical {
            background: rgba(244, 67, 54, 0.2);
            color: #ef5350;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        /* Tool Wear Panel */
        .tool-wear-panel {
            grid-column: span 2;
            background: rgba(27, 58, 90, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(144, 202, 249, 0.2);
            overflow: hidden;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1rem;
            padding: 1rem;
        }

        .tool-card {
            background: rgba(13, 27, 42, 0.6);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            border: 1px solid rgba(144, 202, 249, 0.15);
        }

        .tool-name {
            color: #90caf9;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .tool-wear-circle {
            width: 60px;
            height: 60px;
            margin: 0 auto 0.5rem;
            position: relative;
        }

        .tool-wear-circle svg {
            transform: rotate(-90deg);
        }

        .tool-wear-circle circle {
            fill: none;
            stroke-width: 6;
        }

        .tool-wear-circle .bg {
            stroke: rgba(144, 202, 249, 0.2);
        }

        .tool-wear-circle .progress {
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s;
        }

        .tool-wear-circle .progress.good { stroke: #4caf50; }
        .tool-wear-circle .progress.warning { stroke: #ff9800; }
        .tool-wear-circle .progress.critical { stroke: #f44336; }

        .tool-wear-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
        }

        .tool-rul {
            font-size: 0.75rem;
            color: #78909c;
        }

        /* Alert Log */
        .alert-log {
            grid-column: span 2;
            background: rgba(27, 58, 90, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(144, 202, 249, 0.2);
            overflow: hidden;
            max-height: 250px;
        }

        .log-list {
            padding: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .log-item.info {
            background: rgba(33, 150, 243, 0.1);
            border-left: 3px solid #2196f3;
        }

        .log-item.warning {
            background: rgba(255, 152, 0, 0.1);
            border-left: 3px solid #ff9800;
        }

        .log-item.error {
            background: rgba(244, 67, 54, 0.1);
            border-left: 3px solid #f44336;
        }

        .log-time {
            color: #78909c;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .log-message {
            flex: 1;
            color: #e0e0e0;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .monitor-grid {
                grid-template-columns: 1fr;
            }

            .tool-wear-panel,
            .alert-log {
                grid-column: span 1;
            }

            .tool-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .sensor-grid {
                grid-template-columns: 1fr;
            }

            .equipment-metrics {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .tool-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .status-bar {
                flex-wrap: wrap;
                gap: 1rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(13, 27, 42, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(33, 150, 243, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="favicon.svg" alt="선진파워텍 로고">
                <span>SP-PdM</span>
            </div>
            <div class="nav-links">
                <a href="index.html">홈</a>
                <a href="system.html">시스템</a>
                <a href="monitor.html" class="active">모니터링</a>
                <a href="about.html">회사소개</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <div class="page-header">
            <h1>실시간 설비 모니터링</h1>
            <p>SP-PdM (SunJin Powertech Predictive Maintenance) Dashboard</p>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot green"></span>
                <span>정상 가동: <strong id="normalCount">32</strong>대</span>
            </div>
            <div class="status-item">
                <span class="status-dot yellow"></span>
                <span>주의 필요: <strong id="warningCount">2</strong>대</span>
            </div>
            <div class="status-item">
                <span class="status-dot red"></span>
                <span>긴급 점검: <strong id="criticalCount">1</strong>대</span>
            </div>
            <div class="status-item">
                <span>마지막 업데이트: <strong id="lastUpdate">--:--:--</strong></span>
            </div>
        </div>

        <!-- Factory Tabs -->
        <div class="factory-tabs">
            <div class="factory-tab active" onclick="switchFactory('all')">전체 (2개 공장)</div>
            <div class="factory-tab" onclick="switchFactory('pyeongtaek')">📍 평택공장</div>
            <div class="factory-tab" onclick="switchFactory('ansung')">📍 안성공장</div>
        </div>

        <!-- Monitor Grid -->
        <div class="monitor-grid">
            <!-- 3D Viewer -->
            <div class="viewer-panel">
                <div class="panel-header">
                    <h3>3D 설비 뷰어</h3>
                    <select class="equipment-select" id="equipmentSelect">
                        <option value="cnc">CNC 선반</option>
                        <option value="mct">머시닝센터 (MCT)</option>
                        <option value="injection">사출기</option>
                        <option value="press">프레스</option>
                    </select>
                </div>
                <div class="viewer-container">
                    <div id="equipment-3d"></div>
                    <div class="viewer-controls">
                        <button class="viewer-btn" onclick="resetView()">↺ 초기화</button>
                        <button class="viewer-btn" onclick="toggleWireframe()">▦ 와이어프레임</button>
                        <button class="viewer-btn" onclick="toggleSensors()">📍 센서 표시</button>
                    </div>
                </div>
            </div>

            <!-- Sensor Panel -->
            <div class="sensor-panel">
                <div class="panel-header">
                    <h3>실시간 센서 데이터</h3>
                    <span id="sensorEquipment">CNC 선반 #1</span>
                </div>
                <div class="sensor-grid" id="sensorGrid">
                    <!-- Sensors populated by JS -->
                </div>
            </div>

            <!-- Trend Chart -->
            <div class="chart-panel">
                <div class="panel-header">
                    <h3>스핀들 진동 트렌드 (24시간)</h3>
                </div>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- Equipment Status -->
            <div class="equipment-status">
                <div class="panel-header">
                    <h3>설비 상태 요약</h3>
                </div>
                <div class="equipment-list" id="equipmentList">
                    <!-- Equipment items populated by JS -->
                </div>
            </div>

            <!-- Tool Wear Panel -->
            <div class="tool-wear-panel">
                <div class="panel-header">
                    <h3>공구 마모 현황</h3>
                    <span>AI 예측 기반</span>
                </div>
                <div class="tool-grid" id="toolGrid">
                    <!-- Tool cards populated by JS -->
                </div>
            </div>

            <!-- Alert Log -->
            <div class="alert-log">
                <div class="panel-header">
                    <h3>실시간 알림 로그</h3>
                </div>
                <div class="log-list" id="logList">
                    <!-- Logs populated by JS -->
                </div>
            </div>
        </div>
    </main>

                    { id: 'clamp', name: '형체력', value: 280, unit: 'ton', min: 0, max: 350, icon: '🔧' },
                    { id: 'screw', name: '스크류 마모', value: 0.15, unit: 'mm', min: 0, max: 0.5, icon: '🔩' },
                    { id: 'cycle', name: '사이클 타임', value: 28.5, unit: 'sec', min: 20, max: 40, icon: '⏱️' }
                ],
                health: 'good',
                oee: 88.4,
                rul: 3100
            },
            press: {
                name: '프레스 #1',
                sensors: [
                    { id: 'temp', name: '금형온도', value: 120, unit: '°C', min: 80, max: 160, icon: '🌡️' },
                    { id: 'force', name: '프레스력', value: 150, unit: 'ton', min: 0, max: 200, icon: '💪' },
                    { id: 'stroke', name: '스트로크', value: 85, unit: 'mm', min: 0, max: 120, icon: '📏' },
                    { id: 'current', name: '모터 전류', value: 45, unit: 'A', min: 0, max: 80, icon: '⚡' },
                    { id: 'vibration', name: '진동', value: 4.2, unit: 'mm/s', min: 0, max: 8, icon: '📳' },
                    { id: 'cycle', name: '사이클', value: 12, unit: 'SPM', min: 0, max: 20, icon: '🔄' }
                ],
                health: 'good',
                oee: 89.1,
                rul: 2800
            }
        };

        // Equipment list data
        const equipmentList = [
            { name: 'CNC 선반 #1', location: '평택', type: 'cnc', health: 'good', oee: 91.2, rul: 2400 },
            { name: 'CNC 선반 #2', location: '평택', type: 'cnc', health: 'good', oee: 89.5, rul: 2100 },
            { name: '머시닝센터 #1', location: '평택', type: 'mct', health: 'warning', oee: 85.6, rul: 1200 },
            { name: '머시닝센터 #2', location: '평택', type: 'mct', health: 'good', oee: 92.1, rul: 2800 },
            { name: '사출기 #1', location: '안성', type: 'injection', health: 'good', oee: 88.4, rul: 3100 },
            { name: '프레스 #1', location: '안성', type: 'press', health: 'critical', oee: 78.2, rul: 450 },
        ];

        // Tool data
        const toolData = [
            { name: '엔드밀 ø10', wear: 35, status: 'good', rul: '8.5h' },
            { name: '드릴 ø6', wear: 72, status: 'warning', rul: '2.1h' },
            { name: '탭 M8', wear: 28, status: 'good', rul: '12h' },
            { name: '인서트 T1', wear: 85, status: 'critical', rul: '0.8h' },
            { name: '보링바', wear: 45, status: 'good', rul: '6.2h' },
            { name: '페이스밀', wear: 58, status: 'warning', rul: '3.5h' }
        ];

        // Alert logs
        const alertLogs = [
            { time: '14:32:15', type: 'warning', message: '머시닝센터 #1 볼스크류 마모 경고 (0.008mm)' },
            { time: '14:28:41', type: 'error', message: '프레스 #1 진동 이상 감지 (4.2mm/s)' },
            { time: '14:15:22', type: 'info', message: 'CNC 선반 #2 정기 점검 완료' },
            { time: '13:58:10', type: 'warning', message: '공구 인서트 T1 교체 필요 (RUL 0.8h)' },
            { time: '13:45:33', type: 'info', message: '평택공장 OEE 리포트 생성 완료' }
        ];

        // Three.js setup
        let scene, camera, renderer;
        let currentEquipment = null;
        let sensorMarkers = [];
        let showSensors = true;
        let wireframeMode = false;
        let autoRotate = true;
        let rotationAngle = 0;

        function initThreeJS() {
            const container = document.getElementById('equipment-3d');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d1b2a);
            scene.fog = new THREE.Fog(0x0d1b2a, 10, 50);

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(8, 6, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Mouse interaction
            let isDragging = false;
            let previousMouseX = 0;

            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                autoRotate = false;
                previousMouseX = e.clientX;
            });

            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - previousMouseX;
                    rotationAngle += deltaX * 0.01;
                    previousMouseX = e.clientX;
                }
            });

            renderer.domElement.addEventListener('mouseup', () => isDragging = false);
            renderer.domElement.addEventListener('mouseleave', () => isDragging = false);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x2196f3, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0x90caf9, 0.5);
            pointLight.position.set(-5, 5, -5);
            scene.add(pointLight);

            // Grid
            const gridHelper = new THREE.GridHelper(20, 20, 0x1565c0, 0x0d1b2a);
            scene.add(gridHelper);

            createEquipment('cnc');
            animate();
        }

        function createEquipment(type) {
            if (currentEquipment) {
                scene.remove(currentEquipment);
            }
            sensorMarkers.forEach(marker => scene.remove(marker));
            sensorMarkers = [];

            const group = new THREE.Group();

            if (type === 'cnc') {
                // CNC Lathe
                const baseGeom = new THREE.BoxGeometry(6, 0.5, 3);
                const baseMat = new THREE.MeshPhongMaterial({ color: 0x1565c0, wireframe: wireframeMode });
                const base = new THREE.Mesh(baseGeom, baseMat);
                base.position.y = 0.25;
                group.add(base);

                // Headstock
                const headGeom = new THREE.BoxGeometry(1.5, 2, 2);
                const headMat = new THREE.MeshPhongMaterial({ color: 0x2196f3, wireframe: wireframeMode });
                const head = new THREE.Mesh(headGeom, headMat);
                head.position.set(-2, 1.5, 0);
                group.add(head);

                // Spindle
                const spindleGeom = new THREE.CylinderGeometry(0.3, 0.3, 1.5, 32);
                const spindleMat = new THREE.MeshPhongMaterial({ color: 0x90caf9, wireframe: wireframeMode });
                const spindle = new THREE.Mesh(spindleGeom, spindleMat);
                spindle.rotation.z = Math.PI / 2;
                spindle.position.set(-0.5, 1.5, 0);
                group.add(spindle);

                // Tailstock
                const tailGeom = new THREE.BoxGeometry(1, 1.5, 1.5);
                const tailMat = new THREE.MeshPhongMaterial({ color: 0x2196f3, wireframe: wireframeMode });
                const tail = new THREE.Mesh(tailGeom, tailMat);
                tail.position.set(2, 1.25, 0);
                group.add(tail);

                // Tool turret
                const turretGeom = new THREE.CylinderGeometry(0.4, 0.4, 0.8, 8);
                const turretMat = new THREE.MeshPhongMaterial({ color: 0x64b5f6, wireframe: wireframeMode });
                const turret = new THREE.Mesh(turretGeom, turretMat);
                turret.position.set(0, 2.5, 1);
                group.add(turret);

                addSensorMarker(group, -2, 2.5, 0, '📳 2.8mm/s');
                addSensorMarker(group, -0.5, 1.5, 1, '🌡️ 52°C');
                addSensorMarker(group, 0, 2.5, 1, '⚡ 18.5A');

            } else if (type === 'mct') {
                // Machining Center
                const baseGeom = new THREE.BoxGeometry(5, 0.5, 4);
                const baseMat = new THREE.MeshPhongMaterial({ color: 0x1565c0, wireframe: wireframeMode });
                const base = new THREE.Mesh(baseGeom, baseMat);
                base.position.y = 0.25;
                group.add(base);

                // Column
                const columnGeom = new THREE.BoxGeometry(1, 4, 1.5);
                const columnMat = new THREE.MeshPhongMaterial({ color: 0x2196f3, wireframe: wireframeMode });
                const column = new THREE.Mesh(columnGeom, columnMat);
                column.position.set(-1.8, 2.5, 0);
                group.add(column);

                // Spindle head
                const headGeom = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                const headMat = new THREE.MeshPhongMaterial({ color: 0x64b5f6, wireframe: wireframeMode });
                const head = new THREE.Mesh(headGeom, headMat);
                head.position.set(0, 3.5, 0);
                group.add(head);

                // Spindle
                const spindleGeom = new THREE.CylinderGeometry(0.2, 0.15, 1.2, 32);
                const spindleMat = new THREE.MeshPhongMaterial({ color: 0x90caf9, wireframe: wireframeMode });
                const spindle = new THREE.Mesh(spindleGeom, spindleMat);
                spindle.position.set(0, 2.5, 0);
                group.add(spindle);

                // Table
                const tableGeom = new THREE.BoxGeometry(3, 0.3, 2.5);
                const tableMat = new THREE.MeshPhongMaterial({ color: 0x1976d2, wireframe: wireframeMode });
                const table = new THREE.Mesh(tableGeom, tableMat);
                table.position.set(0.5, 0.65, 0);
                group.add(table);

                addSensorMarker(group, 0, 4.3, 0, '📳 3.2mm/s');
                addSensorMarker(group, 0, 2.5, 0.8, '🌡️ 48°C');
                addSensorMarker(group, 0.5, 0.9, 1, '📍 Position');

            } else if (type === 'injection') {
                // Injection molding machine
                const baseGeom = new THREE.BoxGeometry(7, 0.5, 2.5);
                const baseMat = new THREE.MeshPhongMaterial({ color: 0x1565c0, wireframe: wireframeMode });
                const base = new THREE.Mesh(baseGeom, baseMat);
                base.position.y = 0.25;
                group.add(base);

                // Injection unit
                const injGeom = new THREE.CylinderGeometry(0.4, 0.4, 3, 32);
                const injMat = new THREE.MeshPhongMaterial({ color: 0x2196f3, wireframe: wireframeMode });
                const inj = new THREE.Mesh(injGeom, injMat);
                inj.rotation.z = Math.PI / 2;
                inj.position.set(-2, 1.5, 0);
                group.add(inj);

                // Mold (fixed)
                const mold1Geom = new THREE.BoxGeometry(1, 2, 2);
                const mold1Mat = new THREE.MeshPhongMaterial({ color: 0x64b5f6, wireframe: wireframeMode });
                const mold1 = new THREE.Mesh(mold1Geom, mold1Mat);
                mold1.position.set(0.5, 1.5, 0);
                group.add(mold1);

                // Mold (moving)
                const mold2Geom = new THREE.BoxGeometry(1, 2, 2);
                const mold2Mat = new THREE.MeshPhongMaterial({ color: 0x90caf9, wireframe: wireframeMode });
                const mold2 = new THREE.Mesh(mold2Geom, mold2Mat);
                mold2.position.set(1.8, 1.5, 0);
                group.add(mold2);

                // Clamping unit
                const clampGeom = new THREE.BoxGeometry(1.5, 2.5, 2.5);
                const clampMat = new THREE.MeshPhongMaterial({ color: 0x1976d2, wireframe: wireframeMode });
                const clamp = new THREE.Mesh(clampGeom, clampMat);
                clamp.position.set(3, 1.5, 0);
                group.add(clamp);

                addSensorMarker(group, 0.5, 2.7, 0, '🌡️ 85°C');
                addSensorMarker(group, -2, 2, 0, '💨 145MPa');
                addSensorMarker(group, 3, 2.7, 0, '🔧 280ton');

            } else if (type === 'press') {
                // Press machine
                const baseGeom = new THREE.BoxGeometry(4, 0.8, 3);
                const baseMat = new THREE.MeshPhongMaterial({ color: 0x1565c0, wireframe: wireframeMode });
                const base = new THREE.Mesh(baseGeom, baseMat);
                base.position.y = 0.4;
                group.add(base);

                // Frame (C-type)
                const frameGeom = new THREE.BoxGeometry(0.8, 4, 2.5);
                const frameMat = new THREE.MeshPhongMaterial({ color: 0x2196f3, wireframe: wireframeMode });
                const frame = new THREE.Mesh(frameGeom, frameMat);
                frame.position.set(-1.3, 2.8, 0);
                group.add(frame);

                // Top frame
                const topGeom = new THREE.BoxGeometry(3.5, 0.8, 2.5);
                const topMat = new THREE.MeshPhongMaterial({ color: 0x2196f3, wireframe: wireframeMode });
                const top = new THREE.Mesh(topGeom, topMat);
                top.position.set(0.5, 4.4, 0);
                group.add(top);

                // Ram
                const ramGeom = new THREE.BoxGeometry(1.5, 1.5, 1.8);
                const ramMat = new THREE.MeshPhongMaterial({ color: 0x64b5f6, wireframe: wireframeMode });
                const ram = new THREE.Mesh(ramGeom, ramMat);
                ram.position.set(0.5, 3, 0);
                group.add(ram);

                // Die
                const dieGeom = new THREE.BoxGeometry(2, 0.5, 2);
                const dieMat = new THREE.MeshPhongMaterial({ color: 0x90caf9, wireframe: wireframeMode });
                const die = new THREE.Mesh(dieGeom, dieMat);
                die.position.set(0.5, 1.05, 0);
                group.add(die);

                addSensorMarker(group, 0.5, 1.5, 1, '🌡️ 120°C');
                addSensorMarker(group, 0.5, 3.8, 0, '💪 150ton');
                addSensorMarker(group, -1.3, 3.5, 1, '📳 4.2mm/s');
            }

            currentEquipment = group;
            scene.add(group);
        }

        function addSensorMarker(parent, x, y, z, label) {
            const sphereGeom = new THREE.SphereGeometry(0.12, 16, 16);
            const sphereMat = new THREE.MeshPhongMaterial({
                color: 0x00ff88,
                emissive: 0x00ff88,
                emissiveIntensity: 0.5
            });
            const sphere = new THREE.Mesh(sphereGeom, sphereMat);
            sphere.position.set(x, y, z);
            sphere.userData = { label };
            parent.add(sphere);
            sensorMarkers.push(sphere);

            const ringGeom = new THREE.RingGeometry(0.15, 0.2, 32);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x00ff88,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeom, ringMat);
            ring.position.set(x, y, z);
            ring.rotation.x = -Math.PI / 2;
            parent.add(ring);
            sensorMarkers.push(ring);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate) {
                rotationAngle += 0.005;
            }
            const radius = 12;
            camera.position.x = Math.sin(rotationAngle) * radius;
            camera.position.z = Math.cos(rotationAngle) * radius;
            camera.position.y = 6;
            camera.lookAt(0, 2, 0);

            sensorMarkers.forEach((marker, i) => {
                if (marker.geometry.type === 'RingGeometry') {
                    marker.scale.setScalar(1 + 0.3 * Math.sin(Date.now() * 0.003 + i));
                    marker.material.opacity = 0.5 - 0.3 * Math.sin(Date.now() * 0.003 + i);
                }
            });

            renderer.render(scene, camera);
        }

        function resetView() {
            rotationAngle = 0.8;
            autoRotate = true;
            camera.lookAt(0, 2, 0);
        }

        function toggleWireframe() {
            wireframeMode = !wireframeMode;
            const type = document.getElementById('equipmentSelect').value;
            createEquipment(type);
        }

        function toggleSensors() {
            showSensors = !showSensors;
            sensorMarkers.forEach(marker => {
                marker.visible = showSensors;
            });
        }

        // Update sensor display
        function updateSensorDisplay(type) {
            const data = equipmentData[type];
            const grid = document.getElementById('sensorGrid');
            document.getElementById('sensorEquipment').textContent = data.name;

            grid.innerHTML = data.sensors.map(sensor => {
                const percent = ((sensor.value - sensor.min) / (sensor.max - sensor.min)) * 100;
                let status = '';
                if (percent > 85) status = 'warning';
                if (percent > 95) status = 'danger';

                return `
                    <div class="sensor-card ${status}">
                        <div class="sensor-header">
                            <span class="sensor-name">${sensor.name}</span>
                            <span class="sensor-icon">${sensor.icon}</span>
                        </div>
                        <div class="sensor-value">${sensor.value}<span class="sensor-unit">${sensor.unit}</span></div>
                        <div class="sensor-range">${sensor.min} ~ ${sensor.max} ${sensor.unit}</div>
                        <div class="sensor-bar">
                            <div class="sensor-bar-fill" style="width: ${Math.min(percent, 100)}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update equipment list
        function updateEquipmentList() {
            const list = document.getElementById('equipmentList');
            const icons = { cnc: '🔄', mct: '🏭', injection: '💉', press: '🔧' };

            list.innerHTML = equipmentList.map(eq => `
                <div class="equipment-item" onclick="selectEquipment('${eq.type}')">
                    <div class="equipment-info">
                        <div class="equipment-icon">${icons[eq.type]}</div>
                        <div>
                            <div class="equipment-name">${eq.name}</div>
                            <div class="equipment-location">📍 ${eq.location}</div>
                        </div>
                    </div>
                    <div class="equipment-metrics">
                        <div class="metric">
                            <div class="metric-value">${eq.oee}%</div>
                            <div class="metric-label">OEE</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${eq.rul}h</div>
                            <div class="metric-label">RUL</div>
                        </div>
                        <span class="health-badge ${eq.health}">${eq.health === 'good' ? '정상' : eq.health === 'warning' ? '주의' : '위험'}</span>
                    </div>
                </div>
            `).join('');
        }

        function selectEquipment(type) {
            document.getElementById('equipmentSelect').value = type;
            createEquipment(type);
            updateSensorDisplay(type);
        }

        // Tool wear display
        function updateToolWear() {
            const grid = document.getElementById('toolGrid');
            const circumference = 2 * Math.PI * 24;

            grid.innerHTML = toolData.map(tool => {
                const offset = circumference - (tool.wear / 100) * circumference;
                return `
                    <div class="tool-card">
                        <div class="tool-name">${tool.name}</div>
                        <div class="tool-wear-circle">
                            <svg width="60" height="60">
                                <circle class="bg" cx="30" cy="30" r="24"/>
                                <circle class="progress ${tool.status}" cx="30" cy="30" r="24"
                                    stroke-dasharray="${circumference}"
                                    stroke-dashoffset="${offset}"/>
                            </svg>
                            <div class="tool-wear-value">${tool.wear}%</div>
                        </div>
                        <div class="tool-rul">RUL: ${tool.rul}</div>
                    </div>
                `;
            }).join('');
        }

        // Trend chart
        let trendChart;
        function initTrendChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');

            const labels = [];
            const now = new Date();
            for (let i = 23; i >= 0; i--) {
                const time = new Date(now - i * 3600000);
                labels.push(time.getHours() + ':00');
            }

            const generateData = (base, variance) => {
                return labels.map(() => base + (Math.random() - 0.5) * variance);
            };

            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: '스핀들 진동',
                            data: generateData(2.8, 1),
                            borderColor: '#2196f3',
                            backgroundColor: 'rgba(33, 150, 243, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: '경고 기준',
                            data: Array(24).fill(4),
                            borderColor: '#ff9800',
                            borderDash: [5, 5],
                            fill: false,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#90caf9' }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(144, 202, 249, 0.1)' },
                            ticks: { color: '#78909c' }
                        },
                        y: {
                            grid: { color: 'rgba(144, 202, 249, 0.1)' },
                            ticks: { color: '#78909c' },
                            min: 0,
                            max: 6
                        }
                    }
                }
            });
        }

        // Alert log
        function updateAlertLog() {
            const logList = document.getElementById('logList');
            logList.innerHTML = alertLogs.map(log => `
                <div class="log-item ${log.type}">
                    <span class="log-time">${log.time}</span>
                    <span class="log-message">${log.message}</span>
                </div>
            `).join('');
        }

        function addLogEntry(type, message) {
            const now = new Date();
            const time = now.toTimeString().split(' ')[0];
            alertLogs.unshift({ time, type, message });
            if (alertLogs.length > 20) alertLogs.pop();
            updateAlertLog();
        }

        // Factory switch
        function switchFactory(factory) {
            document.querySelectorAll('.factory-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            // Filter equipment list based on factory
        }

        // Real-time simulation
        function simulateRealTimeData() {
            Object.keys(equipmentData).forEach(key => {
                equipmentData[key].sensors.forEach(sensor => {
                    const variance = (sensor.max - sensor.min) * 0.02;
                    sensor.value = Math.max(sensor.min,
                        Math.min(sensor.max,
                            sensor.value + (Math.random() - 0.5) * variance
                        )
                    );
                    sensor.value = Math.round(sensor.value * 100) / 100;
                });
            });

            toolData.forEach(tool => {
                tool.wear = Math.min(100, tool.wear + Math.random() * 0.1);
                tool.wear = Math.round(tool.wear * 10) / 10;
                if (tool.wear > 80) tool.status = 'critical';
                else if (tool.wear > 60) tool.status = 'warning';
            });

            const currentType = document.getElementById('equipmentSelect').value;
            updateSensorDisplay(currentType);
            updateToolWear();

            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('ko-KR');

            if (Math.random() < 0.05) {
                const messages = [
                    { type: 'info', msg: 'CNC 선반 #3 가공 완료' },
                    { type: 'info', msg: '클린룸 청정도 정상 유지' },
                    { type: 'warning', msg: '공구 마모 예측 알림 발생' }
                ];
                const selected = messages[Math.floor(Math.random() * messages.length)];
                addLogEntry(selected.type, selected.msg);
            }
        }

        // Event listeners
        document.getElementById('equipmentSelect').addEventListener('change', (e) => {
            createEquipment(e.target.value);
            updateSensorDisplay(e.target.value);
        });

        window.addEventListener('resize', () => {
            const container = document.getElementById('equipment-3d');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initThreeJS();
            updateSensorDisplay('cnc');
            updateEquipmentList();
            updateToolWear();
            initTrendChart();
            updateAlertLog();

            setInterval(simulateRealTimeData, 2000);
        });
    </script>
</body>
</html>
