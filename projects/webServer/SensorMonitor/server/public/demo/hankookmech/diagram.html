<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>시스템 구성도 - 한국기계엔지니어링 스마트 파쇄기</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #0a0a1a;
            color: #fff;
            line-height: 1.8;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10,10,26,0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo { font-size: 1.3rem; font-weight: 700; color: #1a5f7a; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { color: #57c5b6; }

        /* Main Content */
        main {
            padding: 80px 20px 40px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #1a5f7a, #57c5b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .page-header p { color: #888; font-size: 1rem; }

        /* Diagram Container */
        .diagram-container {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            overflow-x: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .diagram-svg {
            width: 100%;
            min-width: 1200px;
            height: auto;
        }

        /* Layer styles */
        .layer-cloud { fill: #e3f2fd; }
        .layer-edge { fill: #fff8e1; }
        .layer-equip { fill: #e8f5e9; }
        .layer-sensor { fill: #fce4ec; }

        .layer-label {
            font-size: 14px;
            font-weight: bold;
        }

        /* Node styles */
        .node-cloud { fill: #1a5f7a; }
        .node-cloud-text { fill: #fff; font-size: 11px; }

        .node-ai { fill: #57c5b6; }
        .node-alert { fill: #ff6b6b; }
        .node-mobile { fill: #9b59b6; }

        .node-gateway { fill: #ff9800; }
        .node-gateway-text { fill: #fff; font-size: 10px; }

        .node-device { fill: #fff; stroke: #ff9800; stroke-width: 2; }
        .node-device-text { fill: #333; font-size: 10px; }

        .node-equipment { fill: #4caf50; }
        .node-equipment-text { fill: #fff; font-size: 11px; }

        .node-sensor { fill: #e91e63; }
        .node-sensor-text { fill: #fff; font-size: 9px; }

        /* Connection lines */
        .conn-data { stroke: #1565c0; stroke-width: 2; fill: none; }
        .conn-control { stroke: #ff8f00; stroke-width: 2; fill: none; }
        .conn-sensor { stroke: #c2185b; stroke-width: 2; fill: none; stroke-dasharray: 5,3; }
        .conn-equip { stroke: #2e7d32; stroke-width: 2; fill: none; }

        /* Animation */
        .data-flow {
            stroke-dasharray: 10, 5;
            animation: flow 1s linear infinite;
        }
        @keyframes flow {
            to { stroke-dashoffset: -15; }
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            max-width: 250px;
        }
        .tooltip.show { opacity: 1; }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #888;
            font-size: 0.85rem;
        }
        .legend-line {
            width: 30px;
            height: 3px;
            border-radius: 2px;
        }
        .legend-data { background: #1565c0; }
        .legend-control { background: #ff8f00; }
        .legend-sensor { background: #c2185b; background: repeating-linear-gradient(90deg, #c2185b 0, #c2185b 5px, transparent 5px, transparent 8px); }
        .legend-equip { background: #2e7d32; }

        /* Footer */
        footer {
            background: #050510;
            padding: 30px;
            text-align: center;
            color: #444;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 40px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .diagram-container { padding: 10px; }
            .legend { gap: 15px; }
        }
    </style>
</head>
<body>

        <div class="logo">한국기계엔지니어링</div>
        <div class="nav-links">
            <a href="index.html">홈</a>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip"></div>

    <script>
        // Tooltip functionality
        const tooltip = document.getElementById('tooltip');
        const tooltipElements = document.querySelectorAll('[data-tooltip]');

        tooltipElements.forEach(el => {
            el.style.cursor = 'pointer';

            el.addEventListener('mouseenter', (e) => {
                const text = el.getAttribute('data-tooltip');
                tooltip.textContent = text;
                tooltip.classList.add('show');
            });

            el.addEventListener('mousemove', (e) => {
                tooltip.style.left = (e.pageX + 15) + 'px';
                tooltip.style.top = (e.pageY + 15) + 'px';
            });

            el.addEventListener('mouseleave', () => {
                tooltip.classList.remove('show');
            });
        });
    </script>
