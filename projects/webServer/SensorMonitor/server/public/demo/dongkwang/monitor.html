<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>실시간 모니터링 - 동광계전 스마트 유통</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #1a5f7a;
            --secondary: #159895;
            --accent: #57c5b6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #0a1628;
            color: #fff;
            min-height: 100vh;
        }

        nav {
            background: rgba(10, 22, 40, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(87, 197, 182, 0.3);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #57c5b6, #159895);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #57c5b6;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .live-badge {
            background: #f44336;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .phone-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 0.85rem;
        }
        .phone-control label {
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            white-space: nowrap;
        }
        .phone-toggle {
            appearance: none;
            width: 44px;
            height: 24px;
            background: #333;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        .phone-toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        .phone-toggle:checked {
            background: linear-gradient(135deg, #1a5f7a, #159895);
        }
        .phone-toggle:checked::after {
            left: 22px;
        }
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #888;
        }
        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
            transition: background 0.3s;
        }
        .connection-dot.connected {
            background: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        .main-content {
            padding-top: 70px;
            display: grid;
            grid-template-columns: 1fr 380px;
            min-height: 100vh;
        }

        .viewer-section {
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .viewer-header h2 {
            font-size: 1.3rem;
        }

        .equipment-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .equipment-btn {
            padding: 8px 16px;
            border: 1px solid rgba(87, 197, 182, 0.3);
            border-radius: 20px;
            background: transparent;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .equipment-btn:hover {
            border-color: #57c5b6;
        }
        .equipment-btn.active {
            background: linear-gradient(135deg, #1a5f7a, #159895);
            border-color: #57c5b6;
            color: #fff;
        }

        #viewer {
            flex: 1;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(87, 197, 182, 0.2);
            border-radius: 20px;
            overflow: hidden;
            min-height: 500px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.03);
            padding: 10px 15px;
            border-radius: 10px;
        }
        .control-group label {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: 0.3s;
            border-radius: 26px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background: linear-gradient(135deg, #1a5f7a, #159895);
        }
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        .orientation-display {
            display: flex;
            gap: 20px;
            background: rgba(255,255,255,0.03);
            padding: 10px 20px;
            border-radius: 10px;
        }
        .orientation-item {
            text-align: center;
        }
        .orientation-label {
            font-size: 0.75rem;
            color: #666;
        }
        .orientation-value {
            font-size: 1.1rem;
            color: #57c5b6;
            font-weight: 600;
        }

        /* Sidebar */
        .sidebar {
            background: rgba(255,255,255,0.02);
            border-left: 1px solid rgba(87, 197, 182, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 70px);
        }

        .panel {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(87, 197, 182, 0.1);
            border-radius: 15px;
            padding: 20px;
        }
        .panel h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #57c5b6;
        }

        .sensor-item {
            margin-bottom: 15px;
        }
        .sensor-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .sensor-name {
            font-size: 0.85rem;
            color: #888;
        }
        .sensor-value {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .sensor-value.normal { color: #4caf50; }
        .sensor-value.warning { color: #ff9800; }
        .sensor-value.danger { color: #f44336; }

        .sensor-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .sensor-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s, background 0.3s;
        }
        .sensor-bar-fill.normal { background: linear-gradient(90deg, #4caf50, #81c784); }
        .sensor-bar-fill.warning { background: linear-gradient(90deg, #ff9800, #ffb74d); }
        .sensor-bar-fill.danger { background: linear-gradient(90deg, #f44336, #e57373); }

        .chart-container {
            position: relative;
            height: 180px;
        }
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.75rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .alert-list {
            max-height: 150px;
            overflow-y: auto;
        }
        .alert-item {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .alert-item.info {
            background: rgba(87, 197, 182, 0.1);
            border-left: 3px solid #57c5b6;
        }
        .alert-item.warning {
            background: rgba(255, 152, 0, 0.1);
            border-left: 3px solid #ff9800;
        }
        .alert-item.danger {
            background: rgba(244, 67, 54, 0.1);
            border-left: 3px solid #f44336;
        }
        .alert-time {
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
        }

        .scenario-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .scenario-btn {
            padding: 12px 15px;
            border: 1px solid rgba(87, 197, 182, 0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-size: 0.9rem;
        }
        .scenario-btn:hover {
            border-color: #57c5b6;
            background: rgba(87, 197, 182, 0.1);
        }
        .scenario-btn.active {
            border-color: #57c5b6;
            background: rgba(87, 197, 182, 0.2);
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .sidebar {
                max-height: none;
            }
            #viewer {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <div class="logo">DK Smart Distribution</div>
            <div class="nav-links">
                <a href="index.html">홈</a>
                <a href="system.html">시스템 구성</a>
                <a href="monitor.html" class="active">실시간 모니터링</a>
                <a href="about.html">UTTEC 소개</a>
            </div>
        </div>
        <div class="nav-right">
            <span class="live-badge">LIVE</span>
            <div class="phone-control">
                <label for="phoneToggle">스마트폰 연동</label>
                <input type="checkbox" id="phoneToggle" class="phone-toggle" onchange="togglePhoneConnection()">
            </div>
            <div class="connection-status">
                <div class="connection-dot" id="connectionDot"></div>
                <span id="connectionText">연결 대기</span>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="viewer-section">
            <div class="viewer-header">
                <h2>3D 전기설비 모니터링</h2>
                <div class="equipment-selector">
                    <button class="equipment-btn active" onclick="selectEquipment('panel')">배전반</button>
                    <button class="equipment-btn" onclick="selectEquipment('control')">제어반</button>
                    <button class="equipment-btn" onclick="selectEquipment('mcc')">MCC반</button>
                    <button class="equipment-btn" onclick="selectEquipment('mccb')">MCCB</button>
                </div>
            </div>

            <div id="viewer"></div>

            <div class="controls">
                <div class="control-group">
                    <label>자동 회전</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="autoRotate" onchange="toggleAutoRotate()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="orientation-display">
                    <div class="orientation-item">
                        <div class="orientation-label">Alpha</div>
                        <div class="orientation-value" id="alphaValue">0°</div>
                    </div>
                    <div class="orientation-item">
                        <div class="orientation-label">Beta</div>
                        <div class="orientation-value" id="betaValue">0°</div>
                    </div>
                    <div class="orientation-item">
                        <div class="orientation-label">Gamma</div>
                        <div class="orientation-value" id="gammaValue">0°</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h3>설비 상태</h3>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">전류</span>
                        <span class="sensor-value normal" id="current">45.2 A</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="currentBar" style="width: 45%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">온도</span>
                        <span class="sensor-value normal" id="temperature">38.5 °C</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="temperatureBar" style="width: 38%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">트립 횟수</span>
                        <span class="sensor-value normal" id="tripCount">128 회</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="tripCountBar" style="width: 12%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">접점 저항</span>
                        <span class="sensor-value normal" id="resistance">0.8 mΩ</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="resistanceBar" style="width: 16%"></div>
                    </div>
                </div>
                <div class="sensor-item">
                    <div class="sensor-header">
                        <span class="sensor-name">잔여 수명</span>
                        <span class="sensor-value normal" id="lifespan">87%</span>
                    </div>
                    <div class="sensor-bar">
                        <div class="sensor-bar-fill normal" id="lifespanBar" style="width: 87%"></div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>트렌드 (최근 60초)</h3>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
                <div class="chart-legend">
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #57c5b6"></span>
                        <span>전류</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #ff9800"></span>
                        <span>온도</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #9c27b0"></span>
                        <span>저항</span>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>알림</h3>
                <div class="alert-list" id="alertList">
                    <div class="alert-item info">
                        배전반 #1 정상 운전 중
                        <div class="alert-time">방금 전</div>
                    </div>
                    <div class="alert-item info">
                        MCCB 상태 양호
                        <div class="alert-time">2분 전</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>시나리오</h3>
                <div class="scenario-buttons">
                    <button class="scenario-btn active" onclick="setScenario('normal')">
                        정상 운전
                    </button>
                    <button class="scenario-btn" onclick="setScenario('overload')">
                        과부하 상태
                    </button>
                    <button class="scenario-btn" onclick="setScenario('overheat')">
                        과열 경고
                    </button>
                    <button class="scenario-btn" onclick="setScenario('aging')">
                        접점 열화
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Three.js Setup
        let scene, camera, renderer, equipment;
        let autoRotate = false;
        let targetRotation = { x: 0, y: 0, z: 0 };
        let currentRotation = { x: 0, y: 0, z: 0 };
        let useRealOrientation = false;
        let calibratedOrientation = { roll: 0, pitch: 0 };
        let ws = null;

        function init() {
            const container = document.getElementById('viewer');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1628);

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(5, 4, 6);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0x57c5b6, 0.5);
            pointLight.position.set(-5, 5, -5);
            scene.add(pointLight);

            // Grid
            const gridHelper = new THREE.GridHelper(10, 20, 0x1a5f7a, 0x0d2b3a);
            scene.add(gridHelper);

            // Create Panel (배전반)
            createPanel();

            window.addEventListener('resize', onWindowResize);
            animate();

            initWebSocket();
        }

        function createPanel() {
            if (equipment) scene.remove(equipment);
            equipment = new THREE.Group();

            // Main cabinet
            const cabinetGeometry = new THREE.BoxGeometry(2.5, 3, 1);
            const cabinetMaterial = new THREE.MeshPhongMaterial({ color: 0x455a64 });
            const cabinet = new THREE.Mesh(cabinetGeometry, cabinetMaterial);
            cabinet.position.y = 1.5;
            equipment.add(cabinet);

            // Door frame
            const doorGeometry = new THREE.BoxGeometry(2.3, 2.8, 0.05);
            const doorMaterial = new THREE.MeshPhongMaterial({ color: 0x607d8b });
            const door = new THREE.Mesh(doorGeometry, doorMaterial);
            door.position.set(0, 1.5, 0.53);
            equipment.add(door);

            // MCCB slots (3x3)
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const slotGeometry = new THREE.BoxGeometry(0.5, 0.6, 0.1);
                    const slotMaterial = new THREE.MeshPhongMaterial({ color: 0x1a5f7a });
                    const slot = new THREE.Mesh(slotGeometry, slotMaterial);
                    slot.position.set(-0.7 + col * 0.7, 2.2 - row * 0.7, 0.56);
                    equipment.add(slot);

                    // LED indicator
                    const ledGeometry = new THREE.SphereGeometry(0.05, 16, 16);
                    const ledMaterial = new THREE.MeshPhongMaterial({
                        color: 0x4caf50,
                        emissive: 0x4caf50,
                        emissiveIntensity: 0.5
                    });
                    const led = new THREE.Mesh(ledGeometry, ledMaterial);
                    led.position.set(-0.7 + col * 0.7, 2.5 - row * 0.7, 0.58);
                    equipment.add(led);
                }
            }

            // Meter display
            const meterGeometry = new THREE.BoxGeometry(0.8, 0.4, 0.08);
            const meterMaterial = new THREE.MeshPhongMaterial({ color: 0x263238 });
            const meter = new THREE.Mesh(meterGeometry, meterMaterial);
            meter.position.set(0, 0.5, 0.56);
            equipment.add(meter);

            // Sensor indicators
            const sensorGeometry = new THREE.SphereGeometry(0.06, 16, 16);
            const sensorMaterial = new THREE.MeshPhongMaterial({
                color: 0x57c5b6,
                emissive: 0x57c5b6,
                emissiveIntensity: 0.5
            });

            [[1, 2.5, 0.6], [-1, 2.5, 0.6], [0, 0.3, 0.6]].forEach(pos => {
                const sensor = new THREE.Mesh(sensorGeometry, sensorMaterial);
                sensor.position.set(...pos);
                equipment.add(sensor);
            });

            scene.add(equipment);
        }

        function createControl() {
            if (equipment) scene.remove(equipment);
            equipment = new THREE.Group();

            // Main cabinet
            const cabinetGeometry = new THREE.BoxGeometry(2, 2.5, 0.8);
            const cabinetMaterial = new THREE.MeshPhongMaterial({ color: 0x37474f });
            const cabinet = new THREE.Mesh(cabinetGeometry, cabinetMaterial);
            cabinet.position.y = 1.25;
            equipment.add(cabinet);

            // Control panel face
            const panelGeometry = new THREE.BoxGeometry(1.8, 2.3, 0.05);
            const panelMaterial = new THREE.MeshPhongMaterial({ color: 0x546e7a });
            const panel = new THREE.Mesh(panelGeometry, panelMaterial);
            panel.position.set(0, 1.25, 0.43);
            equipment.add(panel);

            // Relays (2x4)
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 2; col++) {
                    const relayGeometry = new THREE.BoxGeometry(0.4, 0.35, 0.15);
                    const relayMaterial = new THREE.MeshPhongMaterial({ color: 0x159895 });
                    const relay = new THREE.Mesh(relayGeometry, relayMaterial);
                    relay.position.set(-0.35 + col * 0.7, 2 - row * 0.45, 0.5);
                    equipment.add(relay);
                }
            }

            // Timers
            for (let i = 0; i < 2; i++) {
                const timerGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.1, 16);
                const timerMaterial = new THREE.MeshPhongMaterial({ color: 0x1a5f7a });
                const timer = new THREE.Mesh(timerGeometry, timerMaterial);
                timer.position.set(-0.4 + i * 0.8, 0.4, 0.45);
                timer.rotation.x = Math.PI / 2;
                equipment.add(timer);
            }

            // Sensors
            const sensorGeometry = new THREE.SphereGeometry(0.05, 16, 16);
            const sensorMaterial = new THREE.MeshPhongMaterial({
                color: 0x57c5b6,
                emissive: 0x57c5b6,
                emissiveIntensity: 0.5
            });
            [[0.7, 2.2, 0.5], [0.7, 1.3, 0.5], [0, 0.3, 0.5]].forEach(pos => {
                const sensor = new THREE.Mesh(sensorGeometry, sensorMaterial);
                sensor.position.set(...pos);
                equipment.add(sensor);
            });

            scene.add(equipment);
        }

        function createMCC() {
            if (equipment) scene.remove(equipment);
            equipment = new THREE.Group();

            // Main cabinet (taller)
            const cabinetGeometry = new THREE.BoxGeometry(3, 3.5, 1.2);
            const cabinetMaterial = new THREE.MeshPhongMaterial({ color: 0x455a64 });
            const cabinet = new THREE.Mesh(cabinetGeometry, cabinetMaterial);
            cabinet.position.y = 1.75;
            equipment.add(cabinet);

            // Motor starters (2x3)
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 2; col++) {
                    const starterGeometry = new THREE.BoxGeometry(0.8, 0.7, 0.2);
                    const starterMaterial = new THREE.MeshPhongMaterial({ color: 0x1a5f7a });
                    const starter = new THREE.Mesh(starterGeometry, starterMaterial);
                    starter.position.set(-0.6 + col * 1.2, 2.8 - row * 0.9, 0.65);
                    equipment.add(starter);

                    // Status LED
                    const ledGeometry = new THREE.SphereGeometry(0.06, 16, 16);
                    const ledMaterial = new THREE.MeshPhongMaterial({
                        color: 0x4caf50,
                        emissive: 0x4caf50,
                        emissiveIntensity: 0.5
                    });
                    const led = new THREE.Mesh(ledGeometry, ledMaterial);
                    led.position.set(-0.6 + col * 1.2, 3.15 - row * 0.9, 0.7);
                    equipment.add(led);
                }
            }

            // Inverter units
            for (let i = 0; i < 2; i++) {
                const invGeometry = new THREE.BoxGeometry(0.6, 0.5, 0.15);
                const invMaterial = new THREE.MeshPhongMaterial({ color: 0x159895 });
                const inverter = new THREE.Mesh(invGeometry, invMaterial);
                inverter.position.set(-0.5 + i * 1, 0.5, 0.65);
                equipment.add(inverter);
            }

            scene.add(equipment);
        }

        function createMCCB() {
            if (equipment) scene.remove(equipment);
            equipment = new THREE.Group();

            // MCCB body
            const bodyGeometry = new THREE.BoxGeometry(1.5, 2, 0.8);
            const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x263238 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1;
            equipment.add(body);

            // Front face
            const faceGeometry = new THREE.BoxGeometry(1.4, 1.9, 0.05);
            const faceMaterial = new THREE.MeshPhongMaterial({ color: 0x1a5f7a });
            const face = new THREE.Mesh(faceGeometry, faceMaterial);
            face.position.set(0, 1, 0.43);
            equipment.add(face);

            // Handle
            const handleGeometry = new THREE.BoxGeometry(0.3, 0.6, 0.15);
            const handleMaterial = new THREE.MeshPhongMaterial({ color: 0xff5722 });
            const handle = new THREE.Mesh(handleGeometry, handleMaterial);
            handle.position.set(0, 1.3, 0.5);
            equipment.add(handle);

            // Terminals (top and bottom)
            for (let i = 0; i < 3; i++) {
                // Top
                const topTerminal = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.08, 0.3, 16),
                    new THREE.MeshPhongMaterial({ color: 0x757575 })
                );
                topTerminal.position.set(-0.4 + i * 0.4, 2.15, 0);
                equipment.add(topTerminal);

                // Bottom
                const bottomTerminal = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.08, 0.3, 16),
                    new THREE.MeshPhongMaterial({ color: 0x757575 })
                );
                bottomTerminal.position.set(-0.4 + i * 0.4, -0.15, 0);
                equipment.add(bottomTerminal);
            }

            // Status indicator
            const statusGeometry = new THREE.SphereGeometry(0.08, 16, 16);
            const statusMaterial = new THREE.MeshPhongMaterial({
                color: 0x4caf50,
                emissive: 0x4caf50,
                emissiveIntensity: 0.6
            });
            const status = new THREE.Mesh(statusGeometry, statusMaterial);
            status.position.set(0.5, 1.7, 0.48);
            equipment.add(status);

            // CT sensor
            const ctGeometry = new THREE.TorusGeometry(0.15, 0.05, 16, 32);
            const ctMaterial = new THREE.MeshPhongMaterial({ color: 0x57c5b6 });
            const ct = new THREE.Mesh(ctGeometry, ctMaterial);
            ct.position.set(0, 2.3, 0);
            ct.rotation.x = Math.PI / 2;
            equipment.add(ct);

            scene.add(equipment);
        }

        function selectEquipment(type) {
            document.querySelectorAll('.equipment-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            switch(type) {
                case 'panel': createPanel(); break;
                case 'control': createControl(); break;
                case 'mcc': createMCC(); break;
                case 'mccb': createMCCB(); break;
            }
        }

        function toggleAutoRotate() {
            autoRotate = document.getElementById('autoRotate').checked;
        }

        function onWindowResize() {
            const container = document.getElementById('viewer');
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // WebSocket
        function initWebSocket() {
            const wsUrl = `ws://${window.location.host}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                updateConnectionStatus(true);
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'calibrateReset') {
                        targetRotation = { x: 0, y: 0, z: 0 };
                        currentRotation = { x: 0, y: 0, z: 0 };
                        calibratedOrientation = { roll: 0, pitch: 0 };
                        if (equipment) {
                            equipment.rotation.x = 0;
                            equipment.rotation.y = 0;
                            equipment.rotation.z = 0;
                        }
                        updateOrientationDisplay(0, 0, 0);
                        return;
                    }
                    if (data.type === 'calibratedOrientation') {
                        calibratedOrientation = { roll: data.roll || 0, pitch: data.pitch || 0 };
                        if (useRealOrientation) {
                            updateOrientationDisplay(0, calibratedOrientation.pitch, calibratedOrientation.roll);
                        }
                        return;
                    }
                } catch (e) {}
            };

            ws.onclose = function() {
                updateConnectionStatus(false);
                setTimeout(initWebSocket, 3000);
            };
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('connectionDot');
            const text = document.getElementById('connectionText');
            if (connected) {
                dot.classList.add('connected');
                text.textContent = '연결됨';
            } else {
                dot.classList.remove('connected');
                text.textContent = '연결 대기';
            }
        }

        function togglePhoneConnection() {
            useRealOrientation = document.getElementById('phoneToggle').checked;
            if (!useRealOrientation) {
                targetRotation = { x: 0, y: 0, z: 0 };
                currentRotation = { x: 0, y: 0, z: 0 };
                calibratedOrientation = { roll: 0, pitch: 0 };
                if (equipment) {
                    equipment.rotation.x = 0;
                    equipment.rotation.y = 0;
                    equipment.rotation.z = 0;
                }
                updateOrientationDisplay(0, 0, 0);
            }
        }

        function updateOrientationDisplay(alpha, beta, gamma) {
            document.getElementById('alphaValue').textContent = Math.round(alpha) + '°';
            document.getElementById('betaValue').textContent = Math.round(beta) + '°';
            document.getElementById('gammaValue').textContent = Math.round(gamma) + '°';
        }

        function animate() {
            requestAnimationFrame(animate);

            if (equipment) {
                if (useRealOrientation) {
                    const toRad = Math.PI / 180;
                    targetRotation.z = calibratedOrientation.roll * toRad;
                    targetRotation.x = calibratedOrientation.pitch * toRad;

                    currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
                    currentRotation.z += (targetRotation.z - currentRotation.z) * 0.1;
                    equipment.rotation.x = currentRotation.x;
                    equipment.rotation.z = currentRotation.z;
                    equipment.rotation.y = Math.sin(Date.now() * 0.0005) * 0.05;
                } else if (autoRotate) {
                    equipment.rotation.y += 0.005;
                }
            }

            renderer.render(scene, camera);
        }

        // Sensor simulation
        let currentScenario = 'normal';
        let degradeCounter = 0;

        let sensorValues = {
            current: { current: 45, target: 45, unit: 'A' },
            temperature: { current: 38, target: 38, unit: '°C' },
            tripCount: { current: 128, target: 128, unit: '회' },
            resistance: { current: 0.8, target: 0.8, unit: 'mΩ' },
            lifespan: { current: 87, target: 87, unit: '%' }
        };

        const thresholds = {
            current: { warning: 70, danger: 85, max: 100 },
            temperature: { warning: 55, danger: 70, max: 100 },
            tripCount: { warning: 800, danger: 900, max: 1000 },
            resistance: { warning: 3, danger: 4, max: 5 },
            lifespan: { warning: 30, danger: 15, max: 100 }
        };

        // Trend chart
        let trendChart = null;
        let trendData = { labels: [], current: [], temperature: [], resistance: [] };
        const maxDataPoints = 60;

        function initTrendChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: trendData.labels,
                    datasets: [
                        {
                            label: '전류',
                            data: trendData.current,
                            borderColor: '#57c5b6',
                            backgroundColor: 'rgba(87, 197, 182, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            fill: true
                        },
                        {
                            label: '온도',
                            data: trendData.temperature,
                            borderColor: '#ff9800',
                            backgroundColor: 'rgba(255, 152, 0, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            fill: true,
                            yAxisID: 'y1'
                        },
                        {
                            label: '저항',
                            data: trendData.resistance,
                            borderColor: '#9c27b0',
                            backgroundColor: 'rgba(156, 39, 176, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            fill: true,
                            yAxisID: 'y2'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(10, 22, 40, 0.9)',
                            titleColor: '#fff',
                            bodyColor: '#aaa'
                        }
                    },
                    scales: {
                        x: { display: false },
                        y: {
                            position: 'left',
                            min: 0,
                            max: 100,
                            ticks: { color: '#666', font: { size: 10 } },
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            title: { display: true, text: 'A', color: '#57c5b6', font: { size: 9 } }
                        },
                        y1: {
                            position: 'right',
                            min: 0,
                            max: 100,
                            ticks: { color: '#666', font: { size: 10 } },
                            grid: { display: false },
                            title: { display: true, text: '°C', color: '#ff9800', font: { size: 9 } }
                        },
                        y2: {
                            display: false,
                            min: 0,
                            max: 5
                        }
                    },
                    animation: { duration: 300 }
                }
            });
        }

        function updateTrendChart() {
            const now = new Date();
            const timeLabel = now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

            trendData.labels.push(timeLabel);
            trendData.current.push(sensorValues.current.current);
            trendData.temperature.push(sensorValues.temperature.current);
            trendData.resistance.push(sensorValues.resistance.current);

            if (trendData.labels.length > maxDataPoints) {
                trendData.labels.shift();
                trendData.current.shift();
                trendData.temperature.shift();
                trendData.resistance.shift();
            }

            if (trendChart) trendChart.update('none');
        }

        function setScenario(scenario) {
            currentScenario = scenario;
            degradeCounter = 0;
            document.querySelectorAll('.scenario-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            switch(scenario) {
                case 'overload':
                    addAlert('warning', '과부하 상태 감지 - 전류 급증');
                    break;
                case 'overheat':
                    addAlert('danger', '과열 경고 - 온도 상승 감지');
                    break;
                case 'aging':
                    addAlert('warning', '접점 열화 진행 - 저항 증가');
                    break;
                case 'normal':
                    addAlert('info', '정상 운전 모드');
                    break;
            }
        }

        function addAlert(type, message) {
            const alertList = document.getElementById('alertList');
            const alert = document.createElement('div');
            alert.className = `alert-item ${type}`;
            alert.innerHTML = `${message}<div class="alert-time">방금 전</div>`;
            alertList.insertBefore(alert, alertList.firstChild);
            if (alertList.children.length > 5) {
                alertList.removeChild(alertList.lastChild);
            }
        }

        function generateTargetValues() {
            const scenarios = {
                normal: {
                    current: 40 + Math.random() * 15,
                    temperature: 35 + Math.random() * 10,
                    tripCount: 128,
                    resistance: 0.6 + Math.random() * 0.4,
                    lifespan: 87
                },
                overload: {
                    current: 75 + Math.random() * 15 + degradeCounter * 0.5,
                    temperature: 50 + Math.random() * 10,
                    tripCount: 128 + Math.floor(degradeCounter / 5),
                    resistance: 1 + Math.random() * 0.5,
                    lifespan: 85 - degradeCounter * 0.2
                },
                overheat: {
                    current: 55 + Math.random() * 10,
                    temperature: 60 + Math.random() * 15 + degradeCounter * 0.8,
                    tripCount: 128,
                    resistance: 1.2 + Math.random() * 0.5,
                    lifespan: 82 - degradeCounter * 0.3
                },
                aging: {
                    current: 45 + Math.random() * 10,
                    temperature: 45 + Math.random() * 8,
                    tripCount: 128,
                    resistance: 2.5 + Math.random() * 1 + degradeCounter * 0.1,
                    lifespan: 75 - degradeCounter * 0.5
                }
            };

            const targets = scenarios[currentScenario];
            Object.keys(targets).forEach(key => {
                sensorValues[key].target = targets[key];
            });

            if (currentScenario !== 'normal') {
                degradeCounter += 0.5;
            }
        }

        function updateSensorDisplay() {
            Object.keys(sensorValues).forEach(key => {
                const sensor = sensorValues[key];
                const threshold = thresholds[key];

                sensor.current += (sensor.target - sensor.current) * 0.15;

                const valueEl = document.getElementById(key);
                const barEl = document.getElementById(key + 'Bar');

                if (!valueEl || !barEl) return;

                let percent = (sensor.current / threshold.max) * 100;
                percent = Math.min(100, Math.max(0, percent));

                let status = 'normal';
                if (key === 'lifespan') {
                    if (sensor.current <= threshold.danger) status = 'danger';
                    else if (sensor.current <= threshold.warning) status = 'warning';
                } else {
                    if (sensor.current >= threshold.danger) status = 'danger';
                    else if (sensor.current >= threshold.warning) status = 'warning';
                }

                if (key === 'tripCount') {
                    valueEl.textContent = Math.round(sensor.current) + ' ' + sensor.unit;
                } else if (key === 'lifespan') {
                    valueEl.textContent = Math.round(sensor.current) + sensor.unit;
                    percent = sensor.current;
                } else {
                    valueEl.textContent = sensor.current.toFixed(1) + ' ' + sensor.unit;
                }

                valueEl.className = 'sensor-value ' + status;
                barEl.className = 'sensor-bar-fill ' + status;
                barEl.style.width = percent + '%';
            });
        }

        // Initialize
        init();
        initTrendChart();

        setInterval(generateTargetValues, 2000);
        setInterval(updateTrendChart, 1000);
        setInterval(() => {
            updateSensorDisplay();
        }, 100);

        generateTargetValues();
        updateSensorDisplay();
        updateTrendChart();
    </script>
</body>
</html>
