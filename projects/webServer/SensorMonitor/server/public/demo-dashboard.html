<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트팩토리 모니터링 - 데모</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #fff;
            overflow-x: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid #333;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .company-name {
            font-size: 1.5rem;
            font-weight: 600;
        }
        .demo-badge {
            background: #ff6b6b;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .header-right {
            display: flex;
            gap: 15px;
        }
        .header-btn {
            padding: 8px 16px;
            border: 1px solid #444;
            background: transparent;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .header-btn:hover {
            background: #333;
            border-color: #00d4ff;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            height: calc(100vh - 70px);
        }
        .visualization-area {
            position: relative;
        }
        #canvas3d {
            width: 100%;
            height: 100%;
        }
        .sidebar {
            background: rgba(20,20,40,0.95);
            border-left: 1px solid #333;
            overflow-y: auto;
            padding: 20px;
        }
        .section-title {
            font-size: 1rem;
            color: #00d4ff;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }
        .equipment-list {
            margin-bottom: 25px;
        }
        .equipment-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .equipment-item:hover {
            background: rgba(255,255,255,0.08);
        }
        .equipment-item.selected {
            border-color: var(--company-color, #00d4ff);
            background: rgba(0,212,255,0.1);
        }
        .equipment-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 12px;
        }
        .status-normal { background: #00ff88; }
        .status-warning { background: #ffaa00; }
        .status-critical { background: #ff4444; animation: blink 0.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .equipment-info {
            flex: 1;
        }
        .equipment-name {
            font-weight: 500;
            margin-bottom: 2px;
        }
        .equipment-location {
            font-size: 0.75rem;
            color: #888;
        }
        .sensor-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }
        .sensor-card {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .sensor-card.warning {
            border: 1px solid #ffaa00;
            background: rgba(255,170,0,0.1);
        }
        .sensor-card.critical {
            border: 1px solid #ff4444;
            background: rgba(255,68,68,0.1);
        }
        .sensor-label {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 5px;
        }
        .sensor-value {
            font-size: 1.5rem;
            font-weight: 600;
        }
        .sensor-unit {
            font-size: 0.8rem;
            color: #666;
        }
        .sensor-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .sensor-bar-fill {
            height: 100%;
            background: #00ff88;
            border-radius: 2px;
            transition: width 0.3s;
        }
        .sensor-bar-fill.warning { background: #ffaa00; }
        .sensor-bar-fill.critical { background: #ff4444; }
        .chart-container {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .chart-container canvas {
            max-height: 200px;
        }
        .scenario-control {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 15px;
        }
        .scenario-select {
            width: 100%;
            padding: 10px;
            background: #1a1a2e;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .scenario-desc {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 15px;
        }
        .scenario-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            border: none;
            color: #000;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .scenario-btn:hover {
            transform: scale(1.02);
        }
        .overlay-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .overlay-title {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }
        .overlay-value {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .back-link {
            color: #888;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-link:hover {
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="/demo.html" class="back-link">← 목록</a>
            <div class="company-name" id="companyName">Loading...</div>
            <span class="demo-badge">DEMO MODE</span>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="toggleFullscreen()">전체화면</button>
            <button class="header-btn" onclick="resetView()">뷰 초기화</button>
        </div>
    </div>

    <div class="main-content">
        <div class="visualization-area">
            <div id="canvas3d"></div>
            <div class="overlay-info">
                <div class="overlay-title">선택된 설비</div>
                <div class="overlay-value" id="selectedEquipmentName">-</div>
            </div>
        </div>

        <div class="sidebar">
            <div class="section-title">설비 현황</div>
            <div class="equipment-list" id="equipmentList"></div>

            <div class="section-title">실시간 센서 데이터</div>
            <div class="sensor-cards" id="sensorCards"></div>

            <div class="section-title">트렌드 (최근 5분)</div>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>

            <div class="section-title">데모 시나리오</div>
            <div class="scenario-control">
                <select class="scenario-select" id="scenarioSelect">
                    <option value="normal">정상 운전</option>
                    <option value="degrading">점진적 이상 (베어링 마모)</option>
                    <option value="anomaly">급격한 이상 (과부하)</option>
                    <option value="maintenance">정비 필요</option>
                </select>
                <div class="scenario-desc" id="scenarioDesc">모든 설비가 정상 범위 내에서 운전</div>
                <button class="scenario-btn" onclick="applyScenario()">시나리오 적용</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        let companyConfig = null;
        let equipmentTypes = null;
        let selectedEquipment = null;
        let currentScenario = 'normal';
        let simulationData = {};
        let trendChart = null;
        let trendData = { labels: [], datasets: [] };

        // Three.js variables
        let scene, camera, renderer, equipmentMeshes = {};

        // Get company ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const companyId = urlParams.get('company') || 'hankook';

        // Load configuration
        async function loadConfig() {
            try {
                const [companyRes, equipmentRes] = await Promise.all([
                    fetch('/api/demo/companies'),
                    fetch('/api/demo/equipment')
                ]);

                const companyData = await companyRes.json();
                equipmentTypes = await equipmentRes.json();

                companyConfig = companyData.companies.find(c => c.id === companyId);
                if (!companyConfig) {
                    alert('Company not found');
                    window.location.href = '/demo.html';
                    return;
                }

                document.getElementById('companyName').textContent = companyConfig.name;
                document.title = `${companyConfig.name} - 스마트팩토리 모니터링`;
                document.documentElement.style.setProperty('--company-color', companyConfig.color);

                initializeSimulation();
                renderEquipmentList();
                init3D();
                startSimulation();

                // Select first equipment by default
                if (companyConfig.equipment.length > 0) {
                    selectEquipment(companyConfig.equipment[0].id);
                }
            } catch (error) {
                console.error('Failed to load config:', error);
            }
        }

        function initializeSimulation() {
            companyConfig.equipment.forEach(eq => {
                const eqType = equipmentTypes.equipment_types[eq.type];
                if (!eqType) return;

                simulationData[eq.id] = {
                    status: 'normal',
                    sensors: {}
                };

                eqType.sensors.forEach(sensor => {
                    const [min, max] = sensor.normal;
                    const baseValue = min + (max - min) * 0.5;
                    simulationData[eq.id].sensors[sensor.id] = {
                        value: baseValue,
                        base: baseValue,
                        trend: 0,
                        variance: (max - min) * 0.1
                    };
                });
            });
        }

        function renderEquipmentList() {
            const container = document.getElementById('equipmentList');
            container.innerHTML = companyConfig.equipment.map(eq => {
                const data = simulationData[eq.id];
                return `
                    <div class="equipment-item" id="eq-${eq.id}" onclick="selectEquipment('${eq.id}')">
                        <div class="equipment-status status-${data?.status || 'normal'}"></div>
                        <div class="equipment-info">
                            <div class="equipment-name">${eq.name}</div>
                            <div class="equipment-location">${eq.location}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectEquipment(eqId) {
            selectedEquipment = eqId;

            // Update UI
            document.querySelectorAll('.equipment-item').forEach(el => {
                el.classList.remove('selected');
            });
            document.getElementById(`eq-${eqId}`)?.classList.add('selected');

            const eq = companyConfig.equipment.find(e => e.id === eqId);
            document.getElementById('selectedEquipmentName').textContent = eq?.name || '-';

            // Highlight 3D model
            highlightEquipment(eqId);

            // Update sensor cards
            updateSensorCards();

            // Reset chart
            initTrendChart();
        }

        function updateSensorCards() {
            if (!selectedEquipment) return;

            const eq = companyConfig.equipment.find(e => e.id === selectedEquipment);
            const eqType = equipmentTypes.equipment_types[eq.type];
            const data = simulationData[selectedEquipment];

            if (!eqType || !data) return;

            const container = document.getElementById('sensorCards');
            container.innerHTML = eqType.sensors.map(sensor => {
                const sensorData = data.sensors[sensor.id];
                const value = sensorData?.value || 0;
                const status = getSensorStatus(value, sensor);
                const percentage = calculatePercentage(value, sensor);

                return `
                    <div class="sensor-card ${status}">
                        <div class="sensor-label">${sensor.name}</div>
                        <div class="sensor-value">${value.toFixed(1)}<span class="sensor-unit">${sensor.unit}</span></div>
                        <div class="sensor-bar">
                            <div class="sensor-bar-fill ${status}" style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getSensorStatus(value, sensor) {
            const [critMin, critMax] = sensor.critical;
            const [warnMin, warnMax] = sensor.warning;

            if (value >= critMin && value <= critMax) return 'critical';
            if (value >= warnMin && value <= warnMax) return 'warning';
            return '';
        }

        function calculatePercentage(value, sensor) {
            const allRanges = [...sensor.normal, ...sensor.warning, ...sensor.critical];
            const min = Math.min(...allRanges.filter(v => v !== 999));
            const max = Math.max(...allRanges.filter(v => v !== 999));
            return Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100));
        }

        function initTrendChart() {
            if (!selectedEquipment) return;

            const eq = companyConfig.equipment.find(e => e.id === selectedEquipment);
            const eqType = equipmentTypes.equipment_types[eq.type];

            if (trendChart) {
                trendChart.destroy();
            }

            const colors = ['#00d4ff', '#00ff88', '#ffaa00', '#ff6b6b', '#aa66ff'];

            trendData = {
                labels: [],
                datasets: eqType.sensors.slice(0, 3).map((sensor, i) => ({
                    label: sensor.name,
                    data: [],
                    borderColor: colors[i],
                    backgroundColor: 'transparent',
                    tension: 0.4,
                    pointRadius: 0
                }))
            };

            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: trendData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#888', boxWidth: 12, padding: 8 }
                        }
                    },
                    scales: {
                        x: {
                            display: false
                        },
                        y: {
                            ticks: { color: '#666' },
                            grid: { color: '#333' }
                        }
                    }
                }
            });
        }

        function updateTrendChart() {
            if (!trendChart || !selectedEquipment) return;

            const eq = companyConfig.equipment.find(e => e.id === selectedEquipment);
            const eqType = equipmentTypes.equipment_types[eq.type];
            const data = simulationData[selectedEquipment];

            const now = new Date().toLocaleTimeString('ko-KR', { hour12: false });
            trendData.labels.push(now);

            if (trendData.labels.length > 60) {
                trendData.labels.shift();
            }

            eqType.sensors.slice(0, 3).forEach((sensor, i) => {
                const value = data.sensors[sensor.id]?.value || 0;
                trendData.datasets[i].data.push(value);
                if (trendData.datasets[i].data.length > 60) {
                    trendData.datasets[i].data.shift();
                }
            });

            trendChart.update('none');
        }

        // 3D Visualization
        function init3D() {
            const container = document.getElementById('canvas3d');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);

            camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
            camera.position.set(15, 12, 15);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // Floor
            const floorGeometry = new THREE.PlaneGeometry(30, 30);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                metalness: 0.5,
                roughness: 0.8
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.1;
            scene.add(floor);

            // Grid
            const gridHelper = new THREE.GridHelper(30, 30, 0x333333, 0x222222);
            scene.add(gridHelper);

            // Create equipment meshes
            createEquipmentMeshes();

            // Animation loop
            animate();

            // Handle resize
            window.addEventListener('resize', onWindowResize);

            // Mouse interaction
            setupMouseControls();
        }

        function createEquipmentMeshes() {
            const positions = [
                [-6, 0, -4], [-2, 0, -4], [2, 0, -4], [6, 0, -4],
                [-6, 0, 2], [-2, 0, 2], [2, 0, 2], [6, 0, 2]
            ];

            companyConfig.equipment.forEach((eq, index) => {
                const eqType = equipmentTypes.equipment_types[eq.type];
                if (!eqType) return;

                const pos = positions[index] || [index * 4 - 6, 0, 0];
                const mesh = createEquipmentMesh(eq.type, eqType.model3d.color);
                mesh.position.set(pos[0], 2, pos[2]);
                mesh.userData = { equipmentId: eq.id, type: eq.type };

                equipmentMeshes[eq.id] = mesh;
                scene.add(mesh);

                // Label
                // Could add 3D text labels here
            });
        }

        function createEquipmentMesh(type, colorHex) {
            const color = parseInt(colorHex.replace('#', '0x'));
            let geometry, material;

            material = new THREE.MeshStandardMaterial({
                color: color,
                metalness: 0.6,
                roughness: 0.4
            });

            switch (type) {
                case 'crusher':
                case 'mixer':
                    // Cylinder with hopper
                    const group = new THREE.Group();
                    geometry = new THREE.CylinderGeometry(1.5, 1.5, 3, 16);
                    const body = new THREE.Mesh(geometry, material);
                    group.add(body);

                    const hopperGeom = new THREE.ConeGeometry(1, 1.5, 16);
                    const hopper = new THREE.Mesh(hopperGeom, material);
                    hopper.position.y = 2.25;
                    hopper.rotation.x = Math.PI;
                    group.add(hopper);
                    return group;

                case 'dust_collector':
                    geometry = new THREE.CylinderGeometry(1.2, 1.2, 5, 16);
                    return new THREE.Mesh(geometry, material);

                case 'cnc':
                case 'injector':
                    geometry = new THREE.BoxGeometry(3, 2.5, 2);
                    return new THREE.Mesh(geometry, material);

                case 'press':
                    const pressGroup = new THREE.Group();
                    const base = new THREE.Mesh(
                        new THREE.BoxGeometry(2.5, 1, 2),
                        material
                    );
                    base.position.y = -1;
                    pressGroup.add(base);

                    const frame = new THREE.Mesh(
                        new THREE.BoxGeometry(2.5, 4, 0.3),
                        material
                    );
                    frame.position.z = -0.85;
                    pressGroup.add(frame);

                    const ram = new THREE.Mesh(
                        new THREE.BoxGeometry(2, 1, 1.5),
                        material
                    );
                    ram.position.y = 1;
                    pressGroup.add(ram);
                    return pressGroup;

                case 'conveyor':
                    const convGroup = new THREE.Group();
                    const belt = new THREE.Mesh(
                        new THREE.BoxGeometry(6, 0.3, 1.5),
                        new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.3, roughness: 0.7 })
                    );
                    convGroup.add(belt);

                    const leg1 = new THREE.Mesh(
                        new THREE.BoxGeometry(0.2, 1.5, 0.2),
                        material
                    );
                    leg1.position.set(-2.5, -0.9, 0.5);
                    convGroup.add(leg1);

                    const leg2 = leg1.clone();
                    leg2.position.set(2.5, -0.9, 0.5);
                    convGroup.add(leg2);

                    const leg3 = leg1.clone();
                    leg3.position.set(-2.5, -0.9, -0.5);
                    convGroup.add(leg3);

                    const leg4 = leg1.clone();
                    leg4.position.set(2.5, -0.9, -0.5);
                    convGroup.add(leg4);
                    return convGroup;

                case 'extruder':
                    geometry = new THREE.CylinderGeometry(0.8, 0.8, 5, 16);
                    const ext = new THREE.Mesh(geometry, material);
                    ext.rotation.z = Math.PI / 2;
                    return ext;

                default:
                    geometry = new THREE.BoxGeometry(2, 2, 2);
                    return new THREE.Mesh(geometry, material);
            }
        }

        function highlightEquipment(eqId) {
            Object.keys(equipmentMeshes).forEach(id => {
                const mesh = equipmentMeshes[id];
                const isSelected = id === eqId;

                mesh.traverse(child => {
                    if (child.isMesh) {
                        child.material.emissive = new THREE.Color(isSelected ? 0x003366 : 0x000000);
                        child.material.emissiveIntensity = isSelected ? 0.5 : 0;
                    }
                });
            });
        }

        function updateEquipmentColors() {
            Object.keys(equipmentMeshes).forEach(eqId => {
                const mesh = equipmentMeshes[eqId];
                const data = simulationData[eqId];
                if (!data) return;

                let statusColor;
                switch (data.status) {
                    case 'critical': statusColor = 0xff0000; break;
                    case 'warning': statusColor = 0xffaa00; break;
                    default: statusColor = null;
                }

                if (statusColor && eqId !== selectedEquipment) {
                    mesh.traverse(child => {
                        if (child.isMesh) {
                            child.material.emissive = new THREE.Color(statusColor);
                            child.material.emissiveIntensity = 0.3;
                        }
                    });
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotate equipment slightly
            const time = Date.now() * 0.001;
            Object.values(equipmentMeshes).forEach(mesh => {
                if (mesh.userData.type === 'crusher' || mesh.userData.type === 'mixer') {
                    mesh.rotation.y = Math.sin(time) * 0.1;
                }
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas3d');
            const width = container.clientWidth;
            const height = container.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function setupMouseControls() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            const canvas = renderer.domElement;

            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                const theta = deltaX * 0.01;
                const phi = deltaY * 0.01;

                const radius = camera.position.length();
                const currentTheta = Math.atan2(camera.position.x, camera.position.z);
                const currentPhi = Math.acos(camera.position.y / radius);

                const newTheta = currentTheta + theta;
                const newPhi = Math.max(0.1, Math.min(Math.PI - 0.1, currentPhi + phi));

                camera.position.x = radius * Math.sin(newPhi) * Math.sin(newTheta);
                camera.position.y = radius * Math.cos(newPhi);
                camera.position.z = radius * Math.sin(newPhi) * Math.cos(newTheta);

                camera.lookAt(0, 0, 0);

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            canvas.addEventListener('mouseup', () => isDragging = false);
            canvas.addEventListener('mouseleave', () => isDragging = false);

            canvas.addEventListener('wheel', (e) => {
                const zoomSpeed = 0.1;
                const direction = e.deltaY > 0 ? 1 : -1;
                const newRadius = camera.position.length() * (1 + direction * zoomSpeed);

                if (newRadius > 5 && newRadius < 50) {
                    camera.position.normalize().multiplyScalar(newRadius);
                }
            });
        }

        function resetView() {
            camera.position.set(15, 12, 15);
            camera.lookAt(0, 0, 0);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Simulation Engine
        function startSimulation() {
            setInterval(updateSimulation, 1000);
        }

        function updateSimulation() {
            companyConfig.equipment.forEach(eq => {
                const data = simulationData[eq.id];
                const eqType = equipmentTypes.equipment_types[eq.type];
                if (!data || !eqType) return;

                let worstStatus = 'normal';

                eqType.sensors.forEach(sensor => {
                    const sensorData = data.sensors[sensor.id];
                    if (!sensorData) return;

                    // Apply scenario effects
                    let value = sensorData.base;
                    const variance = sensorData.variance;

                    // Random noise
                    value += (Math.random() - 0.5) * variance * 2;

                    // Scenario effects
                    if (currentScenario === 'degrading' && sensor.id === 'vibration') {
                        sensorData.trend += 0.02;
                        value += sensorData.trend;
                    } else if (currentScenario === 'anomaly') {
                        if (Math.random() < 0.1) {
                            value += variance * 5 * Math.random();
                        }
                    } else if (currentScenario === 'maintenance') {
                        value = sensorData.base + variance * 1.5;
                    }

                    sensorData.value = value;

                    // Check status
                    const status = getSensorStatus(value, sensor);
                    if (status === 'critical') worstStatus = 'critical';
                    else if (status === 'warning' && worstStatus !== 'critical') worstStatus = 'warning';
                });

                data.status = worstStatus;
            });

            // Update UI
            renderEquipmentList();
            updateSensorCards();
            updateTrendChart();
            updateEquipmentColors();
        }

        function applyScenario() {
            currentScenario = document.getElementById('scenarioSelect').value;

            // Reset trends
            Object.values(simulationData).forEach(data => {
                Object.values(data.sensors).forEach(sensor => {
                    sensor.trend = 0;
                });
            });

            const descriptions = {
                normal: '모든 설비가 정상 범위 내에서 운전',
                degrading: '분쇄기 #1의 베어링 진동이 점진적으로 증가',
                anomaly: '랜덤하게 급격한 이상치 발생',
                maintenance: '여러 설비에서 정비 필요 수준의 수치'
            };
            document.getElementById('scenarioDesc').textContent = descriptions[currentScenario];
        }

        // Scenario select change
        document.getElementById('scenarioSelect').addEventListener('change', function() {
            const descriptions = {
                normal: '모든 설비가 정상 범위 내에서 운전',
                degrading: '분쇄기 #1의 베어링 진동이 점진적으로 증가',
                anomaly: '랜덤하게 급격한 이상치 발생',
                maintenance: '여러 설비에서 정비 필요 수준의 수치'
            };
            document.getElementById('scenarioDesc').textContent = descriptions[this.value];
        });

        // Initialize
        loadConfig();
    </script>
</body>
</html>
