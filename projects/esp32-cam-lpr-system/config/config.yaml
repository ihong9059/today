# ESP32-CAM + Raspberry Pi License Plate Recognition System
# 설정 파일

# ============================================
# ESP32-CAM 카메라 설정
# ============================================
camera:
  # ESP32-CAM IP 주소
  url: "http://192.168.1.100"

  # 엔드포인트
  capture_endpoint: "/capture"
  stream_endpoint: ":81/stream"

  # 요청 타임아웃 (초)
  timeout: 5

  # 해상도 설정
  # UXGA(1600x1200), SXGA(1280x1024), XGA(1024x768)
  # SVGA(800x600), VGA(640x480), CIF(400x296), QVGA(320x240)
  resolution: "VGA"

  # JPEG 품질 (4-63, 낮을수록 좋음)
  quality: 10

# ============================================
# 이미지 처리 설정
# ============================================
image_processing:
  # 리사이즈 (0이면 원본 크기 유지)
  width: 640
  height: 480

  # 가우시안 블러 커널 크기 (홀수)
  blur_kernel: 5

  # Canny 엣지 검출 임계값
  canny_low: 50
  canny_high: 150

  # 번호판 면적 필터 (픽셀)
  min_plate_area: 1000
  max_plate_area: 50000

  # 번호판 가로세로 비율 필터
  # 한국 번호판: 약 2:1 ~ 5:1
  plate_aspect_ratio_min: 2.0
  plate_aspect_ratio_max: 6.0

# ============================================
# OCR 설정
# ============================================
ocr:
  # Tesseract 언어 설정
  # kor: 한국어, eng: 영어, kor+eng: 둘 다
  language: "kor+eng"

  # Page Segmentation Mode
  # 6: 단일 텍스트 블록
  # 7: 단일 텍스트 라인 (번호판에 적합)
  # 8: 단일 단어
  psm: 7

  # OCR Engine Mode
  # 0: Legacy only
  # 1: LSTM only
  # 2: Legacy + LSTM
  # 3: Default (기본값)
  oem: 3

  # 허용 문자 (숫자 + 한글)
  # 빈 문자열이면 기본값 사용
  whitelist: ""

# ============================================
# 로깅 설정
# ============================================
logging:
  # 로그 레벨: DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # 로그 파일 경로
  file: "logs/lpr.log"

  # 최대 로그 파일 크기 (MB)
  max_size_mb: 10

  # 백업 파일 수
  backup_count: 5

# ============================================
# 저장 설정
# ============================================
storage:
  # 이미지 저장 여부
  save_images: true

  # 저장 디렉토리
  image_dir: "captured_images"

  # 저장 형식
  save_format: "jpg"

  # JPEG 품질 (1-100)
  jpeg_quality: 85

  # 이미지 보관 기간 (일, 0이면 무제한)
  retention_days: 30

# ============================================
# 화이트리스트 설정
# ============================================
whitelist:
  # 화이트리스트 활성화
  enabled: false

  # 파일 경로
  file: "data/whitelist.txt"

  # 매칭 시 동작: allow, log, notify
  action_on_match: "allow"

  # 미매칭 시 동작: deny, log, notify
  action_on_mismatch: "log"

# ============================================
# 알림 설정
# ============================================
notifications:
  # GPIO 알림 (Raspberry Pi)
  gpio:
    enabled: false
    success_pin: 17      # 인식 성공 LED
    failure_pin: 27      # 인식 실패 LED
    buzzer_pin: 22       # 부저
    pulse_duration: 0.5  # 신호 지속 시간 (초)

  # 텔레그램 알림
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
    send_image: true

  # 이메일 알림
  email:
    enabled: false
    smtp_server: ""
    smtp_port: 587
    username: ""
    password: ""
    from_addr: ""
    to_addr: ""

# ============================================
# 성능 설정
# ============================================
performance:
  # 연속 모드 캡처 간격 (초)
  capture_interval: 3.0

  # 동일 번호판 재인식 방지 시간 (초)
  duplicate_timeout: 30

  # 최소 신뢰도 임계값 (%)
  min_confidence: 60

  # 스레드 수 (멀티 카메라 사용 시)
  num_workers: 1

# ============================================
# 디버그 설정
# ============================================
debug:
  # 디버그 모드
  enabled: false

  # 중간 결과 이미지 저장
  save_intermediate: false

  # 디버그 이미지 디렉토리
  debug_dir: "debug_images"

  # 화면 표시 (GUI 환경에서만)
  show_display: false
