<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- 배경 원 -->
  <circle cx="32" cy="32" r="30" fill="#0a0a1a" stroke="#dc2626" stroke-width="2"/>

  <!-- 이축 파쇄기 본체 -->
  <rect x="12" y="22" width="40" height="20" rx="3" fill="url(#grad1)"/>

  <!-- 상단 호퍼 -->
  <polygon points="20,22 44,22 40,12 24,12" fill="#c0c0c0"/>

  <!-- 두 개의 회전축 -->
  <line x1="10" y1="29" x2="54" y2="29" stroke="#444" stroke-width="3"/>
  <line x1="10" y1="35" x2="54" y2="35" stroke="#444" stroke-width="3"/>

  <!-- 커터 디스크들 (상단 축) -->
  <circle cx="18" cy="29" r="5" fill="url(#grad2)" stroke="#b45309" stroke-width="1"/>
  <circle cx="32" cy="29" r="5" fill="url(#grad2)" stroke="#b45309" stroke-width="1"/>
  <circle cx="46" cy="29" r="5" fill="url(#grad2)" stroke="#b45309" stroke-width="1"/>

  <!-- 커터 디스크들 (하단 축) -->
  <circle cx="25" cy="35" r="5" fill="url(#grad2)" stroke="#b45309" stroke-width="1"/>
  <circle cx="39" cy="35" r="5" fill="url(#grad2)" stroke="#b45309" stroke-width="1"/>

  <!-- 하단 배출구 -->
  <polygon points="22,42 42,42 38,52 26,52" fill="#808080"/>

  <!-- 작은 기어 디테일 -->
  <circle cx="18" cy="29" r="2" fill="#b45309"/>
  <circle cx="32" cy="29" r="2" fill="#b45309"/>
  <circle cx="46" cy="29" r="2" fill="#b45309"/>
  <circle cx="25" cy="35" r="2" fill="#b45309"/>
  <circle cx="39" cy="35" r="2" fill="#b45309"/>

  <!-- 회전 표시 화살표 -->
  <path d="M 55 26 A 6 6 0 0 1 55 32" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="55,32 57,29 53,29" fill="#00ff88"/>
</svg>
