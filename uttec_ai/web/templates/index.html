<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UTTEC AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #0ea5e9;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #1e1b4b;
            --darker: #0f0a2e;
            --white: #ffffff;
            --gray: #94a3b8;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 50%, #1a1a4a 100%);
            min-height: 100vh;
            color: var(--white);
            overflow: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        /* 헤더 */
        .header {
            text-align: center;
            padding: 15px 0;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--gray);
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            margin-right: 5px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 채팅 영역 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
        }

        .chat-container::-webkit-scrollbar {
            width: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 2px;
        }

        /* 메시지 */
        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .message.ai .avatar {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .message.user .avatar {
            background: linear-gradient(135deg, var(--success), #059669);
        }

        .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.9rem;
        }

        .message.ai .bubble {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px 16px 16px 4px;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 16px 16px 4px 16px;
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--gray);
            margin-top: 4px;
        }

        .message.user .message-time {
            text-align: right;
        }

        /* 타이핑 */
        .typing span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--primary-light);
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* 입력 영역 */
        .input-container {
            flex-shrink: 0;
            padding: 10px 0;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 6px;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--white);
            font-size: 1rem;
            padding: 10px 12px;
            outline: none;
            font-family: inherit;
        }

        #messageInput::placeholder {
            color: var(--gray);
        }

        .btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .btn-send {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
        }

        .btn-send:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .btn-send:disabled {
            opacity: 0.5;
        }

        .btn-voice {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
        }

        .btn-voice.listening {
            background: var(--danger);
            animation: pulse-voice 1s infinite;
        }

        @keyframes pulse-voice {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        }

        .btn-tts {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            font-size: 0.9rem;
        }

        .btn-tts.active {
            background: var(--success);
        }

        /* 빠른 버튼 */
        .quick-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--gray);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .quick-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            color: var(--white);
        }

        /* 웰컴 */
        .welcome {
            text-align: center;
            padding: 30px 20px;
        }

        .welcome-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--gray);
            font-size: 0.9rem;
        }

        /* 코드 */
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 0.8rem;
        }

        code {
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 5px;
            border-radius: 3px;
        }

        @media (max-width: 600px) {
            .quick-actions { display: none; }
            .bubble { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo"><i class="fas fa-robot"></i> UTTEC AI</h1>
            <p class="subtitle">
                <span class="status-dot"></span>
                <span id="modelName">Groq</span>
                <span id="ttsStatus"></span>
            </p>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="welcome" id="welcome">
                <div class="welcome-icon"><i class="fas fa-comments"></i></div>
                <h2>안녕하세요!</h2>
                <p>무엇이든 물어보세요.</p>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <button class="btn btn-voice" id="voiceBtn" title="음성 입력">
                    <i class="fas fa-microphone"></i>
                </button>
                <input type="text" id="messageInput" placeholder="메시지 입력..." autocomplete="off">
                <button class="btn btn-tts" id="ttsBtn" title="음성 출력 켜기/끄기">
                    <i class="fas fa-volume-up"></i>
                </button>
                <button class="btn btn-send" id="sendBtn" title="전송">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="quick-actions">
                <button class="quick-btn" onclick="sendQuick('안녕하세요')">👋 인사</button>
                <button class="quick-btn" onclick="sendQuick('오늘 할일')">📋 할일</button>
                <button class="quick-btn" onclick="sendQuick('코드 도움')">💻 코딩</button>
                <button class="quick-btn" onclick="clearChat()">🗑️ 초기화</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const ttsBtn = document.getElementById('ttsBtn');
        const welcome = document.getElementById('welcome');
        const modelName = document.getElementById('modelName');
        const ttsStatus = document.getElementById('ttsStatus');

        let isProcessing = false;
        let ttsEnabled = false;

        // TTS 토글
        ttsBtn.addEventListener('click', () => {
            ttsEnabled = !ttsEnabled;
            ttsBtn.classList.toggle('active', ttsEnabled);
            ttsStatus.textContent = ttsEnabled ? ' · 🔊' : '';
            if (!ttsEnabled) {
                speechSynthesis.cancel();
            }
        });

        // 음성 인식
        let recognition = null;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                voiceBtn.classList.add('listening');
                voiceBtn.innerHTML = '<i class="fas fa-stop"></i>';
            };

            recognition.onend = () => {
                isListening = false;
                voiceBtn.classList.remove('listening');
                voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                messageInput.value = transcript;
                sendMessage();
            };

            recognition.onerror = () => {
                isListening = false;
                voiceBtn.classList.remove('listening');
                voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            };
        } else {
            voiceBtn.style.display = 'none';
        }

        voiceBtn.addEventListener('click', () => {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        // 메시지 전송
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isProcessing) return;

            if (welcome) welcome.style.display = 'none';

            addMessage(message, 'user');
            messageInput.value = '';
            isProcessing = true;
            sendBtn.disabled = true;

            const typingId = showTyping();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                removeTyping(typingId);

                if (data.success) {
                    addMessage(data.response, 'ai');
                    modelName.textContent = data.model || 'Groq';
                    if (ttsEnabled) speak(data.response);
                } else {
                    addMessage('오류: ' + data.response, 'ai');
                }
            } catch (error) {
                removeTyping(typingId);
                addMessage('서버 연결 오류', 'ai');
            }

            isProcessing = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
            const avatar = type === 'ai' ? '🤖' : '👤';

            let html = text
                .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');

            div.innerHTML = `
                <div class="avatar">${avatar}</div>
                <div>
                    <div class="bubble">${html}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message ai';
            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function speak(text) {
            if (!ttsEnabled || !('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            const clean = text.replace(/<[^>]*>/g, '').replace(/```[\s\S]*?```/g, '').substring(0, 200);
            const utterance = new SpeechSynthesisUtterance(clean);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;
            speechSynthesis.speak(utterance);
        }

        function sendQuick(text) {
            messageInput.value = text;
            sendMessage();
        }

        async function clearChat() {
            speechSynthesis.cancel();
            await fetch('/clear', { method: 'POST' });
            chatContainer.innerHTML = '';
            const w = document.createElement('div');
            w.className = 'welcome';
            w.id = 'welcome';
            w.innerHTML = '<div class="welcome-icon"><i class="fas fa-comments"></i></div><h2>대화가 초기화되었습니다</h2>';
            chatContainer.appendChild(w);
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        messageInput.focus();
    </script>
</body>
</html>
