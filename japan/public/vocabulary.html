<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단어 학습 - 이시우 일본 여행 회화</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=vHcrFHcr"></script>
</head>
<body class="vocabulary-page">
    <!-- 벚꽃 애니메이션 -->
    <div class="sakura-container" id="sakuraContainer"></div>
    <div class="container">
        <nav class="nav-bar">
            <a href="#" class="back-btn" id="backBtn">← 돌아가기</a>
            <span class="title">📚 단어 학습</span>
        </nav>

        <div class="vocabulary-container">
            <!-- 진행도 -->
            <div class="word-counter" id="wordCounter">1 / 35</div>
            <div class="progress-bar">
                <div class="fill" id="progressFill" style="width: 0%"></div>
            </div>

            <!-- 카테고리 표시 -->
            <div class="category-badge" id="categoryBadge" style="text-align: center; margin-bottom: 15px; color: #666;"></div>

            <!-- 플래시카드 -->
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="card-front" id="cardFront">
                    <div class="japanese" id="japanese"></div>
                    <div class="reading" id="reading"></div>
                    <button class="tts-btn" onclick="event.stopPropagation(); speak(currentWord.japanese)">🔊</button>
                </div>
                <div class="card-back" id="cardBack" style="display: none;">
                    <div class="korean" id="korean"></div>
                    <div class="example" id="example"></div>
                    <button class="tts-btn" onclick="event.stopPropagation(); speak(currentWord.example)" style="margin-top: 10px;">🔊 예문 듣기</button>
                </div>
            </div>

            <!-- 컨트롤 -->
            <div class="card-controls">
                <button class="btn btn-secondary" onclick="prevWord()">← 이전</button>
                <button class="btn btn-primary" onclick="flipCard()">뒤집기</button>
                <button class="btn btn-secondary" onclick="nextWord()">다음 →</button>
            </div>

            <!-- 알고 있음 체크 -->
            <div style="text-align: center; margin-top: 20px;">
                <label style="cursor: pointer; font-size: 1.1rem;">
                    <input type="checkbox" id="knownCheck" onchange="toggleKnown()">
                    ✓ 이 단어를 알고 있어요
                </label>
            </div>

            <!-- 완료 후 버튼 -->
            <div id="completeSection" style="display: none; text-align: center; margin-top: 30px;">
                <h3 style="margin-bottom: 15px;">🎉 단어 학습 완료!</h3>
                <p style="margin-bottom: 20px; color: #666;">알고 있는 단어: <span id="knownCount">0</span>개 / <span id="totalCount">35</span>개</p>
                <button class="btn btn-success" onclick="goToConversation()">회화 연습하러 가기 →</button>
            </div>
        </div>
    </div>

    <script src="/js/vocabulary.js"></script>
    <script src="/js/sakura.js"></script>
</body>
</html>
