<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시나리오 선택 - 이시우 일본 여행 회화</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="scenario-page">
    <!-- 벚꽃 애니메이션 -->
    <div class="sakura-container" id="sakuraContainer"></div>

    <div class="container">
        <nav class="nav-bar">
            <a href="/" class="back-btn">← 홈으로</a>
            <span class="title" id="scenarioTitle">시나리오</span>
            <span></span>
        </nav>

        <main>
            <section class="stage-selection" id="stages">
                <div class="stage-card" onclick="goToStage('vocabulary')">
                    <div class="icon">📚</div>
                    <h3>1단계: 단어 학습</h3>
                    <p>핵심 단어와 표현을 플래시카드로 학습</p>
                    <span class="time">⏱️ 7-10분</span>
                </div>

                <div class="stage-card" onclick="goToStage('conversation')">
                    <div class="icon">💬</div>
                    <h3>2단계: 회화 진행</h3>
                    <p>실제 상황을 시뮬레이션하며 대화 연습</p>
                    <span class="time">⏱️ 8-12분</span>
                </div>

                <div class="stage-card" onclick="goToStage('quiz')">
                    <div class="icon">🎮</div>
                    <h3>3단계: 퀴즈 & 게임</h3>
                    <p>재미있는 게임으로 복습</p>
                    <span class="time">⏱️ 5-8분</span>
                </div>
            </section>
        </main>

        <footer>
            <div class="footer-content">
                <p class="footer-logo">🇯🇵 이시우 일본 여행 회화 학습 🇯🇵</p>
                <p class="footer-copy">Made with ❤️ for Japanese learners</p>
            </div>
        </footer>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const scenarioId = params.get('id');

        const scenarioNames = {
            golf: '⛳ 골프장 & 식사',
            hotel: '🏨 호텔 체크인/아웃',
            restaurant: '🍽️ 레스토랑',
            train: '🚃 전철/지하철',
            convenience: '🏪 편의점/슈퍼',
            cafe: '☕ 카페',
            hospital: '🏥 병원/약국',
            hairsalon: '💇 미용실',
            airport: '✈️ 공항',
            taxi: '🚕 택시',
            phone: '📱 휴대폰 가게',
            department: '🛍️ 백화점',
            izakaya: '🍺 이자카야',
            realestate: '🏠 부동산',
            bank: '🏦 은행/환전',
            postoffice: '📮 우체국',
            sightseeing: '🏯 관광지',
            onsen: '♨️ 온천/료칸',
            karaoke: '🎤 노래방',
            business: '💼 비즈니스 미팅'
        };

        document.getElementById('scenarioTitle').textContent = scenarioNames[scenarioId] || scenarioId;
        document.title = (scenarioNames[scenarioId] || scenarioId) + ' - 이시우 일본 여행 회화';

        function goToStage(stage) {
            window.location.href = `/${stage}.html?scenario=${scenarioId}`;
        }
    </script>
    <script src="/js/sakura.js"></script>
</body>
</html>
