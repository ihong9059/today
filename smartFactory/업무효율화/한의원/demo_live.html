.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.btn { background:linear-gradient(135deg,#7b1fa2,#9c27b0); color:#fff; border:none; padding:12px 24px; border-radius:8px; font-size:15px; cursor:pointer; width:100%; margin-top:8px; transition:.2s; }
.btn:hover { background:linear-gradient(135deg,#6a1b9a,#8e24aa); transform:translateY(-1px); }

.result { margin-top:20px; display:none; }
.result.show { display:block; }
.result-title { background:#4a148c; color:#fff; padding:12px 16px; border-radius:8px 8px 0 0; font-size:15px; }
.result-body { background:#faf5ff; border:1px solid #e1bee7; border-top:none; border-radius:0 0 8px 8px; padding:16px; }

table { width:100%; border-collapse:collapse; margin:8px 0; font-size:13px; }
table th { background:#f3e5f5; color:#4a148c; padding:8px 10px; text-align:left; }
table td { padding:8px 10px; border-bottom:1px solid #f3e5f5; }

<script>
function showTab(n) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab'+n).classList.add('active');
  document.querySelectorAll('.tabs button')[n].classList.add('active');
}

function recommendPrescription() {
  const c = document.getElementById('rx_constitution').value;
  const s = document.getElementById('rx_symptom').value;
  const h = document.getElementById('rx_hanheol').value;
  const v = document.getElementById('rx_heosil').value;
  const el = document.getElementById('rx_result');

  if (!c || !s) { el.innerHTML='<div class="result-title">입력 오류</div><div class="result-body"><p>체질과 주증상을 모두 선택해주세요.</p></div>'; el.classList.add('show'); return; }

  const rx = prescriptionDB[c]?.[s];
  if (!rx) { el.innerHTML='<div class="result-title">데이터 없음</div><div class="result-body"><p>해당 조합의 처방 데이터가 없습니다.</p></div>'; el.classList.add('show'); return; }

  let hanheolNote = '';
  if (h === '한증') hanheolNote = '<div class="step"><strong>한증 가감:</strong> 건강(乾薑) 3g, 계지(桂枝) 3g 가미 → 온경산한(溫經散寒) 효과 강화</div>';
  if (h === '열증') hanheolNote = '<div class="step"><strong>열증 가감:</strong> 황금(黃芩) 4g, 치자(梔子) 4g 가미 → 청열사화(淸熱瀉火) 효과 추가</div>';

  let heosilNote = '';
  if (v === '허증') heosilNote = '<div class="step"><strong>허증 가감:</strong> 인삼(人蔘) 증량 또는 황기(黃芪) 가미 → 보기(補氣) 효과 강화</div>';
  if (v === '실증') heosilNote = '<div class="step"><strong>실증 가감:</strong> 지각(枳殼) 4g, 향부자(香附子) 4g 가미 → 행기파체(行氣破滯) 효과 추가</div>';

  el.innerHTML = `
    <div class="result-title">AI 처방 추천 결과</div>
    <div class="result-body">
      <div class="step"><strong>Step 1. 체질 확인:</strong> <span class="tag tag-purple">${c}</span> — 체질별 처방 원칙 적용</div>
      <div class="step"><strong>Step 2. 증상 매칭:</strong> "${s}" → 체질 맞춤 처방 DB 검색</div>
      <div class="step"><strong>Step 3. 변증 보정:</strong> 한열(${h}) + 허실(${v}) 정보로 가감 적용</div>
      <h4 style="color:#4a148c;margin:16px 0 8px;border-left:3px solid #9c27b0;padding-left:8px;">추천 처방: ${rx.name}</h4>
      <table>
        <tr><th style="width:120px">항목</th><th>내용</th></tr>
        <tr><td>처방명</td><td><strong>${rx.name}</strong></td></tr>
        <tr><td>약재 구성</td><td>${rx.herbs}</td></tr>
        <tr><td>처방 근거</td><td>${rx.reason}</td></tr>
        <tr><td>생활 지도</td><td>${rx.lifestyle}</td></tr>
      </table>
      ${hanheolNote}${heosilNote}
      <div class="warning"><strong>주의:</strong> AI 추천은 참고용이며, 실제 처방은 반드시 한의사의 직접 진찰(망문문절) 후 결정해야 합니다.</div>
    </div>`;
  el.classList.add('show');
}

function checkHerbInteraction() {
  const a = document.getElementById('herb_a').value;
  const b = document.getElementById('herb_b').value;
  const el = document.getElementById('herb_result');

  if (!a || !b) { el.innerHTML='<div class="result-title">입력 오류</div><div class="result-body"><p>약재 A와 B를 모두 선택해주세요.</p></div>'; el.classList.add('show'); return; }
  if (a === b) { el.innerHTML='<div class="result-title">동일 약재</div><div class="result-body"><p>같은 약재를 선택했습니다. 서로 다른 약재를 선택해주세요.</p></div>'; el.classList.add('show'); return; }

  const ha = herbInfo[a], hb = herbInfo[b];
  let conflict = null;

  for (const rule of shibaFan) {
    if ((rule.a.includes(a) && rule.b.includes(b)) || (rule.a.includes(b) && rule.b.includes(a))) {
      conflict = { type:'십팔반(十八反)', rule: rule.rule };
      break;
    }
  }

  let infoHTML = `
    <h4 style="color:#4a148c;margin:12px 0 8px;border-left:3px solid #9c27b0;padding-left:8px;">약재 정보 비교</h4>

      <tr><td>귀경</td><td>${ha.channel}</td><td>${hb.channel}</td></tr>
      <tr><td>효능</td><td>${ha.effect}</td><td>${hb.effect}</td></tr>
    </table>`;

  let resultHTML;
  if (conflict) {
    resultHTML = `
      <div class="result-title">상호작용 확인 결과</div>
      <div class="result-body">
        <div class="step"><strong>Step 1. 약재 확인:</strong> ${a}(${ha.hanja}) + ${b}(${hb.hanja})</div>
        <div class="step"><strong>Step 2. 십팔반 검색:</strong> <span class="tag tag-red">해당!</span> "${conflict.rule}"</div>
        <div class="step"><strong>Step 3. 판정:</strong> <strong style="color:#c62828;">배합 금기(配合禁忌)</strong></div>
        ${infoHTML}

        "${conflict.rule}"<br>
        이 두 약재는 상반(相反) 관계로, 병용 시 독성이 증가하거나 약효가 소실될 수 있습니다. 임상에서 절대 병용하지 마십시오.</div>

  } else {
