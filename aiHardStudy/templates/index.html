<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude AI 질문 시스템</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        h1 {
            text-align: center;
            color: #c4a35a;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 12px 20px;
            background: #16213e;
            border-radius: 8px;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }
        .status-dot.connected { background: #4ade80; }
        .status-dot.done { background: #60a5fa; }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-connect { background: #4ade80; color: #1a1a2e; }
        .btn-disconnect { background: #f87171; color: #fff; }
        .btn-ask {
            background: #c4a35a;
            color: #1a1a2e;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            margin-top: 10px;
        }
        .section {
            margin-bottom: 20px;
        }
        .section-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            padding: 16px;
            background: #16213e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1rem;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #c4a35a;
        }
        #question { height: 120px; }
        .answer-box {
            width: 100%;
            min-height: 300px;
            padding: 16px;
            background: #16213e;
            border: 1px solid #333;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.6;
            overflow-y: auto;
            max-height: 500px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #c4a35a;
        }
        .loading.active { display: block; }
        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Claude AI 질문 시스템</h1>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">미연결</span>
            </div>
            <div>
                <button class="btn btn-connect" id="btnConnect" onclick="connect()">연결</button>
                <button class="btn btn-disconnect" id="btnDisconnect" onclick="disconnect()" disabled>연결 종료</button>
            </div>
        </div>

        <div class="section">
            <div class="section-label">질문 입력</div>
            <textarea id="question" placeholder="Claude에게 질문할 내용을 입력하세요..." disabled></textarea>
            <button class="btn btn-ask" id="btnAsk" onclick="ask()" disabled>질문하기</button>
        </div>

        <div class="loading" id="loading">
            <span class="loading-dots">Claude가 답변 중</span>
        </div>

        <div class="section">
            <div class="section-label">답변</div>
            <div class="answer-box" id="answer">연결 후 질문해 주세요.</div>
        </div>
    </div>

    <script>
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const btnConnect = document.getElementById('btnConnect');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const btnAsk = document.getElementById('btnAsk');
        const question = document.getElementById('question');
        const answer = document.getElementById('answer');
        const loading = document.getElementById('loading');

        function setStatus(state, text) {
            statusDot.className = 'status-dot' + (state ? ' ' + state : '');
            statusText.textContent = text;
        }

        async function connect() {
            btnConnect.disabled = true;
            setStatus('', '연결 중...');
            try {
                const res = await fetch('/connect', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'connected') {
                    setStatus('connected', '연결됨 (' + data.version + ')');
                    btnDisconnect.disabled = false;
                    btnAsk.disabled = false;
                    question.disabled = false;
                    question.focus();
                    answer.textContent = 'Claude에게 질문해 보세요.';
                } else {
                    setStatus('', '연결 실패: ' + data.message);
                    btnConnect.disabled = false;
                }
            } catch (e) {
                setStatus('', '연결 실패');
                btnConnect.disabled = false;
            }
        }

        async function ask() {
            const q = question.value.trim();
            if (!q) return;

            btnAsk.disabled = true;
            question.disabled = true;
            loading.classList.add('active');
            answer.textContent = '';

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q })
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    answer.textContent = data.answer;
                } else {
                    answer.textContent = '[Error] ' + data.message;
                }
            } catch (e) {
                answer.textContent = '[Error] ' + e.message;
            } finally {
                loading.classList.remove('active');
                btnAsk.disabled = false;
                question.disabled = false;
                question.focus();
            }
        }

        async function disconnect() {
            try {
                await fetch('/disconnect', { method: 'POST' });
            } catch (e) {}
            setStatus('done', '완료');
            btnConnect.disabled = false;
            btnDisconnect.disabled = true;
            btnAsk.disabled = true;
            question.disabled = true;
            answer.textContent = '연결이 종료되었습니다.';
        }

        // Enter 키로 질문
        question.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!btnAsk.disabled) ask();
            }
        });
    </script>
</body>
</html>
