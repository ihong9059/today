<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>UTTEC Ask</title>
<style>
:root {
  --bg: #0F172A;
  --surface: #1E293B;
  --surface2: #334155;
  --border: #475569;
  --text: #F1F5F9;
  --text2: #94A3B8;
  --text3: #64748B;
  --primary: #3B82F6;
  --primary2: #2563EB;
  --accent: #8B5CF6;
  --cyan: #06B6D4;
  --orange: #F59E0B;
  --error: #EF4444;
  --green: #10B981;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px;
  min-height: 100vh; display: flex; flex-direction: column;
  -webkit-text-size-adjust: 100%;
}

/* Header */
.header {
  background: var(--surface); padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.header h1 { font-size: 18px; font-weight: 800; }
.header h1 span { color: var(--primary); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.status { font-size: 11px; padding: 3px 8px; border-radius: 8px; }
.status.ok { background: rgba(16,185,129,0.2); color: var(--green); }
.status.loading { background: rgba(59,130,246,0.2); color: var(--primary); }
.status.err { background: rgba(239,68,68,0.2); color: var(--error); }
.btn-icon {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; color: var(--text2);
  cursor: pointer; font-size: 14px; transition: all 0.2s;
}
.btn-icon:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-icon.active { background: var(--green); color: #fff; border-color: var(--green); }

/* Chat */
.chat-container {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 16px;
  scroll-behavior: smooth; padding-bottom: 140px;
}
.message { max-width: 90%; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

.message.user {
  align-self: flex-end; background: var(--primary); color: #fff;
  border-radius: 16px 16px 4px 16px; padding: 10px 14px;
  font-size: 14px; line-height: 1.6; word-break: break-word;
}
.message.assistant {
  align-self: flex-start; background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px 16px 16px 4px; padding: 14px 16px;
  font-size: 14px; line-height: 1.8; word-break: break-word; width: 100%;
}
.message.assistant .elapsed {
  display: block; text-align: right; font-size: 11px; color: var(--text3); margin-top: 8px;
}
.message.assistant .web-badge {
  display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px;
  background: rgba(6,182,212,0.2); color: var(--cyan); margin-bottom: 6px;
}

/* Markdown */
.message.assistant h1 { font-size: 18px; font-weight: 700; margin: 12px 0 6px; color: var(--primary); }
.message.assistant h2 { font-size: 16px; font-weight: 700; margin: 10px 0 6px; color: var(--cyan); }
.message.assistant h3 { font-size: 15px; font-weight: 600; margin: 8px 0 4px; }
.message.assistant p { margin: 6px 0; }
.message.assistant ul, .message.assistant ol { margin: 6px 0 6px 20px; }
.message.assistant li { margin: 3px 0; }
.message.assistant strong { color: var(--orange); }
.message.assistant code {
  background: #0D1117; padding: 2px 6px; border-radius: 4px;
  font-family: 'Consolas','Courier New', monospace; font-size: 13px; color: #E6DB74;
}
.message.assistant pre {
  background: #0D1117; border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; margin: 8px 0; overflow-x: auto;
  font-family: 'Consolas','Courier New', monospace; font-size: 12px;
  line-height: 1.5; color: #C9D1D9;
}
.message.assistant pre code { background: none; padding: 0; color: inherit; }
.message.assistant blockquote {
  border-left: 3px solid var(--primary); padding-left: 12px;
  margin: 8px 0; color: var(--text2); font-style: italic;
}
.message.assistant table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
.message.assistant th, .message.assistant td {
  border: 1px solid var(--border); padding: 6px 10px; text-align: left;
}
.message.assistant th { background: var(--surface2); font-weight: 600; }
.message.assistant hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.message.assistant a { color: var(--cyan); text-decoration: underline; }

/* Status message (searching, thinking) */
.status-msg {
  align-self: flex-start; background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 12px 16px;
  display: flex; align-items: center; gap: 8px;
  color: var(--text2); font-size: 13px;
}
.status-msg .dots span {
  display: inline-block; width: 6px; height: 6px;
  background: var(--primary); border-radius: 50%;
  animation: bounce 1.4s infinite; margin: 0 2px;
}
.status-msg .dots span:nth-child(2) { animation-delay: 0.2s; }
.status-msg .dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-8px); }
}
.status-msg.search { border-color: var(--cyan); }
.status-msg.search .dots span { background: var(--cyan); }

/* Approval buttons */
.approval-box {
  align-self: flex-start; background: var(--surface);
  border: 2px solid var(--orange); border-radius: 16px;
  padding: 16px; width: 100%; max-width: 400px;
  animation: fadeIn 0.3s ease;
}
.approval-box p { font-size: 14px; margin-bottom: 12px; color: var(--text); }
.approval-btns { display: flex; gap: 10px; }
.approval-btns button {
  flex: 1; padding: 10px; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-approve { background: var(--green); color: #fff; }
.btn-approve:hover { opacity: 0.85; }
.btn-deny { background: var(--surface2); color: var(--text2); border: 1px solid var(--border) !important; }
.btn-deny:hover { background: var(--error); color: #fff; }

/* Welcome */
.welcome {
  text-align: center; padding: 40px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.welcome-icon { font-size: 48px; }
.welcome h2 { font-size: 20px; font-weight: 700; }
.welcome p { color: var(--text2); font-size: 14px; line-height: 1.6; }
.examples { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 400px; margin-top: 8px; }
.example-btn {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; color: var(--text2);
  font-size: 13px; cursor: pointer; text-align: left; transition: all 0.2s;
}
.example-btn:hover { border-color: var(--primary); color: var(--text); }

/* Input */
.input-area {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
  z-index: 100;
}
.input-row { display: flex; gap: 8px; align-items: flex-end; max-width: 800px; margin: 0 auto; }
.input-wrap { flex: 1; }
.input-wrap textarea {
  width: 100%; min-height: 44px; max-height: 120px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 14px;
  color: var(--text); font-size: 15px; font-family: inherit;
  resize: none; outline: none; line-height: 1.5;
}
.input-wrap textarea:focus { border-color: var(--primary); }
.input-wrap textarea::placeholder { color: var(--text3); }
.btn-send {
  width: 44px; height: 44px; border: none; border-radius: 12px;
  background: var(--primary); color: #fff; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0;
}
.btn-send:disabled { background: var(--surface2); color: var(--text3); cursor: not-allowed; }
.btn-send:not(:disabled):hover { background: var(--primary2); }

/* Settings panel */
.settings-panel {
  display: none; position: fixed; top: 56px; right: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; z-index: 200;
  min-width: 220px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.settings-panel.show { display: block; }
.settings-panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: none; }
.setting-label { font-size: 13px; color: var(--text2); }
.toggle {
  position: relative; width: 44px; height: 24px; cursor: pointer;
}
.toggle input { display: none; }
.toggle .slider {
  position: absolute; inset: 0; background: var(--surface2);
  border-radius: 12px; transition: 0.3s;
}
.toggle .slider:before {
  content: ""; position: absolute; width: 18px; height: 18px;
  left: 3px; bottom: 3px; background: var(--text3);
  border-radius: 50%; transition: 0.3s;
}
.toggle input:checked + .slider { background: var(--green); }
.toggle input:checked + .slider:before { transform: translateX(20px); background: #fff; }

@media (min-width: 768px) {
  .chat-container { max-width: 800px; margin: 0 auto; width: 100%; }
  .input-area { padding: 16px 24px; }
  .message { max-width: 80%; }
  .message.assistant { max-width: 85%; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>

<div class="header">
  <h1><span>AI</span> Ask</h1>
  <div class="header-actions">
    <span id="statusBadge" class="status ok">Ready</span>
    <button class="btn-icon" id="settingsBtn" onclick="toggleSettings()" title="설정">&#9881;</button>
    <button class="btn-icon" onclick="clearChat()" title="대화 초기화">&#128465;</button>
  </div>
</div>

<!-- Settings -->
<div class="settings-panel" id="settingsPanel">
  <h3>설정</h3>
  <div class="setting-row">
    <span class="setting-label">웹 검색</span>
    <label class="toggle">
      <input type="checkbox" id="webSearchToggle" checked>
      <span class="slider"></span>
    </label>
  </div>
</div>

<div class="chat-container" id="chatContainer">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">&#128172;</div>
    <h2>무엇이든 물어보세요</h2>
    <p>기술, 과학, 일상, 코딩 등<br>어떤 질문이든 답변해 드립니다.<br><span style="color:var(--cyan);font-size:12px;">&#127760; 웹 검색으로 실시간 정보도 제공</span></p>
    <div class="examples">
      <button class="example-btn" onclick="useExample(this)">오늘 서울 날씨 알려줘</button>
      <button class="example-btn" onclick="useExample(this)">Python으로 웹 크롤러 만드는 방법</button>
      <button class="example-btn" onclick="useExample(this)">Docker와 가상머신의 차이점은?</button>
      <button class="example-btn" onclick="useExample(this)">오늘 점심 메뉴 추천해줘</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <div class="input-wrap">
      <textarea id="questionInput" placeholder="질문을 입력하세요..."
                rows="1" oninput="autoResize(this)"
                onkeydown="handleKeydown(event)"></textarea>
    </div>
    <button class="btn-send" id="sendBtn" onclick="sendQuestion()" disabled>&#10148;</button>
  </div>
</div>

<script>
const API_BASE = '';
const sessionId = 'session_' + Date.now().toString(36);
let isLoading = false;
let currentJobId = null;
let pollTimer = null;

const chatContainer = document.getElementById('chatContainer');
const questionInput = document.getElementById('questionInput');
const sendBtn = document.getElementById('sendBtn');
const statusBadge = document.getElementById('statusBadge');
const welcome = document.getElementById('welcome');

marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  sendBtn.disabled = !el.value.trim() || isLoading;
}

function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (!isLoading && questionInput.value.trim()) sendQuestion();
  }
}

function useExample(btn) {
  questionInput.value = btn.textContent;
  autoResize(questionInput);
  questionInput.focus();
}

function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('show');
}

// Close settings on outside click
document.addEventListener('click', (e) => {
  const panel = document.getElementById('settingsPanel');
  const btn = document.getElementById('settingsBtn');
  if (!panel.contains(e.target) && !btn.contains(e.target)) {
    panel.classList.remove('show');
  }
});

function renderMarkdown(text) {
  return DOMPurify.sanitize(marked.parse(text));
}

function scrollToBottom() {
  setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
}

function addMessage(role, content, elapsed, webSearchUsed) {
  if (welcome) welcome.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'message ' + role;
  if (role === 'user') {
    div.textContent = content;
  } else {
    let html = '';
    if (webSearchUsed) {
      html += '<span class="web-badge">&#127760; 웹 검색 결과 포함</span><br>';
    }
    html += renderMarkdown(content);
    if (elapsed) {
      html += '<span class="elapsed">' + elapsed + '초</span>';
    }
    div.innerHTML = html;
  }
  chatContainer.appendChild(div);
  scrollToBottom();
  return div;
}

function showStatusMsg(type, text) {
  removeStatusMsg();
  const div = document.createElement('div');
  div.className = 'status-msg ' + type;
  div.id = 'statusMsg';
  div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div> ' + text;
  chatContainer.appendChild(div);
  scrollToBottom();
}

function removeStatusMsg() {
  const el = document.getElementById('statusMsg');
  if (el) el.remove();
}

function showApproval(jobId, message) {
  removeStatusMsg();
  const div = document.createElement('div');
  div.className = 'approval-box';
  div.id = 'approvalBox';
  div.innerHTML = `
    <p>${message}</p>
    <div class="approval-btns">
      <button class="btn-approve" onclick="respondApproval('${jobId}', 'approve')">허용</button>
      <button class="btn-deny" onclick="respondApproval('${jobId}', 'deny')">거부</button>
    </div>
  `;
  chatContainer.appendChild(div);
  scrollToBottom();
}

function removeApproval() {
  const el = document.getElementById('approvalBox');
  if (el) el.remove();
}

async function respondApproval(jobId, response) {
  removeApproval();
  try {
    await fetch(API_BASE + '/api/v1/approve/' + jobId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ response }),
    });
    if (response === 'approve') {
      showStatusMsg('', 'AI가 답변을 생성하고 있습니다...');
    } else {
      addMessage('assistant', '요청이 취소되었습니다.');
      finishJob();
    }
  } catch (e) {
    addMessage('assistant', '오류: ' + e.message);
    finishJob();
  }
}

function setStatus(type, text) {
  statusBadge.className = 'status ' + type;
  statusBadge.textContent = text;
}

function finishJob() {
  isLoading = false;
  currentJobId = null;
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  sendBtn.disabled = false;
  questionInput.focus();
}

async function pollJobStatus(jobId) {
  try {
    const resp = await fetch(API_BASE + '/api/v1/status/' + jobId);
    if (!resp.ok) throw new Error('Status check failed');
    const data = await resp.json();

    switch (data.status) {
      case 'searching':
        showStatusMsg('search', '웹에서 정보를 검색하고 있습니다...');
        setStatus('loading', 'Searching...');
        break;

      case 'thinking':
        showStatusMsg('', 'AI가 답변을 생성하고 있습니다...');
        setStatus('loading', 'Thinking...');
        break;

      case 'awaiting_approval':
        setStatus('loading', 'Approval');
        showApproval(jobId, data.approval_message || '계속 진행할까요?');
        break;

      case 'done':
        removeStatusMsg();
        addMessage('assistant', data.answer, data.elapsed, !!data.web_context);
        setStatus('ok', 'Ready');
        finishJob();
        break;

      case 'error':
        removeStatusMsg();
        addMessage('assistant', '오류가 발생했습니다: ' + data.message);
        setStatus('err', 'Error');
        setTimeout(() => setStatus('ok', 'Ready'), 3000);
        finishJob();
        break;

      case 'cancelled':
        removeStatusMsg();
        setStatus('ok', 'Ready');
        finishJob();
        break;
    }
  } catch (e) {
    removeStatusMsg();
    addMessage('assistant', '연결 오류: ' + e.message);
    setStatus('err', 'Error');
    finishJob();
  }
}

async function sendQuestion() {
  const question = questionInput.value.trim();
  if (!question || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  questionInput.value = '';
  questionInput.style.height = 'auto';

  addMessage('user', question);
  showStatusMsg('', '처리 중...');
  setStatus('loading', 'Processing...');

  const webSearch = document.getElementById('webSearchToggle').checked;

  try {
    const resp = await fetch(API_BASE + '/api/v1/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, session_id: sessionId, web_search: webSearch }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: 'Server error' }));
      throw new Error(err.detail || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    currentJobId = data.job_id;

    // Poll every 1 second
    pollTimer = setInterval(() => pollJobStatus(data.job_id), 1000);

  } catch (err) {
    removeStatusMsg();
    addMessage('assistant', '오류: ' + err.message);
    setStatus('err', 'Error');
    setTimeout(() => setStatus('ok', 'Ready'), 3000);
    finishJob();
  }
}

async function clearChat() {
  if (!confirm('대화를 초기화할까요?')) return;
  try {
    await fetch(API_BASE + '/api/v1/clear', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId }),
    });
  } catch (e) {}
  chatContainer.innerHTML = '';
  if (welcome) { chatContainer.appendChild(welcome); welcome.style.display = ''; }
}

async function checkHealth() {
  try {
    const resp = await fetch(API_BASE + '/health');
    const data = await resp.json();
    setStatus(data.claude_available ? 'ok' : 'err',
              data.claude_available ? 'Ready' : 'No Claude');
  } catch (e) {
    setStatus('err', 'Offline');
  }
}

checkHealth();
questionInput.focus();
</script>
</body>
</html>
