#
# KC Certification Radio Test Configuration
#

# Shell & Console
CONFIG_CONSOLE_HANDLER=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024

# Radio Test dependencies
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_NRFX_TIMER0=y
CONFIG_NRFX_GPPI=y
CONFIG_CLOCK_CONTROL=y

# Security (required for radio test)
CONFIG_ENTROPY_GENERATOR=y
CONFIG_NRF_SECURITY=y

# FEM and float support
CONFIG_FEM_AL_LIB=y
CONFIG_PICOLIBC_IO_FLOAT=y

# UART for debug (UART2: P0.16 TX, P0.15 RX)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Radio Test Config
CONFIG_RADIO_TEST_RX_TIMEOUT=10

# Disable ANSI escape codes for clean output
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_VT100_COMMANDS=n
